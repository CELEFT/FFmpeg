name: Test ass-stack Only

on:
  workflow_dispatch:

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"

jobs:
  test-ass-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip \
            gperf gettext libexpat1-dev

      - name: Download and Unpack NDK
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* ${{ github.workspace }}/ndk
          rm ndk.zip
          chmod -R +x ${{ github.workspace }}/ndk

      - name: Set toolchain environment
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android36-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android36-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH

      - name: Build ass-stack
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"

          # 1. 编译 FreeType
          git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git && cd freetype
          ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
            --enable-static --enable-shared \
            --without-zlib --with-png=no --with-bzip2=no --with-harfbuzz=no \
            && make -j$(nproc) && make install && cd ..
          
          # 2. 编译 Fribidi
          git clone --depth 1 https://github.com/fribidi/fribidi.git && cd fribidi
          ./autogen.sh && ./configure --prefix=$PREFIX --build=x86_64-pc-linux-gnu --host=aarch64-linux-android \
            --enable-static --enable-shared && make -j$(nproc) && make install && cd ..
          
          # 3. 编译 HarfBuzz
          git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git && cd harfbuzz
          printf "[binaries]\nc='%s'\ncpp='%s'\nar='%s'\nstrip='%s'\npkgconfig='pkg-config'\n\n[properties]\nneeds_exe_wrapper=true\n\n[host_machine]\nsystem='android'\ncpu_family='aarch64'\ncpu='aarch64'\nendian='little'\n" "$CC" "$CXX" "$AR" "$STRIP" > $PWD/android.cross
          meson setup _build --cross-file $PWD/android.cross --prefix=$PREFIX --default-library=both --buildtype=release -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dicu=disabled -Dgraphite2=disabled -Dtests=disabled -Ddocs=disabled
          ninja -C _build && ninja -C _build install && cd ..
          
          # 4. 编译 Fontconfig
          git clone --depth 1 https://gitlab.freedesktop.org/fontconfig/fontconfig.git && cd fontconfig
          ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
            --enable-static --enable-shared --disable-docs \
            && make -j$(nproc) && make install && cd ..
          
          # 【终极修复】手动伪造 fribidi.pc 和 harfbuzz.pc 以满足 libass 的严格检查
          mkdir -p $PREFIX/lib/pkgconfig
          cat > $PREFIX/lib/pkgconfig/fribidi.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: fribidi
          Description: GNU FriBidi
          Version: 1.0.13
          Libs: -L\${libdir} -lfribidi
          Cflags: -I\${includedir}/fribidi
          EOF
          
          cat > $PREFIX/lib/pkgconfig/harfbuzz.pc <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: harfbuzz
          Description: HarfBuzz text shaping library
          Version: 8.0.0
          Libs: -L\${libdir} -lharfbuzz
          Cflags: -I\${includedir}/harfbuzz
          EOF
          
          # 5. 编译 libass
          git clone --depth 1 https://github.com/libass/libass.git && cd libass
          
          export FRIBIDI_CFLAGS="-I$PREFIX/include/fribidi -I$PREFIX/include"
          export FRIBIDI_LIBS="-L$PREFIX/lib -lfribidi"
          export HARFBUZZ_CFLAGS="-I$PREFIX/include/harfbuzz -I$PREFIX/include"
          export HARFBUZZ_LIBS="-L$PREFIX/lib -lharfbuzz"
          export FREETYPE_CFLAGS="-I$PREFIX/include/freetype2 -I$PREFIX/include"
          export FREETYPE_LIBS="-L$PREFIX/lib -lfreetype"
          
          export CFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2 $CFLAGS"
          export CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2 $CPPFLAGS"
          export LDFLAGS="-L$PREFIX/lib $LDFLAGS"
          
          ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
            --enable-static --enable-shared \
            --disable-require-system-font-provider \
            && make -j$(nproc) && make install

      - name: Verify Artifacts and Headers
        run: |
          echo "=== Checking libass artifacts ==="
          ls -la $PREFIX/lib/ | grep libass || true
          ls -la $PREFIX/include/ | grep ass || true
          if ls $PREFIX/lib/libass.* 1> /dev/null 2>&1; then echo "✅ libass compiled successfully!"; else echo "❌ libass compilation failed."; fi
