name: Test External Libraries Compilation

on:
  workflow_dispatch:

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ndk-path: ${{ steps.setup-ndk.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies (with system meson)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip \
            gperf gettext python3-pip
            
      - name: Install Python pip Meson
        run: pip3 install meson ninja || true

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK Permissions
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x ${{ github.workspace }}/ndk

      - name: Download and Unpack NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* ${{ github.workspace }}/ndk
          rm ndk.zip
          chmod -R +x ${{ github.workspace }}/ndk

      - name: Set NDK Output Path
        id: setup-ndk
        run: echo "path=${{ github.workspace }}/ndk" >> $GITHUB_OUTPUT

      - name: Upload NDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndk
          path: ${{ steps.setup-ndk.outputs.path }}
          retention-days: 1

  test-libs:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: libvpx
            build: |
              git clone --depth 1 https://github.com/webmproject/libvpx.git && cd libvpx
              
              # 暴力修复：遍历所有配置文件，把拦截的 die 替换为 echo
              find . -name "configure*" -type f -exec sed -i 's/die "--enable-shared only supported on ELF, OS\/2, and Darwin for now"/echo "Skipping ELF check for Android"/g' {} +
              
              export CROSS=$TOOLCHAIN/bin/llvm-
              export ASFLAGS="-D__ANDROID__"
              export LDFLAGS="-Wl,-z,max-page-size=16384"
              
              ./configure --prefix=$PREFIX --target=arm64-android-gcc --libc=$SYSROOT \
                --enable-vp8 --enable-vp9 --enable-static --enable-shared \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="-fPIC"
              make -j$(nproc) && make install

          - name: dav1d
            build: |
              # 环境兜底
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
              
              git clone --depth 1 https://code.videolan.org/videolan/dav1d.git && cd dav1d
              printf "[binaries]\nc='%s'\ncpp='%s'\nar='%s'\nstrip='%s'\npkgconfig='pkg-config'\n\n[properties]\nneeds_exe_wrapper=true\n\n[host_machine]\nsystem='android'\ncpu_family='aarch64'\ncpu='aarch64'\nendian='little'\n" "$CC" "$CXX" "$AR" "$STRIP" > $PWD/android.cross
              meson setup _build --cross-file $PWD/android.cross --prefix=$PREFIX --default-library=both --buildtype=release
              ninja -C _build && ninja -C _build install

          - name: fdk-aac
            build: |
              git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git && cd fdk-aac
              ./autogen.sh
              export CFLAGS="-D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration"
              ./configure --prefix=$PREFIX --host=aarch64-linux-android --enable-static --enable-shared --disable-example
              make -j$(nproc) && make install

          - name: ass-stack
            build: |
              # 环境兜底，彻底解决 meson: command not found
              export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"

              # 1. 编译 FreeType
              git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git && cd freetype
              ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
                --enable-static --enable-shared \
                --without-zlib --with-png=no --with-bzip2=no --with-harfbuzz=no \
                && make -j$(nproc) && make install && cd ..

              # 2. 编译 HarfBuzz (使用 Meson)
              git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git && cd harfbuzz
              printf "[binaries]\nc='%s'\ncpp='%s'\nar='%s'\nstrip='%s'\npkgconfig='pkg-config'\n\n[properties]\nneeds_exe_wrapper=true\n\n[host_machine]\nsystem='android'\ncpu_family='aarch64'\ncpu='aarch64'\nendian='little'\n" "$CC" "$CXX" "$AR" "$STRIP" > $PWD/android.cross
              
              meson setup _build --cross-file $PWD/android.cross \
                --prefix=$PREFIX --default-library=both --buildtype=release \
                -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled \
                -Dcairo=disabled -Dicu=disabled -Dgraphite2=disabled \
                -Dtests=disabled -Ddocs=disabled
              ninja -C _build && ninja -C _build install && cd ..

              # 3. 编译 Fontconfig
              git clone --depth 1 https://gitlab.freedesktop.org/fontconfig/fontconfig.git && cd fontconfig
              ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
                --enable-static --enable-shared --disable-docs \
                && make -j$(nproc) && make install && cd ..

              # 4. 编译 libass
              git clone --depth 1 https://github.com/libass/libass.git && cd libass
              export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
              export FRIBIDI_CFLAGS="-I$PREFIX/include"
              export FRIBIDI_LIBS="-L$PREFIX/lib -lfribidi"
              export HARFBUZZ_CFLAGS="-I$PREFIX/include/harfbuzz"
              export HARFBUZZ_LIBS="-L$PREFIX/lib -lharfbuzz"
              
              ./autogen.sh && ./configure --prefix=$PREFIX --host=aarch64-linux-android \
                --enable-static --enable-shared \
                && make -j$(nproc) && make install

    steps:
      - uses: actions/checkout@v4
      
      - name: Download NDK
        uses: actions/download-artifact@v4
        with:
          name: ndk
          path: ${{ github.workspace }}/ndk
          
      - name: Fix NDK Permissions
        run: chmod -R +x ${{ github.workspace }}/ndk
      
      - name: Set toolchain environment
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android36-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android36-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
      
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}

      - name: Verify Artifacts
        run: |
          echo "=== Checking compiled libraries for ${{ matrix.name }} ==="
          ls -la $PREFIX/lib/ || true
          echo ""
          if ls $PREFIX/lib/*.so 1> /dev/null 2>&1; then echo "✅ Shared libraries (.so) found."; else echo "❌ No Shared libraries (.so) found."; fi
          if ls $PREFIX/lib/*.a 1> /dev/null 2>&1; then echo "✅ Static libraries (.a) found."; else echo "❌ No Static libraries (.a) found."; fi
