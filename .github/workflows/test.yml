name: Build libass (static + shared)

on:
  workflow_dispatch:

env:
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  API_LEVEL: "36"
  ANDROID_TRIPLE: "aarch64-linux-android"

jobs:
  build-libass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip \
            gperf gettext libexpat1-dev

      - name: Download and Unpack NDK
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "PREFIX_STATIC=${{ github.workspace }}/prefix-static"
            echo "PREFIX_SHARED=${{ github.workspace }}/prefix-shared"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Clone sources
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git
          git clone --depth 1 https://github.com/fribidi/fribidi.git
          git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git
          git clone --depth 1 https://github.com/libass/libass.git

      - name: Build stack (static + shared)
        run: |
          set -euo pipefail

          build_stack() {
            local LINK="$1"
            local PREFIX="$2"

            echo "::group::=== Building $LINK stack into $PREFIX ==="
            mkdir -p "$PREFIX"

            local MESON_LIB CFLAGS_EXTRA LTOPT
            if [ "$LINK" = "static" ]; then
              MESON_LIB="static"
              CFLAGS_EXTRA="-O2 -fPIC"
              LTOPT="--enable-static --disable-shared"
            else
              MESON_LIB="shared"
              CFLAGS_EXTRA="-O2"
              LTOPT="--disable-static --enable-shared"
            fi

            local BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"
            local BASE_LDFLAGS="-L$PREFIX/lib"

            # 1. FreeType (Autotools)
            echo "### FreeType ($LINK)"
            ( cd freetype
              make distclean >/dev/null 2>&1 || true
              ./autogen.sh
              ./configure \
                --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                $LTOPT --with-pic \
                --without-zlib --without-png --without-bzip2 --without-harfbuzz \
                CFLAGS="$CFLAGS_EXTRA"
              make -j"$(nproc)"
              make install
            )

            # 2. FriBidi (Meson)  ← 已替换为 Meson 构建
            echo "### FriBidi ($LINK)"
            ( cd fribidi
              rm -rf _build
              # 动态生成针对 fribidi 的 Meson 交叉编译文件
              cat > fribidi.cross <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              meson setup _build --cross-file fribidi.cross \
                --prefix="$PREFIX" \
                --default-library="$MESON_LIB" \
                --buildtype=release \
                -Ddocs=false \
                -Ddeprecated=false \
                -Db_staticpic=true
              ninja -C _build
              ninja -C _build install
            )

            # 3. HarfBuzz (Meson)
            echo "### HarfBuzz ($LINK)"
            ( cd harfbuzz
              rm -rf _build
              cat > android.cross <<EOF
          [binaries]
          c = '$CC'
          cpp = '$CXX'
          ar = '$AR'
          strip = '$STRIP'
          pkgconfig = 'pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              meson setup _build --cross-file android.cross \
                --prefix="$PREFIX" \
                --default-library="$MESON_LIB" \
                --buildtype=release \
                -Db_staticpic=true \
                -Dfreetype=enabled \
                -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
                -Dicu=disabled -Dgraphite2=disabled \
                -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
              ninja -C _build
              ninja -C _build install
            )

            # 4. 头文件归一化
            echo "### Normalizing headers"
            for sub in fribidi harfbuzz; do
              if [ -d "$PREFIX/include/$sub" ]; then
                for h in "$PREFIX/include/$sub"/*.h; do
                  [ -e "$h" ] || continue
                  ln -sf "$h" "$PREFIX/include/$(basename "$h")"
                done
              fi
            done
            if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
              ln -sf "$PREFIX/include/freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
            fi

            # 5. libass (Autotools)
            echo "### libass ($LINK)"
            ( cd libass
              make distclean >/dev/null 2>&1 || true
              ./autogen.sh
              PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              ./configure \
                --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                $LTOPT --with-pic \
                --disable-fontconfig \
                --disable-require-system-font-provider \
                CFLAGS="$CFLAGS_EXTRA" \
                CPPFLAGS="$BASE_CPPFLAGS" \
                LDFLAGS="$BASE_LDFLAGS"
              make -j"$(nproc)"
              make install
            )

            echo "::endgroup::"
          }

          build_stack static  "$PREFIX_STATIC"
          build_stack shared  "$PREFIX_SHARED"

      - name: Verify static libass
        run: |
          set -euxo pipefail
          echo "=== libass.a ==="
          test -s "$PREFIX_STATIC/lib/libass.a"
          ls -la "$PREFIX_STATIC/lib/libass.a"
          echo "=== 成员列表（前几项）==="
          ar t "$PREFIX_STATIC/lib/libass.a" | head -5
          echo "=== 抽一个 .o 看架构 ==="
          TMP=$(mktemp -d)
          ( cd "$TMP" && ar x "$PREFIX_STATIC/lib/libass.a" )
          file "$TMP"/*.o | head -3 | tee /tmp/arch.txt
          grep -q "ARM aarch64" /tmp/arch.txt || (echo "❌ 架构不是 aarch64"; exit 1)
          echo "✅ static libass OK"

      - name: Verify shared libass
        run: |
          set -euxo pipefail
          echo "=== libass.so* ==="
          ls -la "$PREFIX_SHARED/lib/libass.so"*
          REAL=$(readlink -f "$PREFIX_SHARED/lib/libass.so")
          file "$REAL"
          echo "=== NEEDED / SONAME ==="
          readelf -d "$REAL" | grep -E 'NEEDED|SONAME' || true
          echo
          echo "⚠️  如果要把 .so 直接打包进 APK 的 libs/arm64-v8a/，"
          echo "   注意当前 SONAME 通常是 libass.so.9，打包工具可能需要重命名"
          echo "✅ shared libass OK"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts/static/lib/pkgconfig artifacts/static/include \
                   artifacts/shared/lib/pkgconfig artifacts/shared/include

          cp -a "$PREFIX_STATIC"/lib/*.a artifacts/static/lib/
          cp -a "$PREFIX_STATIC"/lib/pkgconfig/*.pc artifacts/static/lib/pkgconfig/ 2>/dev/null || true
          cp -a "$PREFIX_STATIC"/include/. artifacts/static/include/

          cp -a "$PREFIX_SHARED"/lib/*.so* artifacts/shared/lib/
          cp -a "$PREFIX_SHARED"/lib/pkgconfig/*.pc artifacts/shared/lib/pkgconfig/ 2>/dev/null || true
          cp -a "$PREFIX_SHARED"/include/. artifacts/shared/include/

          echo "=== static files ==="
          find artifacts/static -type f | sort
          echo "=== shared files ==="
          find artifacts/shared -type f | sort

      - name: Upload libass static
        uses: actions/upload-artifact@v4
        with:
          name: libass-static-aarch64-api${{ env.API_LEVEL }}
          path: artifacts/static/

      - name: Upload libass shared
        uses: actions/upload-artifact@v4
        with:
          name: libass-shared-aarch64-api${{ env.API_LEVEL }}
          path: artifacts/shared/
