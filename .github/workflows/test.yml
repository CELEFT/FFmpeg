name: Test libsoxr (arm64-v8a)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-libsoxr.yml'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-soxr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [static, shared]
    env:
      LINK: ${{ matrix.link }}
      PREFIX: ${{ github.workspace }}/prefix/${{ matrix.link }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git wget unzip \
            patchelf pkg-config

      - name: Download and Unpack NDK
        run: |
          set -euo pipefail
          wget -q "$NDK_URL" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "READELF=$TOOLCHAIN/bin/llvm-readelf"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          echo "✅ 编译器可创建可执行文件"

      - name: Build libsoxr [${{ matrix.link }}]
        shell: bash
        run: |
          set -euo pipefail
          D="$GITHUB_WORKSPACE/soxr"

          on_exit() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "::group::❌ 失败诊断 — libsoxr [$LINK]"
              for f in "$D"/build/CMakeFiles/CMakeError.log \
                       "$D"/build/CMakeFiles/CMakeOutput.log \
                       "$D"/build/CMakeCache.txt; do
                [ -f "$f" ] || continue
                echo "===== $f (末 40 行) ====="
                tail -40 "$f" || true
              done
              echo "::endgroup::"
            fi
            exit $rc
          }
          trap on_exit EXIT

          [ -d soxr ] || git clone --depth 1 https://github.com/chirlu/soxr.git soxr
          cd soxr
          rm -rf build

          if [ "$LINK" = "shared" ]; then
            SHARED=ON
          else
            SHARED=OFF
          fi

          # ★ 关键点：不设 CMAKE_SYSTEM_NAME，交给 Android toolchain 自行推断
          #   WITH_OPENMP=OFF → NDK clang 默认不含 OpenMP 运行时
          #   WITH_AVFFT=OFF   → 不让 soxr 反向依赖 libavcodec 做 FFT
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$TARGET_ABI" \
            -DANDROID_PLATFORM="android-$API_LEVEL" \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS="$SHARED" \
            -DWITH_OPENMP=OFF \
            -DWITH_AVFFT=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF

          cmake --build build -j"$(nproc)"
          cmake --install build

          # ═══ 门禁 1：产物存在 ═══
          echo "--- 安装产物 ---"
          find "$PREFIX" \( -type f -o -type l \) | sort | sed 's/^/  /'

          if [ "$LINK" = "shared" ]; then
            [ -e "$PREFIX/lib/libsoxr.so" ] \
              || { echo "::error::未生成 libsoxr.so"; exit 1; }
          else
            [ -e "$PREFIX/lib/libsoxr.a" ] \
              || { echo "::error::未生成 libsoxr.a"; exit 1; }
          fi
          [ -e "$PREFIX/lib/pkgconfig/soxr.pc" ] \
            || { echo "::error::未生成 soxr.pc"; exit 1; }
          echo "✅ 库文件 + soxr.pc 存在"

          # ═══ 门禁 2：pkg-config 自洽 ═══
          echo "--- soxr.pc 内容 ---"
          sed 's/^/  /' "$PREFIX/lib/pkgconfig/soxr.pc"

          echo "--- pkg-config 解析 ---"
          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
          PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
            pkg-config --modversion --cflags --libs soxr | sed 's/^/  /'

          # ═══ 门禁 3：shared 专属校验 ═══
          if [ "$LINK" = "shared" ]; then
            so="$PREFIX/lib/libsoxr.so"

            echo "--- 架构 ---"
            "$READELF" -h "$so" | awk -F: '/Machine|Class/{print "  "$2}'

            echo "--- RUNPATH ---"
            rp=$("$READELF" -d "$so" | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p' || true)
            echo "  RUNPATH = ${rp:-<none>}"
            if [ -n "${rp:-}" ] && [ "$rp" != '$ORIGIN' ]; then
              echo "::warning::libsoxr.so RUNPATH=$rp（应为 \$ORIGIN 或无）"
            fi

            echo "--- 16KB 对齐 ---"
            align=$("$READELF" -lW "$so" | awk '/ LOAD /{print $NF}' | sort -u | tr '\n' ' ')
            echo "  LOAD p_align = ${align:-<none>}"
            case "${align:-}" in
              *0x1000*)
                echo "::error::含 4KB LOAD 段（NDK r30 默认应为 0x4000）"
                exit 1 ;;
              *0x4000*)
                echo "  ✅ 16KB 对齐" ;;
              *)
                echo "::warning::p_align 异常：${align:-<none>}" ;;
            esac

            echo "--- DT_NEEDED ---"
            "$READELF" -d "$so" | grep NEEDED | sed 's/^/  /' || echo "  (无 DT_NEEDED)"
          fi

          echo "✅ libsoxr [$LINK] 构建成功"

      - name: Smoke test (compile + link)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/soxr_smoke.c <<'EOF'
          #include <soxr.h>
          #include <stdio.h>

          int main(void) {
              soxr_quality_spec_t q  = soxr_quality_spec(SOXR_HQ, 0);
              soxr_io_spec_t      io = soxr_io_spec(SOXR_FLOAT32_I, SOXR_FLOAT32_I);
              soxr_error_t        err = NULL;

              soxr_t s = soxr_create(48000, 44100, 2, &err, &io, &q, NULL);
              if (!s) {
                  fprintf(stderr, "soxr_create failed: %s\n",
                          err ? soxr_strerror(err) : "unknown");
                  return 1;
              }
              soxr_delete(s);
              printf("soxr OK: version=%s\n", soxr_version());
              return 0;
          }
          EOF

          # 交叉编译：只能验证“编译 + 链接”阶段能通过，
          # 无法在 x86_64 runner 上实际运行 ARM64 可执行文件。
          "$CC" /tmp/soxr_smoke.c -o /tmp/soxr_smoke.out \
            -I"$PREFIX/include" \
            -L"$PREFIX/lib" \
            -lsoxr -lm

          echo "--- smoke 产物 ---"
          file /tmp/soxr_smoke.out
          "$READELF" -d /tmp/soxr_smoke.out | grep NEEDED | sed 's/^/  /' || true
          echo "✅ 编译 + 链接通过（头文件与符号均可用）"

      - name: Upload prefix [${{ matrix.link }}]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soxr-${{ matrix.link }}
          path: ${{ github.workspace }}/prefix/${{ matrix.link }}
          if-no-files-found: warn
          retention-days: 3

  verify:
    needs: build-soxr
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download prefixes
        uses: actions/download-artifact@v4
        with:
          pattern: soxr-*
          path: ${{ github.workspace }}/prefix

      - name: Verify artifacts
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefix"
          DS="$P/soxr-static"
          DH="$P/soxr-shared"

          echo "===== 顶层布局 ====="
          find "$P" -maxdepth 2 | sort || true

          echo "===== static ====="
          if [ -d "$DS" ]; then
            find "$DS" -maxdepth 2 \( -name '*.a' -o -name '*.pc' \) 2>/dev/null | sort || true
            if [ -f "$DS/lib/libsoxr.a" ]; then
              echo "  ✅ libsoxr.a $(du -h "$DS/lib/libsoxr.a" | cut -f1)"
            else
              echo "::error::static 变体缺 libsoxr.a"
            fi
            [ -f "$DS/lib/pkgconfig/soxr.pc" ] \
              && echo "  ✅ soxr.pc" \
              || echo "::error::static 变体缺 soxr.pc"
          else
            echo "::error::缺少 $DS（static job 未上传产物）"
          fi

          echo "===== shared ====="
          if [ -d "$DH" ]; then
            find "$DH/lib" -maxdepth 1 -name 'libsoxr.so*' 2>/dev/null | sort \
              | while IFS= read -r f; do
                  if [ -L "$f" ]; then
                    printf '  %-24s -> %s\n' "$(basename "$f")" "$(readlink "$f")"
                  else
                    printf '  %-24s (regular, %s)\n' \
                      "$(basename "$f")" "$(du -h "$f" | cut -f1)"
                  fi
                done || true

            real="$DH/lib/libsoxr.so"
            [ -e "$real" ] \
              || real="$(find "$DH/lib" -maxdepth 1 -name 'libsoxr.so.*' -type f 2>/dev/null | head -1 || true)"

            if [ -n "${real:-}" ] && [ -e "$real" ]; then
              echo "--- 实体文件：$(basename "$real") ---"
              echo -n "  Machine  = "
              readelf -h "$real" 2>/dev/null \
                | awk -F: '/Machine/{gsub(/^ +/,"",$2); print $2}' || true
              echo -n "  p_align  = "
              readelf -lW "$real" 2>/dev/null \
                | awk '/ LOAD /{print $NF}' | sort -u | tr '\n' ' ' || true
              echo
              echo -n "  RUNPATH  = "
              readelf -d "$real" 2>/dev/null \
                | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p' || echo "(none)"

              echo "--- DT_NEEDED ---"
              readelf -d "$real" 2>/dev/null \
                | sed -n 's/.*NEEDED.*\[\(.*\)\].*/  \1/p' || true

              echo "--- 断言 ---"
              readelf -lW "$real" 2>/dev/null \
                | awk '/ LOAD /{print $NF}' | sort -u | grep -qx '0x4000' \
                && echo "  ✅ 16KB 对齐" \
                || echo "::warning::LOAD p_align 不纯为 0x4000"

              echo "--- .symtab 残留 ---"
              if readelf -SW "$real" 2>/dev/null | grep -q '\.symtab'; then
                echo "  ::warning::$(basename "$real") 仍含 .symtab（CMake 默认未 strip）"
              else
                echo "  ✅ 无 .symtab"
              fi

              [ -f "$DH/lib/pkgconfig/soxr.pc" ] \
                && echo "  ✅ soxr.pc" \
                || echo "::error::shared 变体缺 soxr.pc"
            else
              echo "::error::shared 变体找不到实体 .so"
            fi
          else
            echo "::error::缺少 $DH（shared job 未上传产物）"
          fi

          echo "===== 汇总 ====="
          echo "static: $(find "$DS/lib" -maxdepth 1 -name '*.a' 2>/dev/null | wc -l) 个 .a, $(find "$DS/lib/pkgconfig" -name '*.pc' 2>/dev/null | wc -l) 个 .pc"
          echo "shared: $(find "$DH/lib" -maxdepth 1 -name 'libsoxr.so*' 2>/dev/null | wc -l) 个 .so*, $(find "$DH/lib/pkgconfig" -name '*.pc' 2>/dev/null | wc -l) 个 .pc"
