name: Build FFmpeg 9.0.2 for Android (arm64-v8a, Multi-Job)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "9.0.2"
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"

jobs:
  # ==================== Job 1: 准备 NDK ====================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ndk-path: ${{ steps.setup-ndk.outputs.path }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}
      - name: Restore NDK Permissions
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x ${{ github.workspace }}/ndk
      - name: Download and Unpack NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* ${{ github.workspace }}/ndk
          rm ndk.zip
          chmod -R +x ${{ github.workspace }}/ndk
      - name: Set NDK Output Path
        id: setup-ndk
        run: echo "path=${{ github.workspace }}/ndk" >> $GITHUB_OUTPUT
      - name: Upload NDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ndk
          path: ${{ steps.setup-ndk.outputs.path }}
          retention-days: 1

  # ==================== Job 2: 并行编译外部库 ====================
  build-libs:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ========== 原生双轨（单次编译） ==========
          - name: x264
            build: |
              git clone --depth 1 https://code.videolan.org/videolan/x264.git && cd x264
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --cross-prefix=$TOOLCHAIN/bin/llvm- \
                --enable-static --enable-shared --enable-pic --disable-cli
              make -j$(nproc) && make install
          - name: x265
            build: |
              git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git && cd x265_git
              sed -i 's/list(APPEND PLATFORM_LIBS pthread)/# list(APPEND PLATFORM_LIBS pthread)/' source/CMakeLists.txt
              cd build/linux
              cmake -G "Unix Makefiles" \
                -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL \
                -DCMAKE_SYSTEM_NAME=Android -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
                -DCMAKE_ASM_COMPILER=$CC -DENABLE_ASSEMBLY=OFF \
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384" \
                -DCMAKE_INSTALL_PREFIX=$PREFIX -DENABLE_SHARED=ON -DENABLE_CLI=OFF \
                ../../source
              make -j$(nproc) && make install
          - name: dav1d
            build: |
              git clone --depth 1 https://code.videolan.org/videolan/dav1d.git && cd dav1d
              printf "[binaries]\nc='%s'\ncpp='%s'\nar='%s'\nstrip='%s'\npkgconfig='pkg-config'\n\n[properties]\nneeds_exe_wrapper=true\n\n[host_machine]\nsystem='android'\ncpu_family='aarch64'\ncpu='aarch64'\nendian='little'\n" "$CC" "$CXX" "$AR" "$STRIP" > $PWD/android.cross
              meson setup _build --cross-file $PWD/android.cross --prefix=$PREFIX --default-library=both --buildtype=release
              ninja -C _build && ninja -C _build install
          - name: libvpx
            build: |
              git clone --depth 1 https://github.com/webmproject/libvpx.git && cd libvpx
              find . -name "configure*" -type f -exec sed -i 's/die "--enable-shared only supported on ELF, OS\/2, and Darwin for now"/echo "Skipping ELF check for Android"/g' {} +
              export CROSS=$TOOLCHAIN/bin/llvm-
              export ASFLAGS="-D__ANDROID__"
              export LDFLAGS="-Wl,-z,max-page-size=16384"
              ./configure --prefix=$PREFIX --target=arm64-android-gcc --libc=$SYSROOT \
                --enable-vp8 --enable-vp9 --enable-static --enable-shared \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="-fPIC"
              make -j$(nproc) && make install
          - name: libaom
            build: |
              git clone --depth 1 https://aomedia.googlesource.com/aom && mkdir -p aom/build && cd aom/build
              cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DENABLE_SHARED=ON -DENABLE_STATIC=ON -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF -DCONFIG_AV1_ENCODER=1 -DAOM_TARGET_CPU=arm64
              ninja && ninja install
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/aom.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: aom
              Description: AOMedia Project AV1 Codec Library
              Version: 3.8.0
              Libs: -L\${libdir} -laom
              Libs.private: -lm -lpthread
              Cflags: -I\${includedir}
              EOF

          # ========== 回退双轨（双次编译：先动态，后静态） ==========
          - name: svt-av1
            build: |
              git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git && cd SVT-AV1
              mkdir build_shared && cd build_shared
              cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=ON
              ninja && ninja install && cd ..
              mkdir build_static && cd build_static
              cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=OFF
              ninja && ninja install && cd ..
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/SvtAv1Enc.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: SvtAv1Enc
              Description: SVT-AV1 Encoder
              Version: 1.8.0
              Libs: -L\${libdir} -lSvtAv1Enc
              Libs.private: -lm -lpthread
              Cflags: -I\${includedir}
              EOF
          - name: vvenc
            build: |
              git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git && cd vvenc
              mkdir build_shared && cd build_shared
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
              make -j$(nproc) && make install && cd ..
              mkdir build_static && cd build_static
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF
              make -j$(nproc) && make install && cd ..
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/libvvenc.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: libvvenc
              Description: Fraunhofer Versatile Video Encoder
              Version: 1.11.0
              Libs: -L\${libdir} -lvvenc
              Libs.private: -lstdc++ -lm -lpthread
              Cflags: -I\${includedir}
              EOF
          - name: xeve
            build: |
              git clone --depth 1 https://github.com/mpeg5/xeve.git && cd xeve
              mkdir build_shared && cd build_shared
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DSET_PROF=MAIN -DBUILD_SHARED_LIBS=ON
              make -j$(nproc) && make install && cd ..
              mkdir build_static && cd build_static
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DSET_PROF=MAIN -DBUILD_SHARED_LIBS=OFF
              make -j$(nproc) && make install && cd ..
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/xeve.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: xeve
              Description: MPEG-5 EVC Encoder
              Version: 1.0.0
              Libs: -L\${libdir} -lxeve
              Libs.private: -lstdc++ -lm -lpthread
              Cflags: -I\${includedir}
              EOF
          - name: xevd
            build: |
              git clone --depth 1 https://github.com/mpeg5/xevd.git && cd xevd
              mkdir build_shared && cd build_shared
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=ON
              make -j$(nproc) && make install && cd ..
              mkdir build_static && cd build_static
              cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=$TARGET_ABI -DANDROID_PLATFORM=android-$API_LEVEL -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=OFF
              make -j$(nproc) && make install && cd ..
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/xevd.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: xevd
              Description: MPEG-5 EVC Decoder
              Version: 1.0.0
              Libs: -L\${libdir} -lxevd
              Libs.private: -lstdc++ -lm -lpthread
              Cflags: -I\${includedir}
              EOF
          - name: openssl
            build: |
              git clone --depth 1 https://github.com/openssl/openssl.git && cd openssl
              export ANDROID_NDK_ROOT=$NDK
              ./Configure android-arm64 -D__ANDROID_API__=$API_LEVEL --prefix=$PREFIX --openssldir=$PREFIX/ssl no-tests
              make -j$(nproc) && make install_sw
              make clean
              ./Configure android-arm64 -D__ANDROID_API__=$API_LEVEL --prefix=$PREFIX --openssldir=$PREFIX/ssl no-shared no-tests
              make -j$(nproc) && make install_sw
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/openssl.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              Name: openssl
              Description: OpenSSL Library
              Version: 3.0.0
              Libs: -L\${libdir} -lssl -lcrypto
              Libs.private: -ldl -lpthread
              Cflags: -I\${includedir}
              EOF

          # ========== Autotools / Meson 原生双轨 ==========
          - name: fdk-aac
            build: |
              git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git && cd fdk-aac
              ./autogen.sh
              export CFLAGS="-D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration"
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared --disable-example
              make -j$(nproc) && make install
          - name: lame
            build: |
              wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz && tar xf lame-3.100.tar.gz && cd lame-3.100
              sed -i '/lame_init_old/d' include/libmp3lame.sym
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared --disable-frontend --disable-asm
              make -j$(nproc) && make install
          - name: opus
            build: |
              git clone --depth 1 https://github.com/xiph/opus.git && cd opus
              ./autogen.sh
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared
              make -j$(nproc) && make install
          - name: vorbis
            build: |
              git clone --depth 1 https://github.com/xiph/ogg.git && cd ogg
              ./autogen.sh && ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared && make -j$(nproc) && make install && cd ..
              git clone --depth 1 https://github.com/xiph/vorbis.git && cd vorbis
              ./autogen.sh && ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared && make -j$(nproc) && make install
          - name: lc3
            build: |
              git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 && cd liblc3
              make -j$(nproc) CC="$CC" LIBC=bionic
              mkdir -p $PREFIX/lib $PREFIX/include
              cp bin/liblc3.a $PREFIX/lib/ 2>/dev/null || true
              $CC -shared -o $PREFIX/lib/liblc3.so build/src/*.o -lm
              cp include/*.h $PREFIX/include/ 2>/dev/null || true
          - name: webp
            build: |
              git clone --depth 1 https://github.com/webmproject/libwebp.git && cd libwebp
              ./autogen.sh
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --enable-static --enable-shared --disable-libwebpdemux --disable-libwebpmux
              make -j$(nproc) && make install

          # ========== 核心修复：补全 expat + fontconfig 依赖链 ==========
          - name: expat-fontconfig
            build: |
              set -euo pipefail
              # 1. 编译 expat (fontconfig 的隐藏强依赖)
              wget -q https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.gz
              tar xf expat-2.6.2.tar.gz && cd expat-2.6.2
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --build=x86_64-pc-linux-gnu \
                --enable-static --enable-shared --with-pic
              make -j$(nproc) && make install && cd ..

              # 2. 编译 fontconfig (明确指定 expat 路径)
              git clone --depth 1 https://gitlab.freedesktop.org/fontconfig/fontconfig.git && cd fontconfig
              ./autogen.sh
              PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --build=x86_64-pc-linux-gnu \
                --enable-static --enable-shared --with-pic \
                --with-expat-includes=$PREFIX/include --with-expat-lib=$PREFIX/lib \
                --disable-docs
              make -j$(nproc) && make install && cd ..

              # 3. 手动修复 fontconfig.pc (补全私有依赖，确保静态链接成功)
              mkdir -p $PREFIX/lib/pkgconfig
              cat > $PREFIX/lib/pkgconfig/fontconfig.pc <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${prefix}/lib
              includedir=\${prefix}/include
              sysconfdir=\${prefix}/etc
              localstatedir=\${prefix}/var
              PACKAGE=fontconfig
              confdir=\${sysconfdir}/fonts
              cachedir=/var/cache/fontconfig

              Name: Fontconfig
              Description: Font configuration and customization library
              Version: 2.15.0
              Libs: -L\${libdir} -lfontconfig
              Libs.private: -L\${libdir} -lexpat -lfreetype
              Cflags: -I\${includedir}
              EOF
          # ================================================================

          # ========== 字幕依赖栈（Meson both + Autotools 双轨） ==========
          - name: ass-stack
            build: |
              set -euo pipefail
              mkdir -p $PREFIX
              export BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"
              export BASE_LDFLAGS="-L$PREFIX/lib"

              git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git && cd freetype
              ./autogen.sh
              ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --build=x86_64-pc-linux-gnu --enable-static --enable-shared --with-pic --without-zlib --without-png --without-bzip2 --without-harfbuzz CFLAGS="-O2 -fPIC"
              make -j$(nproc) && make install && cd ..

              git clone --depth 1 https://github.com/fribidi/fribidi.git && cd fribidi
              cat > fribidi.cross <<EOF
              [binaries]
              c = '$CC'
              cpp = '$CXX'
              ar = '$AR'
              strip = '$STRIP'
              pkgconfig = 'pkg-config'
              [host_machine]
              system = 'android'
              cpu_family = 'aarch64'
              cpu = 'aarch64'
              endian = 'little'
              EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup _build --cross-file fribidi.cross --prefix=$PREFIX --default-library=both --buildtype=release -Ddocs=false -Ddeprecated=false -Db_staticpic=true
              ninja -C _build && ninja -C _build install && cd ..

              git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git && cd harfbuzz
              cat > android.cross <<EOF
              [binaries]
              c = '$CC'
              cpp = '$CXX'
              ar = '$AR'
              strip = '$STRIP'
              pkgconfig = 'pkg-config'
              [properties]
              needs_exe_wrapper = true
              [host_machine]
              system = 'android'
              cpu_family = 'aarch64'
              cpu = 'aarch64'
              endian = 'little'
              EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup _build --cross-file android.cross --prefix=$PREFIX --default-library=both --buildtype=release -Db_staticpic=true -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dicu=disabled -Dgraphite2=disabled -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
              ninja -C _build && ninja -C _build install && cd ..

              for sub in fribidi harfbuzz; do
                if [ -d "$PREFIX/include/$sub" ]; then
                  for h in "$PREFIX/include/$sub"/*.h; do
                    [ -e "$h" ] || continue
                    ln -sf "$h" "$PREFIX/include/$(basename "$h")"
                  done
                fi
              done
              if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
                ln -sf "$PREFIX/include/freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
              fi

              git clone --depth 1 https://github.com/libass/libass.git && cd libass
              ./autogen.sh
              PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" ./configure --prefix=$PREFIX --host=$ANDROID_TRIPLE --build=x86_64-pc-linux-gnu --enable-static --enable-shared --with-pic --disable-fontconfig --disable-require-system-font-provider CFLAGS="-O2 -fPIC" CPPFLAGS="$BASE_CPPFLAGS" LDFLAGS="$BASE_LDFLAGS"
              make -j$(nproc) && make install

    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config nasm yasm cmake meson ninja-build git wget unzip gperf gettext libexpat1-dev
      - name: Download NDK
        uses: actions/download-artifact@v4
        with:
          name: ndk
          path: ${{ github.workspace }}/ndk
      - name: Fix NDK Permissions
        run: chmod -R +x ${{ github.workspace }}/ndk
      - name: Set toolchain environment
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
      - name: Build ${{ matrix.name }}
        run: ${{ matrix.build }}
      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v4
        with:
          name: prefix-${{ matrix.name }}
          path: ${{ env.PREFIX }}
          retention-days: 1

  # ==================== Job 3: 编译 FFmpeg ====================
  build-ffmpeg:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NDK
        uses: actions/download-artifact@v4
        with:
          name: ndk
          path: ${{ github.workspace }}/ndk
      - name: Download all prefix dependencies
        uses: actions/download-artifact@v4
        with:
          pattern: prefix-*
          path: ${{ github.workspace }}/prefix
          merge-multiple: true
      - name: Fix NDK Permissions
        run: chmod -R +x ${{ github.workspace }}/ndk
      - name: Set FFmpeg environment
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/prefix/lib/pkgconfig" >> $GITHUB_ENV
          # 【核心修复】允许交叉编译时 pkg-config 读取目标平台的 .pc 文件
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Download FFmpeg Source
        run: |
          wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure FFmpeg (Shared)
        working-directory: ffmpeg
        run: |
          ./configure \
            --prefix=$PREFIX \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --enable-shared --enable-static --enable-pic \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lm -lz -ldl"
      
      - name: Build FFmpeg (Shared)
        working-directory: ffmpeg
        run: make -j$(nproc) && make install

      - name: Configure FFmpeg (Static)
        run: |
          cp -r ffmpeg ffmpeg-static
          cd ffmpeg-static
          make distclean || true
          ./configure \
            --prefix=$PREFIX \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --disable-shared --enable-static --enable-pic \
            --pkg-config-flags="--static" \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lpthread -lm -lz -ldl"

      - name: Build FFmpeg Static Binaries
        working-directory: ffmpeg-static
        run: |
          make -j$(nproc) ffmpeg ffprobe
          $STRIP ffmpeg ffprobe

      # ==================== 合并打包：.a + .so + include + .pc ====================
      - name: Package entire prefix directory
        run: |
          mkdir -p $PREFIX/bin_static
          cp ffmpeg-static/ffmpeg ffmpeg-static/ffprobe $PREFIX/bin_static/
          echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > $PREFIX/BUILD_INFO.txt
          $PREFIX/bin/ffmpeg -buildconf >> $PREFIX/BUILD_INFO.txt 2>/dev/null || true
          
          echo "=== 检查动态库和静态库并存 ==="
          echo "动态库 (.so) 数量: $(find $PREFIX/lib -name '*.so*' | wc -l)"
          echo "静态库 (.a) 数量: $(find $PREFIX/lib -name '*.a' | wc -l)"
          
          cd ${{ github.workspace }}
          tar -I 'xz -9e -T0' -cf ffmpeg-android-arm64-v8a.tar.xz prefix
          mkdir -p artifacts
          mv ffmpeg-android-arm64-v8a.tar.xz artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-final
          path: artifacts/
          retention-days: 1

  # ==================== Job 4: 发布 Release ====================
  release:
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download final artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-final
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## FFmpeg Android Build (arm64-v8a)
            - **Build Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            - **NDK**: r30 (API 36)
            - **FFmpeg**: 9.0.2
            
            ### 包含内容 (tar.xz 极压包)
            打包了完整的 `prefix` 目录，**所有外部库均已同时包含动态库（.so）和静态库（.a）**，以及头文件和 `.pc` 文件：
            - `lib/`：`.so`、`.a` 与 `.pc` 文件
            - `include/`：所有头文件（已归一化）
            - `bin/`：动态链接版 `ffmpeg` 和 `ffprobe`
            - `bin_static/`：纯静态链接版 `ffmpeg` 和 `ffprobe`
            - `BUILD_INFO.txt`：构建配置信息
          files: artifacts/ffmpeg-android-arm64-v8a.tar.xz
          generate_release_notes: true
