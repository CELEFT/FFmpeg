name: Build FFmpeg 9.0.2 for Android (arm64-v8a, Multi-Job, Cached, Two Tarballs)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "9.0.2"
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"
  BASE_PRIVATE_LIBS: "-lc++_static -lm"
  LIBS_CACHE_VERSION: "v1"

jobs:
  # ==================== Job 1: 并行编译外部库 ====================
  build-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x264
            build: |
              set -euo pipefail
              git clone --depth 1 https://code.videolan.org/videolan/x264.git && cd x264
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --cross-prefix="$TOOLCHAIN/bin/llvm-" \
                --enable-static --enable-shared --enable-pic --disable-cli
              make -j"$(nproc)" && make install
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/x264.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include

              Name: x264
              Description: H.264 (MPEG4 AVC) encoder library
              Version: 0.164.3095
              Libs: -L\${libdir} -lx264
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: x265
            build: |
              set -euo pipefail
              git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git
              cd x265_git
              sed -i 's/list(APPEND PLATFORM_LIBS pthread)/# list(APPEND PLATFORM_LIBS pthread)/' source/CMakeLists.txt || true

              X265_FLAGS=(
                -G "Unix Makefiles"
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake"
                -DANDROID_ABI="$TARGET_ABI"
                -DANDROID_PLATFORM="android-$API_LEVEL"
                -DANDROID_STL=c++_static
                -DCMAKE_SYSTEM_NAME=Android
                -DCMAKE_SYSTEM_PROCESSOR=aarch64
                -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_INSTALL_PREFIX="$PREFIX"
                -DENABLE_ASSEMBLY=OFF
                -DENABLE_CLI=OFF
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
                -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
                -DCMAKE_EXE_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
              )
              for shared in ON OFF; do
                rm -rf "build-$shared"
                cmake -S source -B "build-$shared" "${X265_FLAGS[@]}" -DENABLE_SHARED="$shared"
                cmake --build "build-$shared" -j"$(nproc)"
              done

              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              for h in x265.h x265_config.h; do
                src=$(find build-ON build-OFF source -maxdepth 1 -name "$h" | head -n1 || true)
                [ -n "${src:-}" ] && cp -f "$src" "$PREFIX/include/$h"
              done
              A=$(find . -name 'libx265.a' | head -n1 || true)
              [ -n "${A:-}" ] && cp -f "$A" "$PREFIX/lib/libx265.a"
              while IFS= read -r f; do cp -af "$f" "$PREFIX/lib/"; done < <(find build-ON -maxdepth 2 -name 'libx265.so*' 2>/dev/null || true)
              if [ ! -e "$PREFIX/lib/libx265.so" ]; then
                real=$(find "$PREFIX/lib" -maxdepth 1 -name 'libx265.so.*' | head -n1 || true)
                if [ -n "${real:-}" ]; then cp -f "$real" "$PREFIX/lib/libx265.so"
                else
                  echo "::warning::CMake 未产出 libx265.so，改用 PIC 静态库生成"
                  $CXX -shared -Wl,-soname,libx265.so -o "$PREFIX/lib/libx265.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libx265.a" -Wl,--no-whole-archive -lc++_static -lm
                fi
              fi
              test -f "$PREFIX/lib/libx265.a"  || { echo "libx265.a missing";  exit 1; }
              test -e "$PREFIX/lib/libx265.so" || { echo "libx265.so missing"; exit 1; }
              test -f "$PREFIX/include/x265.h" || { echo "x265.h missing";     exit 1; }

              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/x265.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include

              Name: x265
              Description: H.265/HEVC video encoder
              Version: 4.1
              Libs: -L\${libdir} -lx265
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: dav1d
            build: |
              set -euo pipefail
              git clone --depth 1 https://code.videolan.org/videolan/dav1d.git && cd dav1d
              printf "[binaries]\nc='%s'\ncpp='%s'\nar='%s'\nstrip='%s'\npkgconfig='pkg-config'\n\n[properties]\nneeds_exe_wrapper=true\n\n[host_machine]\nsystem='android'\ncpu_family='aarch64'\ncpu='aarch64'\nendian='little'\n" "$CC" "$CXX" "$AR" "$STRIP" > "$PWD/android.cross"
              meson setup _build --cross-file "$PWD/android.cross" --prefix="$PREFIX" \
                --default-library=both --buildtype=release \
                -Denable_tools=false -Denable_tests=false
              ninja -C _build && ninja -C _build install

          - name: libvpx
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/webmproject/libvpx.git && cd libvpx
              find . -name "configure*" -type f -exec sed -i 's/die "--enable-shared only supported on ELF, OS\/2, and Darwin for now"/echo "Skipping ELF check for Android"/g' {} +
              export CROSS="$TOOLCHAIN/bin/llvm-"
              export ASFLAGS="-D__ANDROID__"
              export LDFLAGS="-Wl,-z,max-page-size=16384"
              ./configure --prefix="$PREFIX" --target=arm64-android-gcc --libc="$SYSROOT" \
                --enable-vp8 --enable-vp9 --enable-static --enable-shared \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="-fPIC"
              make -j"$(nproc)" && make install
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/vpx.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: vpx
              Description: WebM Project VP8/VP9 Codec Library
              Version: 1.14.0
              Libs: -L\${libdir} -lvpx
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: libaom
            build: |
              set -euo pipefail
              git clone --depth 1 https://aomedia.googlesource.com/aom && mkdir -p aom/build && cd aom/build
              cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DENABLE_SHARED=ON -DENABLE_STATIC=ON \
                -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF \
                -DCONFIG_AV1_ENCODER=1 -DCONFIG_PIC=1 \
                -DAOM_TARGET_CPU=arm64 -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              ninja && ninja install

              mkdir -p "$PREFIX/lib"
              echo "--- aom 安装产物 ---"
              ls -l "$PREFIX"/lib/libaom* || true
              if [ ! -e "$PREFIX/lib/libaom.so" ]; then
                real=$(ls "$PREFIX"/lib/libaom.so.* 2>/dev/null | head -n1 || true)
                if [ -n "${real:-}" ]; then
                  ln -sf "$(basename "$real")" "$PREFIX/lib/libaom.so"
                elif [ -f "$PREFIX/lib/libaom.a" ]; then
                  echo "::warning::aom 未产出 .so，改用 PIC 静态库生成"
                  $CXX -shared -Wl,-soname,libaom.so -o "$PREFIX/lib/libaom.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libaom.a" -Wl,--no-whole-archive -lc++_static -lm
                fi
              fi
              if [ ! -f "$PREFIX/lib/libaom.a" ]; then
                A=$(find . -name 'libaom.a' | head -n1 || true)
                [ -n "${A:-}" ] && cp -f "$A" "$PREFIX/lib/libaom.a"
              fi
              test -f "$PREFIX/lib/libaom.a"  || { echo "libaom.a missing";  exit 1; }
              test -e "$PREFIX/lib/libaom.so" || { echo "libaom.so missing"; exit 1; }

              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/aom.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: aom
              Description: AOMedia Project AV1 Codec Library
              Version: 3.8.0
              Libs: -L\${libdir} -laom
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: svt-av1
            build: |
              set -euo pipefail
              git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git && cd SVT-AV1
              for mode in ON OFF; do
                rm -rf "build_$mode"; mkdir "build_$mode"; cd "build_$mode"
                cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                  -DANDROID_STL=c++_static -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                  -DBUILD_SHARED_LIBS="$mode" -DCMAKE_POSITION_INDEPENDENT_CODE=ON
                ninja && ninja install
                cd ..
              done
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/SvtAv1Enc.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: SvtAv1Enc
              Description: SVT-AV1 Encoder
              Version: 1.8.0
              Libs: -L\${libdir} -lSvtAv1Enc
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir} -I\${includedir}/svt-av1
              EOF

          - name: vvenc
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git && cd vvenc
              for mode in ON OFF; do
                rm -rf "build_$mode"; mkdir "build_$mode"; cd "build_$mode"
                cmake .. -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                  -DANDROID_STL=c++_static -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                  -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS="$mode" \
                  -DCMAKE_POSITION_INDEPENDENT_CODE=ON
                make -j"$(nproc)" && make install
                cd ..
              done
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/libvvenc.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: libvvenc
              Description: Fraunhofer Versatile Video Encoder
              Version: 1.11.0
              Libs: -L\${libdir} -lvvenc
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir} -I\${includedir}/vvenc
              EOF

          - name: xeve
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/mpeg5/xeve.git && cd xeve
              for mode in ON OFF; do
                rm -rf "build_$mode"; mkdir "build_$mode"; cd "build_$mode"
                cmake .. -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                  -DANDROID_STL=c++_static -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                  -DSET_PROF=MAIN -DBUILD_SHARED_LIBS="$mode" \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
                make -j"$(nproc)"
                make install || true
                cd ..
              done

              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              echo "--- xeve 构建产物 ---"
              find . -name 'libxeve*' -o -name 'xeve*.h' | sort || true

              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              while IFS= read -r h; do cp -f "$h" "$PREFIX/include/"; done \
                < <(find . -maxdepth 3 -name 'xeve*.h' -not -path './build_*/*' 2>/dev/null || true)

              while IFS= read -r f; do cp -af "$f" "$PREFIX/lib/"; done \
                < <(find . -maxdepth 4 -name 'libxeve.a'  -o -maxdepth 4 -name 'libxeve.so*' 2>/dev/null || true)
              if [ ! -e "$PREFIX/lib/libxeve.so" ]; then
                real=$(ls "$PREFIX"/lib/libxeve.so.* 2>/dev/null | head -n1 || true)
                if [ -n "${real:-}" ]; then
                  ln -sf "$(basename "$real")" "$PREFIX/lib/libxeve.so"
                elif [ -f "$PREFIX/lib/libxeve.a" ]; then
                  $CXX -shared -Wl,-soname,libxeve.so -o "$PREFIX/lib/libxeve.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libxeve.a" -Wl,--no-whole-archive -lc++_static -lm
                fi
              fi

              test -f "$PREFIX/lib/libxeve.a"  || { echo "libxeve.a missing";  exit 1; }
              test -e "$PREFIX/lib/libxeve.so" || { echo "libxeve.so missing"; exit 1; }
              test -f "$PREFIX/include/xeve.h" || { echo "xeve.h missing";     exit 1; }

              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/xeve.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: xeve
              Description: MPEG-5 EVC Encoder
              Version: 1.0.0
              Libs: -L\${libdir} -lxeve
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: xevd
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/mpeg5/xevd.git && cd xevd
              for mode in ON OFF; do
                rm -rf "build_$mode"; mkdir "build_$mode"; cd "build_$mode"
                cmake .. -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                  -DANDROID_STL=c++_static -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                  -DBUILD_SHARED_LIBS="$mode" \
                  -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
                make -j"$(nproc)"
                make install || true
                cd ..
              done

              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              echo "--- xevd 构建产物 ---"
              find . -name 'libxevd*' -o -name 'xevd*.h' | sort || true

              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              while IFS= read -r h; do cp -f "$h" "$PREFIX/include/"; done \
                < <(find . -maxdepth 3 -name 'xevd*.h' -not -path './build_*/*' 2>/dev/null || true)

              while IFS= read -r f; do cp -af "$f" "$PREFIX/lib/"; done \
                < <(find . -maxdepth 4 -name 'libxevd.a' -o -maxdepth 4 -name 'libxevd.so*' 2>/dev/null || true)
              if [ ! -e "$PREFIX/lib/libxevd.so" ]; then
                real=$(ls "$PREFIX"/lib/libxevd.so.* 2>/dev/null | head -n1 || true)
                if [ -n "${real:-}" ]; then
                  ln -sf "$(basename "$real")" "$PREFIX/lib/libxevd.so"
                elif [ -f "$PREFIX/lib/libxevd.a" ]; then
                  $CXX -shared -Wl,-soname,libxevd.so -o "$PREFIX/lib/libxevd.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libxevd.a" -Wl,--no-whole-archive -lc++_static -lm
                fi
              fi

              test -f "$PREFIX/lib/libxevd.a"  || { echo "libxevd.a missing";  exit 1; }
              test -e "$PREFIX/lib/libxevd.so" || { echo "libxevd.so missing"; exit 1; }
              test -f "$PREFIX/include/xevd.h" || { echo "xevd.h missing";     exit 1; }

              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/xevd.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: xevd
              Description: MPEG-5 EVC Decoder
              Version: 1.0.0
              Libs: -L\${libdir} -lxevd
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: openssl
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/openssl/openssl.git && cd openssl
              export ANDROID_NDK_ROOT="$NDK"
              ./Configure android-arm64 -D__ANDROID_API__="$API_LEVEL" --prefix="$PREFIX" --openssldir="$PREFIX/ssl" no-tests
              make -j"$(nproc)" && make install_sw
              make clean
              ./Configure android-arm64 -D__ANDROID_API__="$API_LEVEL" --prefix="$PREFIX" --openssldir="$PREFIX/ssl" no-shared no-tests
              make -j"$(nproc)" && make install_sw
              for f in "$PREFIX"/lib/pkgconfig/*.pc; do
                [ -e "$f" ] || continue
                sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
              done

          - name: fdk-aac
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git && cd fdk-aac
              ./autogen.sh
              export CFLAGS="-D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration"
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --enable-static --enable-shared --with-pic --disable-example
              make -j"$(nproc)" && make install
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/fdk-aac.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: fdk-aac
              Description: Fraunhofer FDK AAC Codec Library
              Version: 2.0.3
              Libs: -L\${libdir} -lfdk-aac
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: lame
            build: |
              set -euo pipefail
              wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz && tar xf lame-3.100.tar.gz && cd lame-3.100
              sed -i '/lame_init_old/d' include/libmp3lame.sym
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --enable-static --enable-shared --with-pic --disable-frontend --disable-asm
              make -j"$(nproc)" && make install
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/lame.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: lame
              Description: MP3 encoding library
              Version: 3.100
              Libs: -L\${libdir} -lmp3lame
              Libs.private: $BASE_PRIVATE_LIBS
              Cflags: -I\${includedir}
              EOF

          - name: opus
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/xiph/opus.git && cd opus
              ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --enable-static --enable-shared --with-pic
              make -j"$(nproc)" && make install

          - name: vorbis
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/xiph/ogg.git && cd ogg
              ./autogen.sh && ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --enable-static --enable-shared --with-pic && make -j"$(nproc)" && make install && cd ..
              git clone --depth 1 https://github.com/xiph/vorbis.git && cd vorbis
              ./autogen.sh && ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --enable-static --enable-shared --with-pic && make -j"$(nproc)" && make install

          - name: lc3
            build: |
              set -euo pipefail
              git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 && cd liblc3
              mkdir -p obj "$PREFIX/lib" "$PREFIX/include"
              for f in src/*.c; do
                $CC -O2 -fPIC -Iinclude -c "$f" -o "obj/$(basename "${f%.c}").o"
              done
              $AR rcs "$PREFIX/lib/liblc3.a" obj/*.o
              $CC -shared -Wl,-soname,liblc3.so -o "$PREFIX/lib/liblc3.so" obj/*.o -lm
              cp -f include/*.h "$PREFIX/include/"
              test -f "$PREFIX/lib/liblc3.a"  || { echo "liblc3.a missing";  exit 1; }
              test -e "$PREFIX/lib/liblc3.so" || { echo "liblc3.so missing"; exit 1; }
              test -f "$PREFIX/include/lc3.h" || { echo "lc3.h missing";     exit 1; }
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/lc3.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: lc3
              Description: Low Complexity Communication Codec
              Version: 1.1.0
              Libs: -L\${libdir} -llc3
              Libs.private: -lm
              Cflags: -I\${includedir}
              EOF

          - name: webp
            build: |
              set -euo pipefail
              git clone --depth 1 https://github.com/webmproject/libwebp.git && cd libwebp
              ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --enable-static --enable-shared --with-pic \
                --disable-libwebpdemux --disable-libwebpmux
              make -j"$(nproc)" && make install
              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/libwebp.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              Name: libwebp
              Description: WebP image codec
              Version: 1.5.0
              Libs: -L\${libdir} -lwebp
              Libs.private: -lm
              Cflags: -I\${includedir}
              EOF

          - name: expat-fontconfig
            build: |
              set -euo pipefail
              wget -q https://github.com/libexpat/libexpat/releases/download/R_2_6_2/expat-2.6.2.tar.gz
              tar xf expat-2.6.2.tar.gz && cd expat-2.6.2
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                --enable-static --enable-shared --with-pic
              make -j"$(nproc)" && make install && cd ..

              pip3 install -U meson

              git clone --depth 1 https://gitlab.freedesktop.org/fontconfig/fontconfig.git && cd fontconfig
              cat > fontconfig.cross <<EOF
              [binaries]
              c = '$CC'
              cpp = '$CXX'
              ar = '$AR'
              strip = '$STRIP'
              pkgconfig = 'pkg-config'
              [host_machine]
              system = 'android'
              cpu_family = 'aarch64'
              cpu = 'aarch64'
              endian = 'little'
              EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              meson setup _build --cross-file fontconfig.cross \
                --prefix="$PREFIX" --default-library=both --buildtype=release \
                -Dxml-backend=expat -Ddoc=disabled -Dtests=disabled -Dtools=disabled
              ninja -C _build && ninja -C _build install && cd ..

              mkdir -p "$PREFIX/lib/pkgconfig"
              cat > "$PREFIX/lib/pkgconfig/fontconfig.pc" <<EOF
              prefix=$PREFIX
              exec_prefix=\${prefix}
              libdir=\${exec_prefix}/lib
              includedir=\${prefix}/include
              sysconfdir=\${prefix}/etc
              localstatedir=\${prefix}/var
              PACKAGE=fontconfig
              confdir=\${sysconfdir}/fonts
              cachedir=/var/cache/fontconfig

              Name: Fontconfig
              Description: Font configuration and customization library
              Version: 2.16.2
              Libs: -L\${libdir} -lfontconfig
              Libs.private: -L\${libdir} -lexpat -lfreetype -lm
              Cflags: -I\${includedir}
              EOF

          - name: ass-stack
            build: |
              set -euo pipefail
              mkdir -p "$PREFIX"
              export BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"
              export BASE_LDFLAGS="-L$PREFIX/lib"

              git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git && cd freetype
              ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                --enable-static --enable-shared --with-pic --without-zlib --without-png --without-bzip2 --without-harfbuzz \
                CFLAGS="-O2 -fPIC"
              make -j"$(nproc)" && make install && cd ..

              git clone --depth 1 https://github.com/fribidi/fribidi.git && cd fribidi
              cat > fribidi.cross <<EOF
              [binaries]
              c = '$CC'
              cpp = '$CXX'
              ar = '$AR'
              strip = '$STRIP'
              pkgconfig = 'pkg-config'
              [host_machine]
              system = 'android'
              cpu_family = 'aarch64'
              cpu = 'aarch64'
              endian = 'little'
              EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup _build --cross-file fribidi.cross \
                --prefix="$PREFIX" --default-library=both --buildtype=release \
                -Ddocs=false -Ddeprecated=false -Db_staticpic=true
              ninja -C _build && ninja -C _build install && cd ..

              git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git && cd harfbuzz
              cat > android.cross <<EOF
              [binaries]
              c = '$CC'
              cpp = '$CXX'
              ar = '$AR'
              strip = '$STRIP'
              pkgconfig = 'pkg-config'
              [properties]
              needs_exe_wrapper = true
              [host_machine]
              system = 'android'
              cpu_family = 'aarch64'
              cpu = 'aarch64'
              endian = 'little'
              EOF
              PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" meson setup _build --cross-file android.cross \
                --prefix="$PREFIX" --default-library=both --buildtype=release \
                -Db_staticpic=true -Dfreetype=enabled -Dglib=disabled -Dgobject=disabled \
                -Dcairo=disabled -Dicu=disabled -Dgraphite2=disabled \
                -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
              ninja -C _build && ninja -C _build install && cd ..

              for sub in fribidi harfbuzz; do
                if [ -d "$PREFIX/include/$sub" ]; then
                  for h in "$PREFIX/include/$sub"/*.h; do
                    [ -e "$h" ] || continue
                    ln -sf "$h" "$PREFIX/include/$(basename "$h")"
                  done
                fi
              done
              if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
                ln -sf "$PREFIX/include/freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
              fi

              git clone --depth 1 https://github.com/libass/libass.git && cd libass
              ./autogen.sh
              PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                --enable-static --enable-shared --with-pic \
                --disable-fontconfig --disable-require-system-font-provider \
                CFLAGS="-O2 -fPIC" CPPFLAGS="$BASE_CPPFLAGS" LDFLAGS="$BASE_LDFLAGS"
              make -j"$(nproc)" && make install

    steps:
      - uses: actions/checkout@v4

      - name: Restore prefix cache
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/prefix
          key: ${{ runner.os }}-prefix-${{ env.LIBS_CACHE_VERSION }}

      - name: Skip notice
        if: steps.cache-prefix.outputs.cache-hit == 'true'
        run: echo "🎉 Prefix cache hit! Skipping external lib compilation."

      - name: Install host dependencies
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config nasm yasm cmake meson ninja-build git wget unzip gperf gettext libexpat1-dev

      - name: Cache NDK
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK Permissions (cache hit)
        if: steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x ${{ github.workspace }}/ndk

      - name: Download NDK (cache miss)
        if: steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* ${{ github.workspace }}/ndk
          rm ndk.zip
          chmod -R +x ${{ github.workspace }}/ndk

      - name: Set toolchain environment
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH

      - name: Build ${{ matrix.name }}
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        shell: bash
        run: ${{ matrix.build }}

      - name: Upload ${{ matrix.name }} (per-lib snapshot)
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prefix-${{ matrix.name }}
          path: ${{ env.PREFIX }}
          retention-days: 1

  # ==================== Job 2: 合并 prefix + 打包 tar.xz + 写缓存 ====================
  combine-prefix:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Restore prefix from cache
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/prefix
          key: ${{ runner.os }}-prefix-${{ env.LIBS_CACHE_VERSION }}

      - name: Download per-lib prefix artifacts (cache miss)
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: prefix-*
          path: ${{ github.workspace }}/prefix
          merge-multiple: true

      - name: Sanity check merged prefix
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/prefix"
          echo "so=$(find lib -name '*.so*' 2>/dev/null | wc -l) a=$(find lib -name '*.a' 2>/dev/null | wc -l) pc=$(find lib/pkgconfig -name '*.pc' 2>/dev/null | wc -l)"
          test -d lib && test -d include

      - name: Save prefix to cache (cache miss)
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/prefix
          key: ${{ runner.os }}-prefix-${{ env.LIBS_CACHE_VERSION }}

      - name: Pack prefix tarball
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf prefix-android-arm64-v8a.tar.xz prefix
          ls -lh prefix-android-arm64-v8a.tar.xz

      - name: Upload merged prefix
        uses: actions/upload-artifact@v4
        with:
          name: prefix-merged
          path: ${{ github.workspace }}/prefix
          retention-days: 1

      - name: Upload prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: prefix-tarball
          path: ${{ github.workspace }}/prefix-android-arm64-v8a.tar.xz
          retention-days: 1

  # ==================== Job 3: 编译 FFmpeg ====================
  build-ffmpeg:
    needs: combine-prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK Permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x ${{ github.workspace }}/ndk

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* ${{ github.workspace }}/ndk
          rm ndk.zip
          chmod -R +x ${{ github.workspace }}/ndk

      - name: Download merged prefix
        uses: actions/download-artifact@v4
        with:
          name: prefix-merged
          path: ${{ github.workspace }}/prefix

      - name: Set FFmpeg environment
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "NDK=${{ github.workspace }}/ndk" >> $GITHUB_ENV
          echo "SYSROOT=$TOOLCHAIN/sysroot" >> $GITHUB_ENV
          echo "PREFIX=${{ github.workspace }}/prefix" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=${{ github.workspace }}/prefix/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_LIBDIR=${{ github.workspace }}/prefix/lib/pkgconfig" >> $GITHUB_ENV
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV

      - name: Normalize pkg-config files
        run: |
          set -euo pipefail
          PC_DIR="$PREFIX/lib/pkgconfig"
          mkdir -p "$PC_DIR"
          for f in "$PC_DIR"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
          done
          for m in x265 xeve xevd aom; do
            if [ ! -f "$PC_DIR/$m.pc" ]; then
              case "$m" in
                x265) desc="H.265/HEVC video encoder"; lib=x265 ;;
                aom)  desc="AOMedia Project AV1 Codec Library"; lib=aom ;;
                xeve) desc="MPEG-5 EVC Encoder"; lib=xeve ;;
                xevd) desc="MPEG-5 EVC Decoder"; lib=xevd ;;
              esac
              cat > "$PC_DIR/$m.pc" <<EOF
          prefix=$PREFIX
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: $m
          Description: $desc
          Version: 1.0.0
          Libs: -L\${libdir} -l$lib
          Libs.private: $BASE_PRIVATE_LIBS
          Cflags: -I\${includedir}
          EOF
            fi
          done

      - name: Repair missing shared libs from static archives
        shell: bash
        run: |
          set -uo pipefail
          cd "$PREFIX/lib" || exit 0
          for a in *.a; do
            base=${a%.a}
            if [ -e "$base.so" ] || ls "${base}.so".* >/dev/null 2>&1; then continue; fi
            echo "--- synthesizing $base.so from $a ---"
            $CXX -shared -Wl,-soname,"$base.so" -o "$base.so" \
              -Wl,--whole-archive "$a" -Wl,--no-whole-archive -lc++_static -lm -lz 2>&1 | tail -n 5 \
              || { echo "::warning::cannot synthesize $base.so"; rm -f "$base.so"; }
          done

      - name: Verify all external libs
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          declare -A H=(
            [x264]=x264.h [x265]=x265.h [dav1d]=dav1d/dav1d.h [vpx]=vpx/vpx_decoder.h
            [aom]=aom/aom_decoder.h [SvtAv1Enc]=svt-av1/EbSvtAv1Enc.h [libvvenc]=vvenc/vvenc.h
            [xeve]=xeve.h [xevd]=xevd.h [openssl]=openssl/ssl.h [fdk-aac]=fdk-aac/aacenc_lib.h
            [lame]=lame/lame.h [opus]=opus/opus.h [vorbis]=vorbis/codec.h [lc3]=lc3.h
            [libwebp]=webp/encode.h [expat]=expat.h [fontconfig]=fontconfig/fontconfig.h
            [freetype2]=freetype2/ft2build.h [fribidi]=fribidi/fribidi.h
            [harfbuzz]=harfbuzz/hb.h [libass]=ass/ass.h
          )
          declare -A L=(
            [x264]=x264 [x265]=x265 [dav1d]=dav1d [vpx]=vpx [aom]=aom
            [SvtAv1Enc]=SvtAv1Enc [libvvenc]=vvenc [xeve]=xeve [xevd]=xevd
            [openssl]=ssl [fdk-aac]=fdk-aac [lame]=mp3lame [opus]=opus
            [vorbis]=vorbis [lc3]=lc3 [libwebp]=webp [expat]=expat
            [fontconfig]=fontconfig [freetype2]=freetype [fribidi]=fribidi
            [harfbuzz]=harfbuzz [libass]=ass
          )
          for m in $(printf '%s\n' "${!H[@]}" | sort); do
            lib=${L[$m]}
            [ -f "$PREFIX/include/${H[$m]}" ]    || { echo "::error::header missing: $m (${H[$m]})"; fail=1; }
            [ -f "$PREFIX/lib/pkgconfig/$m.pc" ] || { echo "::error::pc missing: $m.pc"; fail=1; }
            { [ -e "$PREFIX/lib/lib${lib}.so" ] || ls "$PREFIX/lib/lib${lib}.so".* >/dev/null 2>&1; } || { echo "::error::so missing: lib${lib}"; fail=1; }
            [ -f "$PREFIX/lib/lib${lib}.a" ]     || { echo "::error::static missing: lib${lib}.a"; fail=1; }
            pkg-config --exists "$m"             || { echo "::error::pkg-config broken: $m"; fail=1; }
          done
          echo "--- headers ---"; find "$PREFIX/include" -maxdepth 1 -type f | sort | head -n 60
          echo "--- libs ---";    ls "$PREFIX/lib" | sort
          [ "$fail" -eq 0 ] || exit 1

      - name: Link test via pkg-config (shared + static)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/t.c <<'EOF'
          #include <x265.h>
          #include <aom/aom_decoder.h>
          #include <fdk-aac/aacenc_lib.h>
          #include <lame/lame.h>
          #include <lc3.h>

          int main(void) {
            const x265_api *a = x265_api_get(8);
            HANDLE_AACENCODER h = NULL;
            (void)aacEncOpen(&h, 0, 0);
            (void)lame_init();
            unsigned (*lc3_size_fn)(enum lc3_dt, int) = &lc3_encoder_size;
            (void)lc3_size_fn;
            (void)a;
            return 0;
          }
          EOF
          echo "== shared =="; $CC /tmp/t.c -o /tmp/t_shared $(pkg-config --cflags --libs x265 aom fdk-aac lame lc3)
          echo "== static =="; $CC /tmp/t.c -o /tmp/t_static $(pkg-config --static --cflags --libs x265 aom fdk-aac lame lc3)
          echo "==> link tests OK"

      - name: Download FFmpeg Source
        run: |
          wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure FFmpeg (Shared)
        working-directory: ffmpeg
        run: |
          ./configure \
            --prefix="$PREFIX" \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --pkg-config=pkg-config --pkg-config-flags="" \
            --enable-shared --enable-static --enable-pic \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lc++_static -lm -lz" \
          || { echo "::group::config.log failures"; grep -n -i -E "ERROR|error:|undefined reference|cannot find" ffbuild/config.log | tail -n 120 || true; echo "::endgroup::"; exit 1; }

      - name: Build FFmpeg (Shared)
        working-directory: ffmpeg
        run: make -j"$(nproc)" && make install

      - name: Configure FFmpeg (Static)
        run: |
          cp -r ffmpeg ffmpeg-static
          cd ffmpeg-static
          make distclean || true
          ./configure \
            --prefix="$PREFIX" \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --disable-shared --enable-static --enable-pic \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lc++_static -lm -lz" \
          || { echo "::group::config.log failures"; grep -n -i -E "ERROR|error:|undefined reference|cannot find" ffbuild/config.log | tail -n 120 || true; echo "::endgroup::"; exit 1; }

      - name: Build FFmpeg Static Binaries
        working-directory: ffmpeg-static
        run: |
          make -j"$(nproc)" ffmpeg ffprobe
          $STRIP ffmpeg ffprobe

      - name: Package entire prefix directory
        run: |
          set -euo pipefail
          mkdir -p "$PREFIX/bin_static"
          cp ffmpeg-static/ffmpeg ffmpeg-static/ffprobe "$PREFIX/bin_static/"
          echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > "$PREFIX/BUILD_INFO.txt"
          "$PREFIX/bin/ffmpeg" -buildconf >> "$PREFIX/BUILD_INFO.txt" 2>/dev/null || true
          echo "so=$(find "$PREFIX/lib" -name '*.so*' | wc -l) a=$(find "$PREFIX/lib" -name '*.a' | wc -l) pc=$(find "$PREFIX/lib/pkgconfig" -name '*.pc' | wc -l)"
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-android-arm64-v8a.tar.xz prefix
          mkdir -p artifacts
          mv ffmpeg-android-arm64-v8a.tar.xz artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-final
          path: artifacts/
          retention-days: 1

  # ==================== Job 4: 发布 Release（两个 tar.xz） ====================
  release:
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download ffmpeg-final
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-final
          path: artifacts

      - name: Download prefix-tarball
        uses: actions/download-artifact@v4
        with:
          name: prefix-tarball
          path: artifacts

      - name: Prepare release env
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## FFmpeg Android Build (arm64-v8a)

            - **Build Date**: ${{ env.BUILD_DATE }}
            - **NDK**: r30 (API 36)
            - **FFmpeg**: 9.0.2

            ### 发布产物

            | 文件 | 内容 |
            |---|---|
            | `ffmpeg-android-arm64-v8a.tar.xz` | FFmpeg 全量产物：外部库 `.so/.a/.pc` + `include/` + `bin/`（ffmpeg/ffprobe 动态）+ `bin_static/`（静态） |
            | `prefix-android-arm64-v8a.tar.xz`  | **纯外部库合集**（x264/x265/dav1d/vpx/aom/svt-av1/vvenc/xeve/xevd/openssl/fdk-aac/lame/opus/vorbis/lc3/webp/expat/fontconfig/freetype/fribidi/harfbuzz/libass），供下游直接复用 |

            ### 下游复用外部库

            在独立 workflow `Build FFmpeg (arm64-v8a) — standalone / reusable` 中：

            ```
            prefix_source:  url
            prefix_url:     ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/prefix-android-arm64-v8a.tar.xz
            ffmpeg_version: 9.0.2
            ```

            脚本会自动识别 tarball 顶层 `prefix/` 目录并放置到 `$GITHUB_WORKSPACE/prefix`。
          files: |
            artifacts/ffmpeg-android-arm64-v8a.tar.xz
            artifacts/prefix-android-arm64-v8a.tar.xz
          generate_release_notes: true