name: Build external libs for Android (arm64-v8a)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Job 1：外部库。每库两遍：static → prefix/static，shared → prefix/shared
  #        NDK 每次重新下载（与 test.yml 一致，不用任何缓存）
  # =====================================================================
  build-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x264
            libs: "x264"
            build: |
              [ -d x264 ] || git clone --depth 1 https://code.videolan.org/videolan/x264.git x264
              cd x264
              make distclean >/dev/null 2>&1 || true
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --cross-prefix="$TOOLCHAIN/bin/llvm-" \
                $LTOPT --enable-pic --disable-cli
              make -j"$(nproc)"
              make install

          # x265：ENABLE_SHARED 在交叉编译下不一定出 .so → 缺则由 .a 合成
          - name: x265
            libs: "x265"
            build: |
              [ -d x265_git ] || git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git x265_git
              cd x265_git
              sed -i 's/list(APPEND PLATFORM_LIBS pthread)/# list(APPEND PLATFORM_LIBS pthread)/' source/CMakeLists.txt || true
              rm -rf build
              cmake -S source -B build -G "Unix Makefiles" \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DENABLE_CLI=OFF -DENABLE_ASSEMBLY=OFF \
                -DENABLE_SHARED="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              if [ "$LINK" = "shared" ]; then
                find build -name 'libx265*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
                if [ ! -e "$PREFIX/lib/libx265.so" ] && [ -f "$PREFIX/lib/libx265.a" ]; then
                  echo "x265: 由 libx265.a 合成 libx265.so"
                  $CXX -shared -Wl,-soname,libx265.so -o "$PREFIX/lib/libx265.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libx265.a" -Wl,--no-whole-archive \
                    -lc++_static -lm || echo "::warning::x265: .so 合成失败"
                fi
              fi
              mkpc x265 "H.265/HEVC encoder" "4.1" x265

          - name: dav1d
            libs: "dav1d"
            build: |
              [ -d dav1d ] || git clone --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d
              cd dav1d
              rm -rf _build
              {
                printf '[binaries]\n'
                printf "c = '%s'\n" "$CC"
                printf "cpp = '%s'\n" "$CXX"
                printf "ar = '%s'\n" "$AR"
                printf "strip = '%s'\n" "$STRIP"
                printf "pkgconfig = 'pkg-config'\n"
                printf '\n[properties]\nneeds_exe_wrapper = true\n'
                printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
              } > android.cross
              meson setup _build --cross-file android.cross --prefix="$PREFIX" \
                --default-library="$MESON_LIB" --buildtype=release \
                -Denable_tools=false -Denable_tests=false
              ninja -C _build
              ninja -C _build install

          - name: libvpx
            libs: "vpx"
            build: |
              [ -d libvpx ] || git clone --depth 1 https://github.com/webmproject/libvpx.git libvpx
              cd libvpx
              make distclean >/dev/null 2>&1 || true
              find . -name "configure*" -type f -exec \
                sed -i 's/die "--enable-shared only supported on ELF, OS\/2, and Darwin for now"/echo "Skipping ELF check for Android"/g' {} +
              export CROSS="$TOOLCHAIN/bin/llvm-"
              export ASFLAGS="-D__ANDROID__"
              export LDFLAGS="-Wl,-z,max-page-size=16384"
              ./configure --prefix="$PREFIX" --target=arm64-android-gcc --libc="$SYSROOT" \
                --enable-vp8 --enable-vp9 $LTOPT \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="-fPIC"
              make -j"$(nproc)"
              make install

          - name: libaom
            libs: "aom"
            build: |
              [ -d aom ] || git clone --depth 1 https://aomedia.googlesource.com/aom aom
              cd aom
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF \
                -DCONFIG_AV1_ENCODER=1 -DCONFIG_PIC=1 \
                -DAOM_TARGET_CPU=arm64 -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              if [ ! -f "$PREFIX/lib/pkgconfig/aom.pc" ]; then
                mkpc aom "AOMedia AV1 codec" "3.8.0" aom
              fi

          - name: svt-av1
            libs: "SvtAv1Enc"
            build: |
              [ -d SVT-AV1 ] || git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git SVT-AV1
              cd SVT-AV1
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build

          - name: vvenc
            libs: "vvenc"
            build: |
              [ -d vvenc ] || git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git vvenc
              cd vvenc
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              mkpc libvvenc "Fraunhofer VVC encoder" "1.11.0" vvenc "" "-I\${includedir}/vvenc"

          # xeve：install 只装 .a，.so 在 build/ → 捞；仍无则用 .a 合成
          - name: xeve
            libs: "xeve"
            build: |
              [ -d xeve ] || git clone --depth 1 https://github.com/mpeg5/xeve.git xeve
              cd xeve
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" -DSET_PROF=MAIN \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              rm -rf "$PREFIX/lib/xeve"
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xeve*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              echo "--- xeve build 产物 ---"
              find build \( -name 'libxeve*.a' -o -name 'libxeve*.so*' \) 2>/dev/null | sort || true
              find build -name 'libxeve.a'   -exec cp -af  {} "$PREFIX/lib/" \; 2>/dev/null || true
              find build -name 'libxeve*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
              if [ "$LINK" = "shared" ] && [ ! -e "$PREFIX/lib/libxeve.so" ] \
                 && [ -f "$PREFIX/lib/libxeve.a" ]; then
                echo "xeve: 由 libxeve.a 合成 libxeve.so"
                $CC -shared -Wl,-soname,libxeve.so -o "$PREFIX/lib/libxeve.so" \
                  -Wl,--whole-archive "$PREFIX/lib/libxeve.a" -Wl,--no-whole-archive -lm \
                  || echo "::warning::xeve: .so 合成失败"
              fi
              mkpc xeve "MPEG-5 EVC encoder" "1.0.0" xeve "" "-I\${includedir}/xeve"

          - name: xevd
            libs: "xevd"
            build: |
              [ -d xevd ] || git clone --depth 1 https://github.com/mpeg5/xevd.git xevd
              cd xevd
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              rm -rf "$PREFIX/lib/xevd"
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xevd*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              echo "--- xevd build 产物 ---"
              find build \( -name 'libxevd*.a' -o -name 'libxevd*.so*' \) 2>/dev/null | sort || true
              find build -name 'libxevd.a'   -exec cp -af  {} "$PREFIX/lib/" \; 2>/dev/null || true
              find build -name 'libxevd*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
              if [ "$LINK" = "shared" ] && [ ! -e "$PREFIX/lib/libxevd.so" ] \
                 && [ -f "$PREFIX/lib/libxevd.a" ]; then
                echo "xevd: 由 libxevd.a 合成 libxevd.so"
                $CC -shared -Wl,-soname,libxevd.so -o "$PREFIX/lib/libxevd.so" \
                  -Wl,--whole-archive "$PREFIX/lib/libxevd.a" -Wl,--no-whole-archive -lm \
                  || echo "::warning::xevd: .so 合成失败"
              fi
              mkpc xevd "MPEG-5 EVC decoder" "1.0.0" xevd "" "-I\${includedir}/xevd"

          # openssl：static=no-shared，shared=shared；provider/engine 模块一律清掉
          - name: openssl
            libs: "ssl crypto"
            build: |
              [ -d openssl ] || git clone --depth 1 https://github.com/openssl/openssl.git openssl
              cd openssl
              make clean >/dev/null 2>&1 || true
              export ANDROID_NDK_ROOT="$NDK"
              if [ "$LINK" = "static" ]; then OSSL_MODE="no-shared"; else OSSL_MODE="shared"; fi
              echo "openssl: $OSSL_MODE ($LINK)"
              ./Configure android-arm64 -D__ANDROID_API__="$API_LEVEL" \
                --prefix="$PREFIX" --openssldir="$PREFIX/ssl" --libdir=lib \
                $OSSL_MODE no-tests
              make -j"$(nproc)"
              make install_sw
              rm -rf "$PREFIX/lib/ossl-modules" "$PREFIX"/lib/engines-*
              echo "--- openssl 构建后 ---"
              ls -1 "$PREFIX/lib" | sort | grep -E 'ssl|crypto' || true
              for l in crypto ssl; do
                if [ "$LINK" = "shared" ] && [ ! -e "$PREFIX/lib/lib${l}.so" ] \
                   && [ -f "$PREFIX/lib/lib${l}.a" ]; then
                  echo "openssl: 由 lib${l}.a 合成 lib${l}.so"
                  $CC -shared -Wl,-soname,"lib${l}.so" -o "$PREFIX/lib/lib${l}.so" \
                    -Wl,--whole-archive "$PREFIX/lib/lib${l}.a" -Wl,--no-whole-archive \
                    -ldl -pthread || echo "::warning::openssl: lib${l}.so 合成失败"
                fi
              done
              for f in "$PREFIX"/lib/pkgconfig/*.pc; do
                [ -e "$f" ] || continue
                sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
              done

          - name: fdk-aac
            libs: "fdk-aac"
            build: |
              [ -d fdk-aac ] || git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git fdk-aac
              cd fdk-aac
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              CFLAGS="$EXTRA_CFLAGS -D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration" \
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-example
              make -j"$(nproc)"
              make install
              mkpc fdk-aac "Fraunhofer FDK AAC" "2.0.3" fdk-aac

          - name: lame
            libs: "mp3lame"
            build: |
              if [ ! -d lame-3.100 ]; then
                wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
                tar xf lame-3.100.tar.gz
              fi
              cd lame-3.100
              make distclean >/dev/null 2>&1 || true
              sed -i '/lame_init_old/d' include/libmp3lame.sym
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-frontend --disable-asm
              make -j"$(nproc)"
              make install
              mkpc lame "MP3 encoding library" "3.100" mp3lame

          - name: opus
            libs: "opus"
            build: |
              [ -d opus ] || git clone --depth 1 https://github.com/xiph/opus.git opus
              cd opus
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --build=x86_64-pc-linux-gnu \
                CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                CFLAGS="$EXTRA_CFLAGS" LDFLAGS="" \
                $LTOPT --with-pic
              make -j"$(nproc)"
              make install

          - name: vorbis
            libs: "ogg vorbis vorbisenc vorbisfile"
            build: |
              v_build() {
                local dir="$1" url="$2"
                [ -d "$dir" ] || git clone --depth 1 "$url" "$dir"
                (
                  cd "$dir"
                  git clean -xdf >/dev/null 2>&1 || true
                  autoreconf -fiv >/dev/null 2>&1 || autoreconf -fiv
                  ./configure --prefix="$PREFIX" --build=x86_64-pc-linux-gnu \
                    --host="$ANDROID_TRIPLE" \
                    CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                    CFLAGS="$EXTRA_CFLAGS" CXXFLAGS="$EXTRA_CFLAGS" LDFLAGS="" \
                    $LTOPT --with-pic
                  make -j"$(nproc)"
                  make install
                )
              }
              v_build ogg    https://github.com/xiph/ogg.git
              v_build vorbis https://github.com/xiph/vorbis.git

          - name: lc3
            libs: "lc3"
            build: |
              [ -d liblc3 ] || git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 liblc3
              cd liblc3
              rm -rf obj && mkdir -p obj
              for f in src/*.c; do
                $CC -O2 -fPIC -Iinclude -c "$f" -o "obj/$(basename "${f%.c}").o"
              done
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              if [ "$LINK" = "static" ]; then
                $AR rcs "$PREFIX/lib/liblc3.a" obj/*.o
              else
                $CC -shared -Wl,-soname,liblc3.so -o "$PREFIX/lib/liblc3.so" obj/*.o -lm
              fi
              find include -name '*.h' -exec cp -f {} "$PREFIX/include/" \;
              mkpc liblc3 "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"
              mkpc lc3    "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"

          - name: webp
            libs: "webp sharpyuv"
            build: |
              [ -d libwebp ] || git clone --depth 1 https://github.com/webmproject/libwebp.git libwebp
              cd libwebp
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-libwebpdemux --disable-libwebpmux
              make -j"$(nproc)"
              make install
              mkpc libwebp "WebP image codec" "1.5.0" webp

          # 文本链：完全照搬 test.yml 的 build_stack
          - name: text-stack
            libs: "freetype fribidi harfbuzz ass"
            build: |
              set -o errexit

              if [ "$LINK" = "static" ]; then
                CFLAGS_EXTRA="-O2 -fPIC"
              else
                CFLAGS_EXTRA="-O2"
              fi

              BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"

              BASE_LDFLAGS="-L$PREFIX/lib"
              if [ "$LINK" = "shared" ]; then
                BASE_LDFLAGS="$BASE_LDFLAGS -Wl,-rpath,."
              fi

              # ================= 1) FreeType =================
              echo "### FreeType ($LINK)"
              [ -d freetype ] || git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git freetype
              (
                cd freetype
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                ./configure \
                  --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic \
                  --without-zlib --without-png --without-bzip2 --without-harfbuzz \
                  CFLAGS="$CFLAGS_EXTRA"
                make -j"$(nproc)"
                make install
              )

              # ================= 2) FriBidi =================
              echo "### FriBidi ($LINK)"
              [ -d fribidi ] || git clone --depth 1 https://github.com/fribidi/fribidi.git fribidi
              (
                cd fribidi
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > fribidi.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file fribidi.cross \
                  --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" \
                  --buildtype=release \
                  -Ddocs=false -Ddeprecated=false -Db_staticpic=true
                ninja -C _build
                ninja -C _build install
              )

              # ================= 3) HarfBuzz =================
              echo "### HarfBuzz ($LINK)"
              [ -d harfbuzz ] || git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git harfbuzz
              (
                cd harfbuzz
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[properties]\nneeds_exe_wrapper = true\n'
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > android.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file android.cross \
                  --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" \
                  --buildtype=release \
                  -Db_staticpic=true -Dfreetype=enabled \
                  -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
                  -Dicu=disabled -Dgraphite2=disabled \
                  -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
                ninja -C _build
                ninja -C _build install
              )

              # ================= 4) 头文件归一化 =================
              for sub in fribidi harfbuzz; do
                [ -d "$PREFIX/include/$sub" ] || continue
                for h in "$PREFIX/include/$sub"/*.h; do
                  [ -e "$h" ] || continue
                  ln -sf "$sub/$(basename "$h")" "$PREFIX/include/$(basename "$h")"
                done
              done
              if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
                ln -sf "freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
              fi

              # ================= 5) libass =================
              echo "### libass ($LINK)"
              [ -d libass ] || git clone --depth 1 https://github.com/libass/libass.git libass
              (
                cd libass
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                ./configure \
                  --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic \
                  --disable-fontconfig \
                  --disable-require-system-font-provider \
                  CFLAGS="$CFLAGS_EXTRA" \
                  CPPFLAGS="$BASE_CPPFLAGS" \
                  LDFLAGS="$BASE_LDFLAGS"
                make -j"$(nproc)"
                make install
              )

              # ================= 6) 自检 =================
              if [ "$LINK" = "shared" ]; then
                echo "--- libass.so RUNPATH ---"
                readelf -d "$PREFIX/lib/libass.so" 2>/dev/null | grep -E 'RUNPATH|RPATH' || echo "  (none)"
                if readelf -d "$PREFIX/lib/libass.so" 2>/dev/null | grep -qE '\[\.\]'; then
                  echo "✅ libass.so RUNPATH 含 [.]"
                else
                  echo "::warning::libass.so RUNPATH 未含 [.]"
                fi
              fi
              echo "✅ text-stack [$LINK] ok"

    steps:
      - uses: actions/checkout@v4

      # 宿主依赖：与 test.yml 完全一致
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip \
            gperf gettext libexpat1-dev python3-pip xz-utils

      - name: Upgrade meson
        run: |
          python3 -m pip install --user --break-system-packages -U "meson>=1.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      # ★ 与 test.yml 一致：每次重新下载解压 NDK（不使用任何缓存）
      - name: Download and Unpack NDK
        run: |
          set -euo pipefail
          df -h / | tail -1
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"
          df -h / | tail -1

      - name: Set toolchain env
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "PREFIX_STATIC=${{ github.workspace }}/prefix/static"
            echo "PREFIX_SHARED=${{ github.workspace }}/prefix/shared"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      # ★ 冒烟测试：先确认编译器能出可执行文件，再谈各库构建
      - name: Verify toolchain
        run: |
          set -euxo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          "$CXX" /tmp/smoke.c -o /tmp/smoke.out
          echo "✅ 编译器可正常创建可执行文件"

      - name: Install mkpc helper
        run: |
          mkdir -p "$HOME/.local/bin"
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'mkpc() {'
            printf '%s\n' '  local name="$1" desc="$2" ver="$3" lib="$4"'
            printf '%s\n' '  local priv="${5:-}"'
            printf '%s\n' '  local cflags="${6:-}"'
            printf '%s\n' '  if [ -z "$priv" ]; then'
            printf '%s\n' '    if [ "$LINK" = "static" ]; then priv="-lc++_static -lm"; else priv="-lm"; fi'
            printf '%s\n' '  fi'
            printf '%s\n' '  mkdir -p "$PREFIX/lib/pkgconfig"'
            printf '%s\n' '  local out="$PREFIX/lib/pkgconfig/$name.pc"'
            printf '%s\n' '  {'
            printf '%s\n' '    echo "prefix=$PREFIX"'
            printf '%s\n' '    echo "exec_prefix=\${prefix}"'
            printf '%s\n' '    echo "libdir=\${exec_prefix}/lib"'
            printf '%s\n' '    echo "includedir=\${prefix}/include"'
            printf '%s\n' '    echo'
            printf '%s\n' '    echo "Name: $name"'
            printf '%s\n' '    echo "Description: $desc"'
            printf '%s\n' '    echo "Version: $ver"'
            printf '%s\n' '    echo "Libs: -L\${libdir} -l$lib"'
            printf '%s\n' '    echo "Libs.private: $priv"'
            printf '%s\n' '    echo "Cflags: -I\${includedir} $cflags"'
            printf '%s\n' '  } > "$out"'
            printf '%s\n' '  echo "[mkpc] $out"'
            printf '%s\n' '}'
            printf '%s\n' 'mkpc "$@"'
          } > "$HOME/.local/bin/mkpc"
          chmod +x "$HOME/.local/bin/mkpc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/mkpc_selftest && mkdir -p /tmp/mkpc_selftest
          PREFIX=/tmp/mkpc_selftest LINK=shared "$HOME/.local/bin/mkpc" selftest "self test" 0 selftestlib
          test -f /tmp/mkpc_selftest/lib/pkgconfig/selftest.pc

      - name: Build ${{ matrix.name }} (static + shared)
        shell: bash
        env:
          LIBS: ${{ matrix.libs }}
        run: |
          set -euo pipefail

          # 失败时自动 dump config.log / CMakeError.log，别再靠猜
          on_exit() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "::group::失败诊断 — ${{ matrix.name }} [$LINK]"
              find "${{ github.workspace }}" -maxdepth 5 -name config.log \
                   -not -path "*/ndk/*" -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  echo "=============== $f ==============="; tail -60 "$f"
                done
              find "${{ github.workspace }}" -maxdepth 6 -name CMakeError.log -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  echo "=============== $f ==============="; tail -40 "$f"
                done
              echo "::endgroup::"
            fi
            exit $rc
          }
          trap on_exit EXIT

          cat > /tmp/lib_build.sh <<'__LIB_EOF__'
          ${{ matrix.build }}
          __LIB_EOF__
          sed -n '1,5p' /tmp/lib_build.sh
          bash -n /tmp/lib_build.sh || { echo "::error::拼装后的构建脚本有语法错误"; exit 1; }

          # 动静态分离
          separate() {
            local link="$1" prefix="$2"
            [ -d "$prefix" ] || return 0
            if [ "$link" = "static" ]; then
              find "$prefix" -type d \( -name 'ossl-modules' -o -name 'engines-*' \) \
                -exec rm -rf {} + 2>/dev/null || true
              find "$prefix/lib" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) \
                -print -delete 2>/dev/null || true
            else
              find "$prefix/lib" -maxdepth 1 -name '*.a' -print -delete 2>/dev/null || true
            fi
          }

          run_variant() {
            local link="$1" prefix="$2"
            echo "::group::=== ${{ matrix.name }} [$link] ==="
            export LINK="$link"
            export PREFIX="$prefix"
            export EXTRA_CFLAGS="-O2 -fPIC"
            if [ "$link" = "static" ]; then
              export LTOPT="--enable-static --disable-shared"
              export MESON_LIB="static"
              export CMAKE_SHARED_LIBS="OFF"
            else
              export LTOPT="--disable-static --enable-shared"
              export MESON_LIB="shared"
              export CMAKE_SHARED_LIBS="ON"
            fi
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1
            mkdir -p "$prefix/lib/pkgconfig" "$prefix/include"
            bash /tmp/lib_build.sh
            separate "$link" "$prefix"
            echo "::endgroup::"
          }

          run_variant static "$PREFIX_STATIC"
          run_variant shared "$PREFIX_SHARED"

          echo "--- ${{ matrix.name }} static ---"
          find "$PREFIX_STATIC/lib" -maxdepth 1 \( -type f -o -type l \) 2>/dev/null \
            | grep -Ei "$(echo $LIBS | tr ' ' '|')" || true
          echo "--- ${{ matrix.name }} shared ---"
          find "$PREFIX_SHARED/lib" -maxdepth 1 \( -type f -o -type l \) 2>/dev/null \
            | grep -Ei "$(echo $LIBS | tr ' ' '|')" || true

      - name: Upload prefix
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/prefix/static
            ${{ github.workspace }}/prefix/shared
          retention-days: 1

  # =====================================================================
  # Job 2：合并 + find 二次分离 + 打包 prefix/{static,shared}
  # =====================================================================
  package:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download per-lib prefixes
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: ${{ github.workspace }}/prefix
          merge-multiple: true

      - name: Normalize prefix with find
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefix"
          mkdir -p "$P/static/lib/pkgconfig" "$P/static/include" \
                   "$P/shared/lib/pkgconfig" "$P/shared/include" "$P/_stray"

          find "$P/static" -type d \( -name 'ossl-modules' -o -name 'engines-*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          find "$P/static/lib" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              echo "::warning::static 里移出 .so：$(basename "$f")"
              mv -f "$f" "$P/_stray/" 2>/dev/null || true
            done

          find "$P/shared/lib" -maxdepth 1 -name '*.a' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              echo "::warning::shared 里移出 .a：$(basename "$f")"
              mv -f "$f" "$P/_stray/" 2>/dev/null || true
            done

          rel='${pcfiledir}/../..'
          for d in static shared; do
            find "$P/$d/lib/pkgconfig" -name '*.pc' -print0 2>/dev/null |
              while IFS= read -r -d '' f; do
                sed -i "s|$P/$d|$rel|g" "$f"
                sed -i -E "s#^prefix=.*#prefix=$rel#" "$f"
              done
          done

          echo "===== 统计 ====="
          for d in static shared; do
            echo "[$d] a=$(find "$P/$d/lib" -maxdepth 1 -name '*.a' | wc -l)" \
                 "so=$(find "$P/$d/lib" -maxdepth 1 -name '*.so*' | wc -l)" \
                 "pc=$(find "$P/$d/lib/pkgconfig" -name '*.pc' | wc -l)" \
                 "hdr=$(find "$P/$d/include" -name '*.h' | wc -l)"
          done

          echo "===== 缺库检查（有库即过）====="
          miss=""
          for lib in x264 x265 dav1d vpx aom SvtAv1Enc vvenc xeve xevd ssl crypto \
                     fdk-aac mp3lame opus ogg vorbis vorbisenc lc3 webp \
                     freetype fribidi harfbuzz ass; do
            s="-"; h="-"
            find "$P/static/lib" -maxdepth 1 -name "lib${lib}.a" | grep -q . && s="ok"
            find "$P/shared/lib" -maxdepth 1 -name "lib${lib}.so" | grep -q . && h="ok"
            [ "$s" = ok ] || { echo "::warning::static 缺 lib${lib}.a"; miss="$miss ${lib}(static)"; }
            [ "$h" = ok ] || { echo "::warning::shared 缺 lib${lib}.so"; miss="$miss ${lib}(shared)"; }
          done
          [ -z "$miss" ] && echo "✅ 全部库动静态都齐全" || echo "⚠️ 缺：$miss"

          echo "===== 文件 ↔ SONAME ====="
          find "$P/shared/lib" -maxdepth 1 -name '*.so*' 2>/dev/null | sort |
            while IFS= read -r f; do
              sn=$(readelf -d "$f" 2>/dev/null | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')
              printf '%-36s %s\n' "$(basename "$f")" "${sn:-<none>}"
            done

          rm -rf "$P/_stray"
          exit 0

      - name: Pack prefix (single tarball)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf "prefix-arm64-v8a-api${API_LEVEL}.tar.xz" prefix
          ls -lh prefix-arm64-v8a-api${API_LEVEL}.tar.xz

      - name: Upload merged prefix
        uses: actions/upload-artifact@v4
        with:
          name: prefix-merged
          path: ${{ github.workspace }}/prefix
          retention-days: 1

      - name: Upload prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: prefix-tarball
          path: ${{ github.workspace }}/prefix-arm64-v8a-api*.tar.xz
          retention-days: 7

  # =====================================================================
  # Job 3：发布（tag / 定时）
  # =====================================================================
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    steps:
      - name: Download prefix tarball
        uses: actions/download-artifact@v4
        with:
          name: prefix-tarball
          path: artifacts

      - name: Checksums
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          cd artifacts
          ls -lh
          sha256sum *.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'libs-weekly-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'External libs (arm64-v8a) — weekly' }}
          body: |
            ## Android arm64-v8a 外部库（静态 + 动态）

            - **Build Date**: ${{ env.BUILD_DATE }}
            - **NDK**: r30 / API ${{ env.API_LEVEL }}
            - **Trigger**: ${{ github.event_name }}

            ```
            prefix/
              static/    lib/*.a            include/   lib/pkgconfig/*.pc
              shared/    lib/*.so, *.so.*   include/   lib/pkgconfig/*.pc
            ```

            ```sh
            tar xf prefix-arm64-v8a-api*.tar.xz
            export PKG_CONFIG_PATH=$PWD/prefix/shared/lib/pkgconfig
            pkg-config --libs --cflags libass freetype2 harfbuzz fribidi
            ```
          files: |
            artifacts/*.tar.xz
            artifacts/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
