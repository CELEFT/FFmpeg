name: Build FFmpeg 9.0.2 for Android (arm64-v8a)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

env:
  FFMPEG_VERSION: "9.0.2"
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"
  LIBS_CACHE_VERSION: "v6"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =====================================================================
# Job 1：每个库内部循环构建 static / shared 两套 prefix
# =====================================================================
jobs:
  build-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x264
            build: |
              [ -d x264 ] || git clone --depth 1 https://code.videolan.org/videolan/x264.git x264
              cd x264
              make distclean >/dev/null 2>&1 || true
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --cross-prefix="$TOOLCHAIN/bin/llvm-" \
                $LTOPT --enable-pic --disable-cli
              make -j"$(nproc)"
              make install

          - name: x265
            build: |
              [ -d x265_git ] || git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git x265_git
              cd x265_git
              sed -i 's/list(APPEND PLATFORM_LIBS pthread)/# list(APPEND PLATFORM_LIBS pthread)/' source/CMakeLists.txt || true
              rm -rf build
              cmake -S source -B build -G "Unix Makefiles" \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DENABLE_CLI=OFF -DENABLE_ASSEMBLY=OFF \
                -DENABLE_SHARED="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              mkpc x265 "H.265/HEVC encoder" "4.1" x265

          - name: dav1d
            build: |
              [ -d dav1d ] || git clone --depth 1 https://code.videolan.org/videolan/dav1d.git dav1d
              cd dav1d
              rm -rf _build
              {
                printf '[binaries]\n'
                printf "c = '%s'\n" "$CC"
                printf "cpp = '%s'\n" "$CXX"
                printf "ar = '%s'\n" "$AR"
                printf "strip = '%s'\n" "$STRIP"
                printf "pkgconfig = 'pkg-config'\n"
                printf '\n[properties]\nneeds_exe_wrapper = true\n'
                printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
              } > android.cross
              meson setup _build --cross-file android.cross --prefix="$PREFIX" \
                --default-library="$MESON_LIB" --buildtype=release \
                -Denable_tools=false -Denable_tests=false
              ninja -C _build
              ninja -C _build install

          - name: libvpx
            build: |
              [ -d libvpx ] || git clone --depth 1 https://github.com/webmproject/libvpx.git libvpx
              cd libvpx
              make distclean >/dev/null 2>&1 || true
              find . -name "configure*" -type f -exec \
                sed -i 's/die "--enable-shared only supported on ELF, OS\/2, and Darwin for now"/echo "Skipping ELF check for Android"/g' {} +
              export CROSS="$TOOLCHAIN/bin/llvm-"
              export ASFLAGS="-D__ANDROID__"
              export LDFLAGS="-Wl,-z,max-page-size=16384"
              ./configure --prefix="$PREFIX" --target=arm64-android-gcc --libc="$SYSROOT" \
                --enable-vp8 --enable-vp9 $LTOPT \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="-fPIC"
              make -j"$(nproc)"
              make install

          # ★ 关键修复：aom 认 BUILD_SHARED_LIBS，不认 ENABLE_SHARED
          - name: libaom
            build: |
              [ -d aom ] || git clone --depth 1 https://aomedia.googlesource.com/aom aom
              cd aom
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF \
                -DCONFIG_AV1_ENCODER=1 -DCONFIG_PIC=1 \
                -DAOM_TARGET_CPU=arm64 -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              if [ ! -f "$PREFIX/lib/pkgconfig/aom.pc" ]; then
                mkpc aom "AOMedia AV1 codec" "3.8.0" aom
              fi

          - name: svt-av1
            build: |
              [ -d SVT-AV1 ] || git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git SVT-AV1
              cd SVT-AV1
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build

          - name: vvenc
            build: |
              [ -d vvenc ] || git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git vvenc
              cd vvenc
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              mkpc libvvenc "Fraunhofer VVC encoder" "1.11.0" vvenc "" "-I\${includedir}/vvenc"

          # ★ 关键修复：xeve 的库目标在 CMakeLists 里写死 SHARED，
          #   -DBUILD_SHARED_LIBS=OFF 对它无效；static 变体必须把目标改成 STATIC，
          #   否则 static prefix 会混进 libxeve.so（且根本没有 libxeve.a）。
          - name: xeve
            build: |
              [ -d xeve ] || git clone --depth 1 https://github.com/mpeg5/xeve.git xeve
              cd xeve
              if [ "$LINK" = "static" ]; then
                find . -name CMakeLists.txt -not -path './build/*' -exec \
                  sed -i -E 's/add_library\(([^)]*)[[:space:]]+SHARED/add_library(\1 STATIC/' {} +
                echo "--- add_library 目标 ---"
                grep -rn 'add_library' --include=CMakeLists.txt . | grep -v '/build/' || true
              fi
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" -DSET_PROF=MAIN \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xeve*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              if [ "$LINK" = "static" ]; then
                rm -f "$PREFIX/lib/libxeve.so"*
                test -f "$PREFIX/lib/libxeve.a" || {
                  echo "::error::libxeve.a missing（SHARED→STATIC 改写未生效）"
                  ls -l "$PREFIX/lib" ; exit 1
                }
              fi
              mkpc xeve "MPEG-5 EVC encoder" "1.0.0" xeve

          # ★ 关键修复：xevd 与 xeve 同一个毛病
          - name: xevd
            build: |
              [ -d xevd ] || git clone --depth 1 https://github.com/mpeg5/xevd.git xevd
              cd xevd
              if [ "$LINK" = "static" ]; then
                find . -name CMakeLists.txt -not -path './build/*' -exec \
                  sed -i -E 's/add_library\(([^)]*)[[:space:]]+SHARED/add_library(\1 STATIC/' {} +
                echo "--- add_library 目标 ---"
                grep -rn 'add_library' --include=CMakeLists.txt . | grep -v '/build/' || true
              fi
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xevd*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              if [ "$LINK" = "static" ]; then
                rm -f "$PREFIX/lib/libxevd.so"*
                test -f "$PREFIX/lib/libxevd.a" || {
                  echo "::error::libxevd.a missing（SHARED→STATIC 改写未生效）"
                  ls -l "$PREFIX/lib" ; exit 1
                }
              fi
              mkpc xevd "MPEG-5 EVC decoder" "1.0.0" xevd

          # ★ 关键修复：OpenSSL 的 provider 模块（lib/ossl-modules/legacy.so）
          #   是 DSO，no-shared 并不会关闭它；static 变体装完要清掉。
          - name: openssl
            build: |
              [ -d openssl ] || git clone --depth 1 https://github.com/openssl/openssl.git openssl
              cd openssl
              make clean >/dev/null 2>&1 || true
              export ANDROID_NDK_ROOT="$NDK"
              ./Configure android-arm64 -D__ANDROID_API__="$API_LEVEL" \
                --prefix="$PREFIX" --openssldir="$PREFIX/ssl" --libdir=lib \
                $OPENSSL_SHARED no-tests
              make -j"$(nproc)"
              make install_sw
              if [ "$LINK" = "static" ]; then
                rm -rf "$PREFIX/lib/ossl-modules"
              fi
              for f in "$PREFIX"/lib/pkgconfig/*.pc; do
                [ -e "$f" ] || continue
                sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
              done

          - name: fdk-aac
            build: |
              [ -d fdk-aac ] || git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git fdk-aac
              cd fdk-aac
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              CFLAGS="$EXTRA_CFLAGS -D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration" \
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-example
              make -j"$(nproc)"
              make install
              mkpc fdk-aac "Fraunhofer FDK AAC" "2.0.3" fdk-aac

          - name: lame
            build: |
              if [ ! -d lame-3.100 ]; then
                wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
                tar xf lame-3.100.tar.gz
              fi
              cd lame-3.100
              make distclean >/dev/null 2>&1 || true
              sed -i '/lame_init_old/d' include/libmp3lame.sym
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-frontend --disable-asm
              make -j"$(nproc)"
              make install
              mkpc lame "MP3 encoding library" "3.100" mp3lame

          - name: opus
            build: |
              [ -d opus ] || git clone --depth 1 https://github.com/xiph/opus.git opus
              cd opus
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" $LTOPT --with-pic
              make -j"$(nproc)"
              make install

          - name: vorbis
            build: |
              [ -d ogg ] || git clone --depth 1 https://github.com/xiph/ogg.git ogg
              cd ogg
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" $LTOPT --with-pic
              make -j"$(nproc)" && make install
              cd ..
              [ -d vorbis ] || git clone --depth 1 https://github.com/xiph/vorbis.git vorbis
              cd vorbis
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" $LTOPT --with-pic
              make -j"$(nproc)" && make install

          # ★ lc3：按 variant 分别产出 .a / .so，.pc 名字必须同时有 liblc3 与 lc3
          - name: lc3
            build: |
              [ -d liblc3 ] || git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 liblc3
              cd liblc3
              rm -rf obj && mkdir -p obj
              for f in src/*.c; do
                $CC -O2 -fPIC -Iinclude -c "$f" -o "obj/$(basename "${f%.c}").o"
              done
              if [ "$LINK" = "static" ]; then
                $AR rcs "$PREFIX/lib/liblc3.a" obj/*.o
              else
                $CC -shared -Wl,-soname,liblc3.so -o "$PREFIX/lib/liblc3.so" obj/*.o -lm
              fi
              find include -name '*.h' -exec cp -f {} "$PREFIX/include/" \;
              mkpc liblc3 "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"
              mkpc lc3    "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"

          - name: webp
            build: |
              [ -d libwebp ] || git clone --depth 1 https://github.com/webmproject/libwebp.git libwebp
              cd libwebp
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-libwebpdemux --disable-libwebpmux
              make -j"$(nproc)"
              make install
              mkpc libwebp "WebP image codec" "1.5.0" webp

          # ★ 文本渲染链：FreeType → FriBidi → HarfBuzz → libass
          #   与 test.yml 的 build_stack 完全一致，不掺杂 fontconfig / expat
          - name: text-stack
            build: |
              set -o errexit

              # ===== 变量与 test.yml 的 build_stack 对齐 =====
              if [ "$LINK" = "static" ]; then
                CFLAGS_EXTRA="-O2 -fPIC"
              else
                CFLAGS_EXTRA="-O2"
              fi

              BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"

              # shared 时硬编码 rpath "."，从进程当前目录查找依赖
              # 注意：不能写成 -Wl,-rpath,'.'，单引号在变量展开后是字面字符，会污染 RUNPATH
              BASE_LDFLAGS="-L$PREFIX/lib"
              if [ "$LINK" = "shared" ]; then
                BASE_LDFLAGS="$BASE_LDFLAGS -Wl,-rpath,."
              fi

              # ================= 1) FreeType (Autotools) =================
              echo "### FreeType ($LINK)"
              [ -d freetype ] || git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git freetype
              (
                cd freetype
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                ./configure \
                  --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic \
                  --without-zlib --without-png --without-bzip2 --without-harfbuzz \
                  CFLAGS="$CFLAGS_EXTRA"
                make -j"$(nproc)"
                make install
              )

              # ================= 2) FriBidi (Meson) =================
              echo "### FriBidi ($LINK)"
              [ -d fribidi ] || git clone --depth 1 https://github.com/fribidi/fribidi.git fribidi
              (
                cd fribidi
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > fribidi.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file fribidi.cross \
                  --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" \
                  --buildtype=release \
                  -Ddocs=false \
                  -Ddeprecated=false \
                  -Db_staticpic=true
                ninja -C _build
                ninja -C _build install
              )
              if [ "$LINK" = "shared" ]; then
                test -e "$PREFIX/lib/libfribidi.so" || { echo "::error::libfribidi.so missing"; exit 1; }
              else
                test -f "$PREFIX/lib/libfribidi.a" || { echo "::error::libfribidi.a missing"; exit 1; }
              fi

              # ================= 3) HarfBuzz (Meson) =================
              echo "### HarfBuzz ($LINK)"
              [ -d harfbuzz ] || git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git harfbuzz
              (
                cd harfbuzz
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[properties]\nneeds_exe_wrapper = true\n'
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > android.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file android.cross \
                  --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" \
                  --buildtype=release \
                  -Db_staticpic=true \
                  -Dfreetype=enabled \
                  -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
                  -Dicu=disabled -Dgraphite2=disabled \
                  -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
                ninja -C _build
                ninja -C _build install
              )

              # ================= 4) 头文件归一化 =================
              # 与 test.yml 等价，唯一差别：软链目标写成相对路径（绝对路径打进 prefix tarball 会悬空）
              for sub in fribidi harfbuzz; do
                [ -d "$PREFIX/include/$sub" ] || continue
                for h in "$PREFIX/include/$sub"/*.h; do
                  [ -e "$h" ] || continue
                  ln -sf "$sub/$(basename "$h")" "$PREFIX/include/$(basename "$h")"
                done
              done
              if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
                ln -sf "freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
              fi

              # ================= 5) libass (Autotools) =================
              #    用 BASE_LDFLAGS（shared 时已含 -Wl,-rpath,.）
              echo "### libass ($LINK)"
              [ -d libass ] || git clone --depth 1 https://github.com/libass/libass.git libass
              (
                cd libass
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                ./configure \
                  --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic \
                  --disable-fontconfig \
                  --disable-require-system-font-provider \
                  CFLAGS="$CFLAGS_EXTRA" \
                  CPPFLAGS="$BASE_CPPFLAGS" \
                  LDFLAGS="$BASE_LDFLAGS"
                make -j"$(nproc)"
                make install
              )

              # ================= 6) 文本链自检 =================
              if [ "$LINK" = "static" ]; then
                test -s "$PREFIX/lib/libass.a" || { echo "::error::libass.a missing"; exit 1; }
                for l in freetype fribidi harfbuzz ass; do
                  test -f "$PREFIX/lib/lib${l}.a" || { echo "::error::缺 lib${l}.a"; exit 1; }
                done
                if find "$PREFIX/lib" -name '*.so*' | grep -q .; then
                  echo "::error::static prefix 出现 .so"; find "$PREFIX/lib" -name '*.so*'; exit 1
                fi
                echo "✅ text-stack [static] ok"
              else
                test -e "$PREFIX/lib/libass.so" || { echo "::error::libass.so missing"; exit 1; }
                echo "--- libass.so SONAME ---"
                readelf -d "$PREFIX/lib/libass.so" | sed -n 's/.*SONAME.*\[\(.*\)\].*/  \1/p'
                echo "--- libass.so NEEDED ---"
                readelf -d "$PREFIX/lib/libass.so" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/  \1/p'
                echo "--- libass.so RUNPATH ---"
                readelf -d "$PREFIX/lib/libass.so" | grep -E 'RUNPATH|RPATH' || echo "  (none)"
                if readelf -d "$PREFIX/lib/libass.so" | grep -qE '\[\.\]'; then
                  echo "✅ RUNPATH 已含 [.]"
                else
                  echo "::error::libass.so RUNPATH 未写入 [.]"
                  exit 1
                fi
                echo "--- prefix/lib 文件 ↔ SONAME ---"
                for f in "$PREFIX/lib"/*.so*; do
                  [ -e "$f" ] || continue
                  printf '%-34s %s\n' "$(basename "$f")" \
                    "$(readelf -d "$f" | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')"
                done
                echo "✅ text-stack [shared] ok"
              fi

              # 说明：字体枚举交给 FFmpeg 的 subtitles/ass 滤镜 + fontsdir= 参数，
              #      不再构建 fontconfig / expat（Android 上没有 fonts.conf，fontconfig 无实际收益）

    steps:
      - uses: actions/checkout@v4

      - name: Restore prefixes cache
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/prefixes
          key: ${{ runner.os }}-prefixes-${{ env.LIBS_CACHE_VERSION }}

      - name: Install host dependencies
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip gperf gettext \
            python3-pip xz-utils

      - name: Upgrade meson
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --user --break-system-packages -U "meson>=1.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Cache NDK
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK permissions (cache hit)
        if: steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-prefix.outputs.cache-hit != 'true' && steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "PREFIX_STATIC=${{ github.workspace }}/prefixes/static"
            echo "PREFIX_SHARED=${{ github.workspace }}/prefixes/shared"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Install mkpc helper
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'mkpc() {'
            printf '%s\n' '  local name="$1" desc="$2" ver="$3" lib="$4"'
            printf '%s\n' '  local priv="${5:-}"'
            printf '%s\n' '  local cflags="${6:-}"'
            printf '%s\n' '  if [ -z "$priv" ]; then'
            printf '%s\n' '    if [ "$LINK" = "static" ]; then priv="-lc++_static -lm"; else priv="-lm"; fi'
            printf '%s\n' '  fi'
            printf '%s\n' '  mkdir -p "$PREFIX/lib/pkgconfig"'
            printf '%s\n' '  local out="$PREFIX/lib/pkgconfig/$name.pc"'
            printf '%s\n' '  {'
            printf '%s\n' '    echo "prefix=$PREFIX"'
            printf '%s\n' '    echo "exec_prefix=\${prefix}"'
            printf '%s\n' '    echo "libdir=\${exec_prefix}/lib"'
            printf '%s\n' '    echo "includedir=\${prefix}/include"'
            printf '%s\n' '    echo'
            printf '%s\n' '    echo "Name: $name"'
            printf '%s\n' '    echo "Description: $desc"'
            printf '%s\n' '    echo "Version: $ver"'
            printf '%s\n' '    echo "Libs: -L\${libdir} -l$lib"'
            printf '%s\n' '    echo "Libs.private: $priv"'
            printf '%s\n' '    echo "Cflags: -I\${includedir} $cflags"'
            printf '%s\n' '  } > "$out"'
            printf '%s\n' '  echo "[mkpc] $out"'
            printf '%s\n' '}'
            printf '%s\n' 'mkpc "$@"'
          } > "$HOME/.local/bin/mkpc"
          chmod +x "$HOME/.local/bin/mkpc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf /tmp/mkpc_selftest && mkdir -p /tmp/mkpc_selftest
          PREFIX=/tmp/mkpc_selftest LINK=shared "$HOME/.local/bin/mkpc" selftest "self test" 0 selftestlib
          test -f /tmp/mkpc_selftest/lib/pkgconfig/selftest.pc || { echo "::error::mkpc helper broken"; exit 1; }
          cat /tmp/mkpc_selftest/lib/pkgconfig/selftest.pc

      - name: Build ${{ matrix.name }} (static + shared)
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/lib_build.sh <<'__LIB_EOF__'
          ${{ matrix.build }}
          __LIB_EOF__
          # 不用 `cat | head`，避免 SIGPIPE 触发 pipefail
          sed -n '1,5p' /tmp/lib_build.sh
          bash -n /tmp/lib_build.sh || { echo "::error::拼装后的构建脚本有语法错误"; exit 1; }

          run_variant() {
            local link="$1" prefix="$2"
            echo "::group::=== ${{ matrix.name }} [$link] ==="
            export LINK="$link"
            export PREFIX="$prefix"
            export EXTRA_CFLAGS="-O2 -fPIC"
            if [ "$link" = "static" ]; then
              export LTOPT="--enable-static --disable-shared"
              export MESON_LIB="static"
              export CMAKE_SHARED_LIBS="OFF"
              export OPENSSL_SHARED="no-shared"
            else
              export LTOPT="--disable-static --enable-shared"
              export MESON_LIB="shared"
              export CMAKE_SHARED_LIBS="ON"
              export OPENSSL_SHARED="shared"
            fi
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1
            mkdir -p "$prefix/lib/pkgconfig" "$prefix/include"
            bash /tmp/lib_build.sh
            echo "::endgroup::"
          }

          run_variant static "$PREFIX_STATIC"
          run_variant shared "$PREFIX_SHARED"

      - name: Upload ${{ matrix.name }} prefixes
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/prefixes/static
            ${{ github.workspace }}/prefixes/shared
          retention-days: 1

  # =====================================================================
  # Job 2：合并两个 prefix，分别做 .a / .so 校验
  # =====================================================================
  combine-prefix:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Restore prefixes cache
        id: cache-prefix
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/prefixes
          key: ${{ runner.os }}-prefixes-${{ env.LIBS_CACHE_VERSION }}

      - name: Download per-lib prefixes
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: ${{ github.workspace }}/prefixes
          merge-multiple: true

      - name: Verify static prefix (.a only)
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefixes/static"
          echo "a=$(find "$P/lib" -name '*.a' | wc -l)  so=$(find "$P/lib" -name '*.so*' | wc -l)  pc=$(find "$P/lib/pkgconfig" -name '*.pc' | wc -l)"
          if find "$P/lib" -name '*.so*' | grep -q .; then
            echo "::error::static prefix 里出现 .so，来源已污染"
            find "$P/lib" -name '*.so*'
            exit 1
          fi
          fail=0
          for lib in x264 x265 dav1d vpx aom SvtAv1Enc vvenc xeve xevd ssl crypto \
                     fdk-aac mp3lame opus vorbis lc3 webp \
                     freetype fribidi harfbuzz ass; do
            if [ ! -f "$P/lib/lib${lib}.a" ]; then
              echo "::warning::缺 lib${lib}.a"
              fail=1
            fi
          done
          for m in x265 aom vvenc xeve xevd liblc3 lc3 libwebp fdk-aac lame; do
            [ -f "$P/lib/pkgconfig/$m.pc" ] || echo "::warning::缺 $m.pc"
          done
          [ "$fail" -eq 0 ] && echo "✅ static prefix 完整"
          exit "$fail"

      - name: Verify shared prefix (.so + NEEDED closure)
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefixes/shared"
          L="$P/lib"
          echo "so=$(find "$L" -name '*.so*' | wc -l)  a=$(find "$L" -name '*.a' | wc -l)  pc=$(find "$L/pkgconfig" -name '*.pc' | wc -l)"
          if find "$L" -name '*.a' | grep -q .; then
            echo "::error::shared prefix 里出现 .a"
            find "$L" -name '*.a'
            exit 1
          fi

          echo "===== 文件 ↔ SONAME ====="
          declare -A SN=()
          for f in "$L"/*.so*; do
            [ -e "$f" ] || continue
            sn=$(readelf -d "$f" 2>/dev/null | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')
            printf '%-36s %s\n' "$(basename "$f")" "${sn:-<none>}"
            [ -n "$sn" ] && SN["$sn"]="$f"
          done

          SYS="libc.so libm.so libdl.so libz.so liblog.so libandroid.so libmediandk.so \
          libcamera2ndk.so libEGL.so libGLESv2.so libvulkan.so libnativewindow.so libsync.so libjnigraphics.so"
          is_sys() { for s in $SYS; do [ "$1" = "$s" ] && return 0; done; return 1; }

          echo "===== 闭包检查 ====="
          fail=0
          for f in "$L"/*.so*; do
            [ -f "$f" ] || continue
            for n in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p'); do
              is_sys "$n" && continue
              if [ "$n" = "libc++_shared.so" ]; then
                echo "  [ndk] $(basename "$f") -> $n"
                continue
              fi
              if [ ! -e "$L/$n" ] && [ -z "${SN[$n]:-}" ]; then
                echo "::error::$(basename "$f") 需要 $n，prefix/lib 内找不到"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "✅ shared prefix 闭包完整"
          exit "$fail"

      - name: Save prefixes cache
        if: steps.cache-prefix.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/prefixes
          key: ${{ runner.os }}-prefixes-${{ env.LIBS_CACHE_VERSION }}

      - name: Pack prefix tarballs
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/prefixes"
          tar -I 'xz -9e -T0' -cf ../prefix-static-arm64-v8a.tar.xz static
          tar -I 'xz -9e -T0' -cf ../prefix-shared-arm64-v8a.tar.xz shared
          ls -lh ../prefix-*.tar.xz

      - name: Upload merged prefixes
        uses: actions/upload-artifact@v4
        with:
          name: prefixes-merged
          path: ${{ github.workspace }}/prefixes
          retention-days: 1

      - name: Upload prefix tarballs
        uses: actions/upload-artifact@v4
        with:
          name: prefix-tarballs
          path: |
            ${{ github.workspace }}/prefix-static-arm64-v8a.tar.xz
            ${{ github.workspace }}/prefix-shared-arm64-v8a.tar.xz
          retention-days: 1

  # =====================================================================
  # Job 3：FFmpeg shared（用 shared prefix，带 ./lib + wrapper + 闭包）
  # =====================================================================
  build-shared:
    needs: combine-prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK perms
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download merged prefixes
        uses: actions/download-artifact@v4
        with:
          name: prefixes-merged
          path: ${{ github.workspace }}/prefixes

      - name: Set env
        run: |
          T="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$T"
            echo "SYSROOT=$T/sysroot"
            echo "SYS_LIB=$T/sysroot/usr/lib/${ANDROID_TRIPLE}"
            echo "PREFIX=${{ github.workspace }}/prefixes/shared"
            echo "OUTPUT=${{ github.workspace }}/output"
            echo "CC=$T/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$T/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$T/bin/llvm-ar"
            echo "RANLIB=$T/bin/llvm-ranlib"
            echo "STRIP=$T/bin/llvm-strip"
            echo "PKG_CONFIG_PATH=${{ github.workspace }}/prefixes/shared/lib/pkgconfig"
            echo "PKG_CONFIG_LIBDIR=${{ github.workspace }}/prefixes/shared/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Normalize .pc prefix
        run: |
          for f in "$PREFIX/lib/pkgconfig"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
          done

      - name: Download FFmpeg source
        run: |
          wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure FFmpeg (shared)
        working-directory: ffmpeg
        run: |
          set -euo pipefail
          if ! ./configure \
            --prefix="$OUTPUT" \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --pkg-config=pkg-config --pkg-config-flags="" \
            --enable-shared --disable-static --enable-pic \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath-link,$SYS_LIB -Wl,-rpath,./lib" \
            --extra-libs="-lc++_shared -lm -lz" ; then
            echo "::group::configure failed"
            grep -n -i -E "ERROR|error:|undefined reference|cannot find|not found" ffbuild/config.log | tail -n 120 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Build & install FFmpeg (shared)
        working-directory: ffmpeg
        run: make -j"$(nproc)" && make install

      - name: Assemble output (shared)
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$OUTPUT/lib"
          [ -d "$OUTPUT/bin" ] && { cp -a "$OUTPUT/bin/." "$OUTPUT/"; rm -rf "$OUTPUT/bin"; }

          for f in "$PREFIX"/lib/*.so*; do
            [ -e "$f" ] || continue
            cp -aLf "$f" "$OUTPUT/lib/$(basename "$f")"
          done
          cp -aLf "$SYS_LIB/libc++_shared.so" "$OUTPUT/lib/" 2>/dev/null || true

          SYS="libc.so libm.so libdl.so libz.so liblog.so libandroid.so libmediandk.so \
          libcamera2ndk.so libEGL.so libGLESv2.so libvulkan.so libnativewindow.so libsync.so libjnigraphics.so"
          is_sys() { for s in $SYS; do [ "$1" = "$s" ] && return 0; done; return 1; }
          provider() {
            local want="$1" d f sn
            for d in "$PREFIX/lib" "$SYS_LIB" "$OUTPUT/lib"; do
              [ -d "$d" ] || continue
              for f in "$d"/*.so*; do
                [ -e "$f" ] || continue
                sn=$(readelf -d "$f" 2>/dev/null | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p')
                [ -n "$sn" ] || sn=$(basename "$f")
                [ "$sn" = "$want" ] && { echo "$f"; return 0; }
              done
            done
            return 1
          }

          for round in 1 2 3; do
            fixed=0
            for f in "$OUTPUT/ffmpeg" "$OUTPUT/ffprobe" "$OUTPUT"/lib/*.so*; do
              [ -f "$f" ] || continue
              for n in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p'); do
                is_sys "$n" && continue
                [ -e "$OUTPUT/lib/$n" ] && continue
                if p=$(provider "$n"); then
                  cp -aLf "$p" "$OUTPUT/lib/$n"
                  echo "🔧 补别名 $n <- $p"
                  fixed=1
                else
                  echo "::error::无法定位 $n（$(basename "$f") 依赖）"
                fi
              done
            done
            [ "$fixed" -eq 0 ] && break
          done

          for bin in ffmpeg ffprobe; do
            {
              printf '%s\n' '#!/system/bin/sh'
              printf '%s\n' 'DIR=$(cd "$(dirname "$0")" 2>/dev/null && pwd)'
              printf '%s\n' '[ -n "$DIR" ] || DIR=.'
              printf '%s\n' 'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"'
              printf '%s\n' "exec \"\$DIR/${bin}\" \"\$@\""
            } > "$OUTPUT/${bin}.sh"
            chmod +x "$OUTPUT/${bin}.sh"
          done

          {
            echo "FFmpeg Android (shared) — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "FFmpeg: ${FFMPEG_VERSION}  NDK r30  API ${API_LEVEL}"
            echo "== RUNPATH =="
            readelf -d "$OUTPUT/ffmpeg" | grep -E 'RUNPATH|RPATH' || echo "(none)"
            echo "== NEEDED =="
            readelf -d "$OUTPUT/ffmpeg" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/  \1/p'
            echo "== bundled libs =="
            ls -1 "$OUTPUT/lib"
          } > "$OUTPUT/BUILD_INFO.txt"

          ls -la "$OUTPUT/lib" | head -60

      - name: Verify shared bundle
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          SYS="libc.so libm.so libdl.so libz.so liblog.so libandroid.so libmediandk.so \
          libcamera2ndk.so libEGL.so libGLESv2.so libvulkan.so libnativewindow.so libsync.so libjnigraphics.so"
          is_sys() { for s in $SYS; do [ "$1" = "$s" ] && return 0; done; return 1; }

          readelf -d output/ffmpeg | grep -E 'RUNPATH|RPATH' || true
          readelf -d output/ffmpeg | grep -q './lib' && echo "✅ RUNPATH 含 ./lib" || { echo "::error::未写入 ./lib"; fail=1; }

          for f in output/ffmpeg output/ffprobe output/lib/*.so*; do
            [ -f "$f" ] || continue
            for n in $(readelf -d "$f" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p'); do
              is_sys "$n" && continue
              [ -e "output/lib/$n" ] || { echo "::error::$(basename "$f") 缺 $n"; fail=1; }
            done
          done

          for n in libfreetype.so libfribidi.so libharfbuzz.so libc++_shared.so; do
            [ -e "output/lib/$n" ] && echo "  [ok] $n" || { echo "::warning::缺 $n"; fail=1; }
          done

          echo "=== libass.so RUNPATH ==="
          readelf -d output/lib/libass.so 2>/dev/null | grep -E 'RUNPATH|RPATH' || true

          echo "=== ldd（带 LD_LIBRARY_PATH）==="
          LD_LIBRARY_PATH="$PWD/output/lib" ldd output/lib/libass.so 2>&1 | tee /tmp/ldd.out || true
          grep -q "not found" /tmp/ldd.out && { echo "::error::仍有 not found"; fail=1; }

          [ "$fail" -eq 0 ] && echo "✅ shared 包自洽"
          exit "$fail"

      - name: Package (shared)
        run: |
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-shared-arm64-v8a.tar.xz output
          ls -lh ffmpeg-shared-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-shared
          path: ${{ github.workspace }}/ffmpeg-shared-arm64-v8a.tar.xz
          retention-days: 1

  # =====================================================================
  # Job 4：FFmpeg static（用 static prefix，里面没有 .so，无需隐藏）
  # =====================================================================
  build-static:
    needs: combine-prefix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK perms
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download merged prefixes
        uses: actions/download-artifact@v4
        with:
          name: prefixes-merged
          path: ${{ github.workspace }}/prefixes

      - name: Set env
        run: |
          T="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$T"
            echo "SYSROOT=$T/sysroot"
            echo "PREFIX=${{ github.workspace }}/prefixes/static"
            echo "OUTPUT=${{ github.workspace }}/output"
            echo "CC=$T/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$T/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$T/bin/llvm-ar"
            echo "RANLIB=$T/bin/llvm-ranlib"
            echo "STRIP=$T/bin/llvm-strip"
            echo "PKG_CONFIG_PATH=${{ github.workspace }}/prefixes/static/lib/pkgconfig"
            echo "PKG_CONFIG_LIBDIR=${{ github.workspace }}/prefixes/static/lib/pkgconfig"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
          } >> "$GITHUB_ENV"
          echo "$T/bin" >> "$GITHUB_PATH"

      - name: Normalize .pc prefix
        run: |
          for f in "$PREFIX/lib/pkgconfig"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
          done

      - name: Download FFmpeg source
        run: |
          wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure FFmpeg (static)
        working-directory: ffmpeg
        run: |
          set -euo pipefail
          if ! ./configure \
            --prefix="$OUTPUT" \
            --enable-cross-compile --target-os=android \
            --arch=aarch64 --cpu=armv8-a \
            --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --disable-shared --enable-static --enable-pic \
            --pkg-config=pkg-config --pkg-config-flags="--static" \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 \
            --enable-libass --enable-libfreetype --enable-libfribidi \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lc++_static -lm -lz -ldl" ; then
            echo "::group::configure failed"
            grep -n -i -E "ERROR|error:|undefined reference|cannot find|not found" ffbuild/config.log | tail -n 120 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Build static binaries
        working-directory: ffmpeg
        run: |
          make -j"$(nproc)" ffmpeg ffprobe
          mkdir -p "$OUTPUT"
          cp ffmpeg ffprobe "$OUTPUT/"
          "$STRIP" "$OUTPUT/ffmpeg" "$OUTPUT/ffprobe"

      - name: Verify static
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          SYS="libc.so libm.so libdl.so libz.so liblog.so libandroid.so libmediandk.so \
          libcamera2ndk.so libEGL.so libGLESv2.so libvulkan.so libnativewindow.so libsync.so libjnigraphics.so"
          is_sys() { for s in $SYS; do [ "$1" = "$s" ] && return 0; done; return 1; }
          [ -d output/lib ] && { echo "::error::静态产物不应含 lib/"; fail=1; }
          for f in output/ffmpeg output/ffprobe; do
            file "$f"
            for n in $(readelf -d "$f" | sed -n 's/.*NEEDED.*\[\(.*\)\].*/\1/p'); do
              is_sys "$n" || { echo "::error::$(basename "$f") 依赖非系统库 $n"; fail=1; }
            done
          done
          {
            echo "FFmpeg Android (static) — $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "FFmpeg: ${FFMPEG_VERSION}  NDK r30  API ${API_LEVEL}"
            echo "== NEEDED =="
            readelf -d output/ffmpeg | sed -n 's/.*NEEDED.*\[\(.*\)\].*/  \1/p'
          } > output/BUILD_INFO.txt
          [ "$fail" -eq 0 ] && echo "✅ static 仅依赖 Android 系统库"
          exit "$fail"

      - name: Package (static)
        run: |
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-static-arm64-v8a.tar.xz output
          ls -lh ffmpeg-static-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ${{ github.workspace }}/ffmpeg-static-arm64-v8a.tar.xz
          retention-days: 1

  # =====================================================================
  # Job 5：发布
  # =====================================================================
  release:
    needs: [build-shared, build-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    steps:
      - name: Download ffmpeg artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Download prefix tarballs
        uses: actions/download-artifact@v4
        with:
          name: prefix-tarballs
          path: artifacts

      - name: Checksums
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_ENV"
          cd artifacts
          ls -lh
          sha256sum *.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'weekly-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Weekly Latest (arm64-v8a)' }}
          body: |
            ## FFmpeg ${{ env.FFMPEG_VERSION }} for Android arm64-v8a

            - **Build Date**: ${{ env.BUILD_DATE }}
            - **NDK**: r30 / API 36
            - **Trigger**: ${{ github.event_name }}

            文件 | 说明 |
            ---|---|
            `ffmpeg-shared-arm64-v8a.tar.xz` | `output/{ffmpeg,ffprobe,ffmpeg.sh,ffprobe.sh,lib/}`，RUNPATH=`./lib`，全部第三方 `.so` 已打齐 |
            `ffmpeg-static-arm64-v8a.tar.xz` | `output/{ffmpeg,ffprobe}`，仅依赖 Android 系统库 |
            `prefix-shared-arm64-v8a.tar.xz` | 纯动态外部库（`.so` + `.pc` + `include`） |
            `prefix-static-arm64-v8a.tar.xz` | 纯静态外部库（`.a` + `.pc` + `include`） |

            ```sh
            tar xf ffmpeg-shared-arm64-v8a.tar.xz
            cd output && ./ffmpeg.sh -version
            # 等价：LD_LIBRARY_PATH="$PWD/lib" ./ffmpeg -version
            ```

            字幕烧录请用 `fontsdir` 显式指定字体目录（本构建不含 fontconfig）：

            ```sh
            ./ffmpeg.sh -i in.mp4 -vf "subtitles=sub.srt:fontsdir=/data/local/tmp/fonts" -c:a copy out.mp4
            ```
          files: |
            artifacts/*.tar.xz
            artifacts/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true