name: Build external libs & FFmpeg for Android (arm64-v8a)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 3'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"
  PROXY_URL: ${{ secrets.PROXY_URL }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x264
            libs: "x264"
            build: |
              [ -d x264 ] || git clone --depth 1 https://code.videolan.org/videolan/x264.git x264
              cd x264
              make distclean >/dev/null 2>&1 || true
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --cross-prefix="$TOOLCHAIN/bin/llvm-" \
                $LTOPT --enable-pic --disable-cli
              make -j"$(nproc)"
              make install
              mkpc x264 "H.264/AVC encoder" "164" x264 "-lm -ldl -lpthread"

          - name: x265
            libs: "x265"
            build: |
              [ -d x265_git ] || git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git x265_git
              cd x265_git
              sed -i 's/list(APPEND PLATFORM_LIBS pthread)/# list(APPEND PLATFORM_LIBS pthread)/' source/CMakeLists.txt || true
              rm -rf build
              cmake -S source -B build -G "Unix Makefiles" \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DENABLE_CLI=OFF -DENABLE_ASSEMBLY=OFF \
                -DENABLE_SHARED="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              if [ "$LINK" = "shared" ]; then
                find build -name 'libx265*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
                if [ ! -e "$PREFIX/lib/libx265.so" ] && [ -f "$PREFIX/lib/libx265.a" ]; then
                  $CXX -shared -Wl,-soname,libx265.so \
                    -Wl,--enable-new-dtags,-rpath,'$ORIGIN' \
                    -o "$PREFIX/lib/libx265.so" \
                    -Wl,--whole-archive "$PREFIX/lib/libx265.a" -Wl,--no-whole-archive \
                    -lc++_static -lm || echo "::warning::x265: .so 合成失败"
                fi
              fi
              mkpc x265 "H.265/HEVC encoder" "4.1" x265

          - name: dav1d
            libs: "dav1d"
            build: |
              set -euo pipefail
              if [ -n "${PROXY_URL:-}" ]; then
                export HTTP_PROXY="$PROXY_URL" HTTPS_PROXY="$PROXY_URL"
                echo "已启用代理：$PROXY_URL"
              fi
              if ! git -C dav1d rev-parse --verify HEAD >/dev/null 2>&1; then
                rm -rf dav1d
                cloned=""
                for url in \
                    https://code.videolan.org/videolan/dav1d.git \
                    https://github.com/videolan/dav1d.git; do
                  for i in 1 2 3; do
                    echo "[$(date +%T)] clone dav1d（第 $i/3 次）：$url"
                    if timeout 300 git clone --depth 1 "$url" dav1d 2>/tmp/clone.err; then
                      cloned=1; break
                    fi
                    echo "  失败，末 5 行 stderr："
                    tail -5 /tmp/clone.err 2>/dev/null | sed 's/^/    /' || true
                    rm -rf dav1d; sleep 3
                  done
                  [ -n "$cloned" ] && break
                done
                if [ -z "$cloned" ]; then
                  echo "::error::dav1d 源码拉取失败：官方源与 GitHub 镜像均不可达"
                  exit 1
                fi
                if ! git -C dav1d rev-parse --verify HEAD >/dev/null 2>&1; then
                  echo "::error::dav1d 克隆后仓库校验失败"
                  exit 1
                fi
              else
                echo "dav1d 源码已存在（git 校验通过），跳过 clone"
              fi
              cd dav1d
              rm -rf _build
              {
                printf '[binaries]\n'
                printf "c = '%s'\n" "$CC"
                printf "cpp = '%s'\n" "$CXX"
                printf "ar = '%s'\n" "$AR"
                printf "strip = '%s'\n" "$STRIP"
                printf "pkgconfig = 'pkg-config'\n"
                printf '\n[properties]\nneeds_exe_wrapper = true\n'
                printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
              } > android.cross
              meson setup _build --cross-file android.cross --prefix="$PREFIX" \
                --default-library="$MESON_LIB" --buildtype=release \
                -Denable_tools=false -Denable_tests=false
              ninja -C _build
              ninja -C _build install

          - name: libvpx
            libs: "vpx"
            build: |
              set -euo pipefail
              [ -d libvpx ] || git clone --depth 1 https://github.com/webmproject/libvpx.git libvpx
              cd libvpx
              make distclean >/dev/null 2>&1 || true
              rm -f config.mk config.log vpx_config.h vpx_config.c libs-*.mk

              python3 - <<'PY'
              import re
              from pathlib import Path
              p = Path("configure"); s = p.read_text()
              want = "linux|android|os2|solaris|darwin*|iphonesimulator*)"
              if want not in s:
                  pat = r'^(?P<ind>[ \t]*)linux\|os2\|solaris\|darwin\*\|iphonesimulator\*\)[ \t]*$'
                  m = re.search(pat, s, re.M)
                  if not m:
                      raise SystemExit("::error::configure: 找不到白名单锚点")
                  p.write_text(s[:m.start()] + m.group("ind") + want + s[m.end():])
              PY

              python3 - <<'PY'
              from pathlib import Path
              p = Path("build/make/configure.sh")
              lines = p.read_text().splitlines(keepends=True)
              n = 0
              for i, l in enumerate(lines):
                  if l.strip() == "check_add_ldflags -static":
                      lines[i] = l[:len(l) - len(l.lstrip())] + "# check_add_ldflags -static\n"
                      n += 1
              if n:
                  p.write_text("".join(lines))
              elif not any(l.strip() == "# check_add_ldflags -static" for l in lines):
                  raise SystemExit("::error::configure.sh: 找不到 check_add_ldflags -static")
              PY

              export CC CXX AR RANLIB STRIP
              export AS="$CC"
              export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,--enable-new-dtags -Wl,-rpath,'\$\$ORIGIN'"

              ./configure --prefix="$PREFIX" --force-target=arm64-android-gcc \
                --enable-vp8 --enable-vp9 $LTOPT --enable-pic \
                --disable-examples --disable-tools --disable-docs --disable-unit-tests \
                --extra-cflags="$EXTRA_CFLAGS -mno-outline-atomics --sysroot=${SYSROOT}"

              MK=$(ls libs-*-gcc.mk 2>/dev/null | head -1 || true)
              [ -n "${MK:-}" ] || { echo "::error::libvpx: 未生成 libs-*-gcc.mk"; exit 1; }

              cfg() {
                local n="$1" v f
                for f in "$MK" config.mk; do
                  [ -f "$f" ] || continue
                  v=$(sed -n "s/^${n}=//p" "$f" | head -1)
                  [ -n "${v:-}" ] && { printf '%s' "$v"; return 0; }
                done
                return 1
              }
              require() {
                local n="$1" want="$2" got
                got=$(cfg "$n") || { echo "::error::libvpx: 找不到 $n"; return 1; }
                [ "$got" = "$want" ] || { echo "::error::libvpx: $n=$got，期望 $want"; return 1; }
              }
              require CONFIG_PIC yes
              if [ "$LINK" = "shared" ]; then
                require CONFIG_SHARED yes
                grep -q 'ORIGIN' "$MK" || { echo "::error::libvpx: $MK 无 ORIGIN"; exit 1; }
              else
                require CONFIG_STATIC yes
              fi
              if grep -qE '(^|[[:space:]])-static([[:space:]]|$)' "$MK"; then
                echo "::error::libvpx: 仍含 -static"; exit 1
              fi

              make -j"$(nproc)"
              make install

              if [ "$LINK" = "shared" ]; then
                so="$PREFIX/lib/libvpx.so"
                [ -e "$so" ] || { echo "::error::libvpx: 未生成 $so"; exit 1; }
                "$READELF" -d "$so" | grep -q '\[\$ORIGIN\]' || { echo "::error::libvpx: RUNPATH 不是 \$ORIGIN"; exit 1; }
              else
                [ -e "$PREFIX/lib/libvpx.a" ] || { echo "::error::libvpx: 未生成 libvpx.a"; exit 1; }
              fi

          - name: libaom
            libs: "aom"
            build: |
              [ -d aom ] || git clone --depth 1 https://aomedia.googlesource.com/aom aom
              cd aom
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF \
                -DCONFIG_AV1_ENCODER=1 -DCONFIG_PIC=1 \
                -DAOM_TARGET_CPU=arm64 -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              [ -f "$PREFIX/lib/pkgconfig/aom.pc" ] || mkpc aom "AOMedia AV1 codec" "3.8.0" aom

          - name: svt-av1
            libs: "SvtAv1Enc"
            build: |
              [ -d SVT-AV1 ] || git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git SVT-AV1
              cd SVT-AV1
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build

          - name: vvenc
            libs: "vvenc"
            build: |
              [ -d vvenc ] || git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git vvenc
              cd vvenc
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              mkpc libvvenc "Fraunhofer VVC encoder" "1.11.0" vvenc "" "-I\${includedir}/vvenc"

          - name: xeve
            libs: "xeve"
            build: |
              [ -d xeve ] || git clone --depth 1 https://github.com/mpeg5/xeve.git xeve
              cd xeve
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" -DSET_PROF=MAIN \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              rm -rf "$PREFIX/lib/xeve"
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xeve*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              find build -name 'libxeve.a'   -exec cp -af  {} "$PREFIX/lib/" \; 2>/dev/null || true
              find build -name 'libxeve*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
              if [ "$LINK" = "shared" ] && [ ! -e "$PREFIX/lib/libxeve.so" ] && [ -f "$PREFIX/lib/libxeve.a" ]; then
                $CC -shared -Wl,-soname,libxeve.so -Wl,--enable-new-dtags,-rpath,'$ORIGIN' \
                  -o "$PREFIX/lib/libxeve.so" \
                  -Wl,--whole-archive "$PREFIX/lib/libxeve.a" -Wl,--no-whole-archive -lm \
                  || echo "::warning::xeve: .so 合成失败"
              fi
              mkpc xeve "MPEG-5 EVC encoder" "1.0.0" xeve "" "-I\${includedir}/xeve"

          - name: xevd
            libs: "xevd"
            build: |
              [ -d xevd ] || git clone --depth 1 https://github.com/mpeg5/xevd.git xevd
              cd xevd
              rm -rf build
              cmake -S . -B build \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build || true
              rm -rf "$PREFIX/lib/xevd"
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              [ -d inc ] && cp -f inc/*.h "$PREFIX/include/" 2>/dev/null || true
              find . -maxdepth 3 -name 'xevd*.h' -not -path './build/*' -exec cp -f {} "$PREFIX/include/" \;
              find build -name 'libxevd.a'   -exec cp -af  {} "$PREFIX/lib/" \; 2>/dev/null || true
              find build -name 'libxevd*.so*' -exec cp -aLf {} "$PREFIX/lib/" \; 2>/dev/null || true
              if [ "$LINK" = "shared" ] && [ ! -e "$PREFIX/lib/libxevd.so" ] && [ -f "$PREFIX/lib/libxevd.a" ]; then
                $CC -shared -Wl,-soname,libxevd.so -Wl,--enable-new-dtags,-rpath,'$ORIGIN' \
                  -o "$PREFIX/lib/libxevd.so" \
                  -Wl,--whole-archive "$PREFIX/lib/libxevd.a" -Wl,--no-whole-archive -lm \
                  || echo "::warning::xevd: .so 合成失败"
              fi
              mkpc xevd "MPEG-5 EVC decoder" "1.0.0" xevd "" "-I\${includedir}/xevd"

          - name: openssl
            libs: "ssl crypto"
            build: |
              [ -d openssl ] || git clone --depth 1 https://github.com/openssl/openssl.git openssl
              cd openssl
              make clean >/dev/null 2>&1 || true
              export ANDROID_NDK_ROOT="$NDK"
              if [ "$LINK" = "static" ]; then OSSL_MODE="no-shared"; else OSSL_MODE="shared"; fi
              ./Configure android-arm64 -D__ANDROID_API__="$API_LEVEL" \
                --prefix="$PREFIX" --openssldir="$PREFIX/ssl" --libdir=lib \
                $OSSL_MODE no-tests
              make -j"$(nproc)"
              make install_sw
              rm -rf "$PREFIX/lib/ossl-modules" "$PREFIX"/lib/engines-*

          - name: fdk-aac
            libs: "fdk-aac"
            build: |
              [ -d fdk-aac ] || git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git fdk-aac
              cd fdk-aac
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              CFLAGS="$EXTRA_CFLAGS -D_FILE_OFFSET_BITS=64 -Wno-implicit-function-declaration" \
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-example
              make -j"$(nproc)"
              make install
              mkpc fdk-aac "Fraunhofer FDK AAC" "2.0.3" fdk-aac

          # ★ lame：恢复原始 ./configure + make + make install + mkpc 流程
          - name: lame
            libs: "mp3lame"
            build: |
              if [ ! -d lame-3.100 ]; then
                wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
                tar xf lame-3.100.tar.gz
              fi
              cd lame-3.100
              make distclean >/dev/null 2>&1 || true
              sed -i '/lame_init_old/d' include/libmp3lame.sym
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-frontend --disable-asm
              make -j"$(nproc)"
              make install
              mkpc lame "MP3 encoding library" "3.100" mp3lame

          - name: opus
            libs: "opus"
            build: |
              [ -d opus ] || git clone --depth 1 https://github.com/xiph/opus.git opus
              cd opus
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                --build=x86_64-pc-linux-gnu \
                CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                CFLAGS="$EXTRA_CFLAGS" LDFLAGS="" $LTOPT --with-pic
              make -j"$(nproc)"
              make install

          - name: vorbis
            libs: "ogg vorbis vorbisenc vorbisfile"
            build: |
              v_build() {
                local dir="$1" url="$2"
                [ -d "$dir" ] || git clone --depth 1 "$url" "$dir"
                (
                  cd "$dir"
                  git clean -xdf >/dev/null 2>&1 || true
                  autoreconf -fiv >/dev/null 2>&1 || autoreconf -fiv
                  ./configure --prefix="$PREFIX" --build=x86_64-pc-linux-gnu \
                    --host="$ANDROID_TRIPLE" \
                    CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
                    CFLAGS="$EXTRA_CFLAGS" CXXFLAGS="$EXTRA_CFLAGS" LDFLAGS="" \
                    $LTOPT --with-pic
                  make -j"$(nproc)"
                  make install
                )
              }
              v_build ogg    https://github.com/xiph/ogg.git
              v_build vorbis https://github.com/xiph/vorbis.git

          - name: lc3
            libs: "lc3"
            build: |
              [ -d liblc3 ] || git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 liblc3
              cd liblc3
              rm -rf obj && mkdir -p obj
              for f in src/*.c; do
                $CC -O2 -fPIC -Iinclude -c "$f" -o "obj/$(basename "${f%.c}").o"
              done
              mkdir -p "$PREFIX/lib" "$PREFIX/include"
              if [ "$LINK" = static ]; then
                $AR rcs "$PREFIX/lib/liblc3.a" obj/*.o
              else
                $CC -shared -Wl,-soname,liblc3.so -Wl,--enable-new-dtags,-rpath,'$ORIGIN' \
                  -o "$PREFIX/lib/liblc3.so" obj/*.o -lm
              fi
              find include -name '*.h' -exec cp -f {} "$PREFIX/include/" \;
              mkpc liblc3 "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"
              mkpc lc3    "Low Complexity Communication Codec" "1.1.0" lc3 "-lm"

          - name: libsoxr
            libs: "soxr"
            build: |
              [ -d soxr ] || git clone --depth 1 https://github.com/chirlu/soxr.git soxr
              cd soxr
              rm -rf build
              cmake -S . -B build -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="$TARGET_ABI" -DANDROID_PLATFORM="android-$API_LEVEL" \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
                -DBUILD_SHARED_LIBS="$CMAKE_SHARED_LIBS" \
                -DWITH_OPENMP=OFF -DWITH_AVFFT=OFF -DWITH_LSR_BINDINGS=OFF \
                -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
              cmake --build build -j"$(nproc)"
              cmake --install build
              [ -f "$PREFIX/lib/pkgconfig/soxr.pc" ] || mkpc soxr "The SoX Resampler library" "0.1.3" soxr "-lm"

          - name: webp
            libs: "webp sharpyuv"
            build: |
              [ -d libwebp ] || git clone --depth 1 https://github.com/webmproject/libwebp.git libwebp
              cd libwebp
              make distclean >/dev/null 2>&1 || true
              [ -x configure ] || ./autogen.sh
              ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" \
                $LTOPT --with-pic --disable-libwebpdemux --disable-libwebpmux
              make -j"$(nproc)"
              make install
              mkpc libwebp "WebP image codec" "1.5.0" webp

          - name: text-stack
            libs: "freetype fribidi harfbuzz ass"
            build: |
              set -o errexit
              if [ "$LINK" = "static" ]; then CFLAGS_EXTRA="-O2 -fPIC"; else CFLAGS_EXTRA="-O2"; fi
              BASE_CPPFLAGS="-I$PREFIX/include -I$PREFIX/include/fribidi -I$PREFIX/include/harfbuzz -I$PREFIX/include/freetype2"
              BASE_LDFLAGS="-L$PREFIX/lib"
              if [ "$LINK" = "shared" ]; then
                BASE_LDFLAGS="$BASE_LDFLAGS -Wl,--enable-new-dtags,-rpath,\$ORIGIN"
              fi

              [ -d freetype ] || git clone --depth 1 https://gitlab.freedesktop.org/freetype/freetype.git freetype
              (
                cd freetype
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic --without-zlib --without-png --without-bzip2 --without-harfbuzz \
                  CFLAGS="$CFLAGS_EXTRA"
                make -j"$(nproc)"
                make install
              )

              [ -d fribidi ] || git clone --depth 1 https://github.com/fribidi/fribidi.git fribidi
              (
                cd fribidi
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > fribidi.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file fribidi.cross --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" --buildtype=release \
                  -Ddocs=false -Ddeprecated=false -Db_staticpic=true
                ninja -C _build
                ninja -C _build install
              )

              [ -d harfbuzz ] || git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git harfbuzz
              (
                cd harfbuzz
                rm -rf _build
                {
                  printf '[binaries]\n'
                  printf "c = '%s'\n" "$CC"
                  printf "cpp = '%s'\n" "$CXX"
                  printf "ar = '%s'\n" "$AR"
                  printf "strip = '%s'\n" "$STRIP"
                  printf "pkgconfig = 'pkg-config'\n"
                  printf '\n[properties]\nneeds_exe_wrapper = true\n'
                  printf '\n[host_machine]\nsystem = '"'"'android'"'"'\ncpu_family = '"'"'aarch64'"'"'\ncpu = '"'"'aarch64'"'"'\nendian = '"'"'little'"'"'\n'
                } > android.cross
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                meson setup _build --cross-file android.cross --prefix="$PREFIX" \
                  --default-library="$MESON_LIB" --buildtype=release \
                  -Db_staticpic=true -Dfreetype=enabled \
                  -Dglib=disabled -Dgobject=disabled -Dcairo=disabled \
                  -Dicu=disabled -Dgraphite2=disabled \
                  -Dtests=disabled -Ddocs=disabled -Dintrospection=disabled
                ninja -C _build
                ninja -C _build install
              )

              for sub in fribidi harfbuzz; do
                [ -d "$PREFIX/include/$sub" ] || continue
                for h in "$PREFIX/include/$sub"/*.h; do
                  [ -e "$h" ] || continue
                  ln -sf "$sub/$(basename "$h")" "$PREFIX/include/$(basename "$h")"
                done
              done
              if [ -f "$PREFIX/include/freetype2/ft2build.h" ]; then
                ln -sf "freetype2/ft2build.h" "$PREFIX/include/ft2build.h"
              fi

              [ -d libass ] || git clone --depth 1 https://github.com/libass/libass.git libass
              (
                cd libass
                make distclean >/dev/null 2>&1 || true
                ./autogen.sh
                PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig" \
                PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig" \
                ./configure --prefix="$PREFIX" --host="$ANDROID_TRIPLE" --build=x86_64-pc-linux-gnu \
                  $LTOPT --with-pic --disable-fontconfig --disable-require-system-font-provider \
                  CFLAGS="$CFLAGS_EXTRA" CPPFLAGS="$BASE_CPPFLAGS" LDFLAGS="$BASE_LDFLAGS"
                make -j"$(nproc)"
                make install
              )

              if [ "$LINK" = "shared" ]; then
                while IFS= read -r so; do
                  [ -e "$so" ] || continue
                  if command -v patchelf >/dev/null 2>&1; then
                    patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
                  fi
                done < <(find "$PREFIX/lib" -maxdepth 1 -name '*.so*' -type f)
                readelf -d "$PREFIX/lib/libass.so" 2>/dev/null | grep -q '\$ORIGIN' \
                  || { echo "::error::libass.so RUNPATH 不含 \$ORIGIN"; exit 1; }
              fi
              echo "✅ text-stack [$LINK] ok"

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip \
            gperf gettext libexpat1-dev python3-pip xz-utils patchelf

      - name: Upgrade meson
        run: |
          python3 -m pip install --user --break-system-packages -U "meson>=1.4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/meson" --version

      - name: Download and Unpack NDK
        run: |
          set -euo pipefail
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "PREFIX_STATIC=${{ github.workspace }}/prefix/static"
            echo "PREFIX_SHARED=${{ github.workspace }}/prefix/shared"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "READELF=$TOOLCHAIN/bin/llvm-readelf"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          "$CXX" /tmp/smoke.c -o /tmp/smoke.out
          "$STRIP" --version | head -1

      - name: Install mkpc helper
        run: |
          mkdir -p "$HOME/.local/bin"
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'mkpc() {'
            printf '%s\n' '  local name="$1" desc="$2" ver="$3" lib="$4"'
            printf '%s\n' '  local priv="${5:-}"'
            printf '%s\n' '  local cflags="${6:-}"'
            printf '%s\n' '  if [ -z "$priv" ]; then'
            printf '%s\n' '    if [ "$LINK" = "static" ]; then priv="-lc++_static -lm"; else priv="-lm"; fi'
            printf '%s\n' '  fi'
            printf '%s\n' '  mkdir -p "$PREFIX/lib/pkgconfig"'
            printf '%s\n' '  local out="$PREFIX/lib/pkgconfig/$name.pc"'
            printf '%s\n' '  {'
            printf '%s\n' '    echo "prefix=$PREFIX"'
            printf '%s\n' '    echo "exec_prefix=\${prefix}"'
            printf '%s\n' '    echo "libdir=\${exec_prefix}/lib"'
            printf '%s\n' '    echo "includedir=\${prefix}/include"'
            printf '%s\n' '    echo'
            printf '%s\n' '    echo "Name: $name"'
            printf '%s\n' '    echo "Description: $desc"'
            printf '%s\n' '    echo "Version: $ver"'
            printf '%s\n' '    echo "Libs: -L\${libdir} -l$lib"'
            printf '%s\n' '    echo "Libs.private: $priv"'
            printf '%s\n' '    echo "Cflags: -I\${includedir} $cflags"'
            printf '%s\n' '  } > "$out"'
            printf '%s\n' '  echo "[mkpc] $out"'
            printf '%s\n' '}'
            printf '%s\n' 'mkpc "$@"'
          } > "$HOME/.local/bin/mkpc"
          chmod +x "$HOME/.local/bin/mkpc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.name }} (static + shared)
        shell: bash
        env:
          CHECK_LIBS: ${{ matrix.libs }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set -euo pipefail
          unset LIBS LIBS_PRIVATE LDFLAGS CPPFLAGS CFLAGS CXXFLAGS LDLIBS 2>/dev/null || true

          on_exit() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "::group::失败诊断 — ${{ matrix.name }} [$LINK]"
              find "${{ github.workspace }}" -maxdepth 5 -name config.log \
                   -not -path "*/ndk/*" -print0 2>/dev/null |
                while IFS= read -r -d '' f; do
                  echo "=============== $f : 末 40 行 ==============="
                  tail -40 "$f" || true
                done
              echo "::endgroup::"
            fi
            exit $rc
          }
          trap on_exit EXIT

          cat > /tmp/lib_build.sh <<'__LIB_EOF__'
          ${{ matrix.build }}
          __LIB_EOF__
          bash -n /tmp/lib_build.sh || { echo "::error::拼装后的构建脚本有语法错误"; exit 1; }

          separate() {
            local link="$1" prefix="$2"
            [ -d "$prefix" ] || return 0
            if [ "$link" = "static" ]; then
              find "$prefix/lib" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) \
                -print -delete 2>/dev/null || true
            else
              find "$prefix/lib" -maxdepth 1 -name '*.a' -print -delete 2>/dev/null || true
            fi
          }

          run_variant() {
            local link="$1" prefix="$2"
            echo "::group::=== ${{ matrix.name }} [$link] ==="
            export LINK="$link"
            export PREFIX="$prefix"
            export EXTRA_CFLAGS="-O2 -fPIC"
            if [ "$link" = "static" ]; then
              export LTOPT="--enable-static --disable-shared"
              export MESON_LIB="static"
              export CMAKE_SHARED_LIBS="OFF"
            else
              export LTOPT="--disable-static --enable-shared"
              export MESON_LIB="shared"
              export CMAKE_SHARED_LIBS="ON"
            fi
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1
            mkdir -p "$prefix/lib/pkgconfig" "$prefix/include"
            bash /tmp/lib_build.sh
            separate "$link" "$prefix"
            echo "::endgroup::"
          }

          run_variant static "$PREFIX_STATIC"
          run_variant shared "$PREFIX_SHARED"

      - name: Upload prefix
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.name }}
          path: |
            ${{ github.workspace }}/prefix/static
            ${{ github.workspace }}/prefix/shared
          retention-days: 1

  package:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - name: Download per-lib prefixes
        uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: ${{ github.workspace }}/prefix
          merge-multiple: true

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Normalize prefix with find
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefix"
          mkdir -p "$P/static/lib/pkgconfig" "$P/static/include" \
                   "$P/shared/lib/pkgconfig" "$P/shared/include" "$P/_stray"

          find "$P/static" -type d \( -name 'ossl-modules' -o -name 'engines-*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          find "$P/static/lib" -maxdepth 1 \( -name '*.so' -o -name '*.so.*' \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do mv -f "$f" "$P/_stray/" 2>/dev/null || true; done
          find "$P/shared/lib" -maxdepth 1 -name '*.a' -print0 2>/dev/null |
            while IFS= read -r -d '' f; do mv -f "$f" "$P/_stray/" 2>/dev/null || true; done

          rel='${pcfiledir}/../..'
          for d in static shared; do
            find "$P/$d/lib/pkgconfig" -name '*.pc' -print0 2>/dev/null |
              while IFS= read -r -d '' f; do
                sed -i "s|$P/$d|$rel|g" "$f"
                sed -i -E "s#^prefix=.*#prefix=$rel#" "$f"
              done
          done

          while IFS= read -r f; do
            patchelf --set-rpath '$ORIGIN' "$f"
          done < <(find "$P/shared/lib" -maxdepth 1 -name '*.so*' -type f 2>/dev/null)

          rm -rf "$P/_stray"
          exit 0

      - name: Pack prefix (full / static / shared)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          BASE="ffmpeg-libs-arm64-v8a-api${API_LEVEL}"
          rm -f "${BASE}"-*.tar.xz
          tar -I 'xz -9e -T0' -cf "${BASE}-full.tar.xz"   prefix
          tar -I 'xz -9e -T0' -cf "${BASE}-static.tar.xz" prefix/static
          tar -I 'xz -9e -T0' -cf "${BASE}-shared.tar.xz" prefix/shared

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: prefix-tarball
          path: |
            ${{ github.workspace }}/ffmpeg-libs-arm64-v8a-api*.tar.xz
            ${{ github.workspace }}/prefix
          retention-days: 2

  ffmpeg:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download prefix
        uses: actions/download-artifact@v4
        with:
          name: prefix-tarball
          path: ${{ github.workspace }}/artifacts

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm yasm wget unzip xz-utils

      - name: Download and Unpack NDK
        run: |
          set -euo pipefail
          wget -q "${{ env.NDK_URL }}" -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "${{ github.workspace }}"
          mv "${{ github.workspace }}/android-ndk-r30"* "${{ github.workspace }}/ndk"
          rm -f /tmp/ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        run: |
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "NM=$TOOLCHAIN/bin/llvm-nm"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "READELF=$TOOLCHAIN/bin/llvm-readelf"
          } >> "$GITHUB_ENV"

      - name: Unpack prefix
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar xf artifacts/ffmpeg-libs-arm64-v8a-api${API_LEVEL}-full.tar.xz
          echo "--- lame 相关文件 ---"
          ls -l prefix/static/lib/libmp3lame* prefix/shared/lib/libmp3lame* 2>/dev/null || true
          ls -l prefix/static/lib/pkgconfig/lame.pc prefix/shared/lib/pkgconfig/lame.pc 2>/dev/null || true
          echo "--- pkg-config 现场验证（static）---"
          PKG_CONFIG_PATH="$PWD/prefix/static/lib/pkgconfig" \
          PKG_CONFIG_LIBDIR="$PWD/prefix/static/lib/pkgconfig" \
            pkg-config --libs --cflags lame 2>&1 || true

      - name: Build FFmpeg (static & shared)
        shell: bash
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PROXY_URL:-}" ]; then
            export HTTP_PROXY="$PROXY_URL" HTTPS_PROXY="$PROXY_URL"
          fi

          for LINK in static shared; do
            PREFIX="${{ github.workspace }}/prefix/$LINK"
            DIST="${{ github.workspace }}/dist/$LINK"
            BUILD="${{ github.workspace }}/build-ffmpeg-$LINK"

            if [ "$LINK" = static ]; then
              LTOPT="--enable-static --disable-shared"
            else
              LTOPT="--disable-static --enable-shared"
            fi

            export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
            export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
            export PKG_CONFIG_ALLOW_CROSS=1

            echo "::group::FFmpeg [$LINK]"
            rm -rf "$BUILD"; mkdir -p "$BUILD"
            cd "$BUILD"

            dump_cfg_log() {
              local rc=$?
              trap - ERR EXIT
              if [ "$rc" -ne 0 ] && [ -f ffbuild/config.log ]; then
                echo "::group::config.log 关键错误 — FFmpeg [$LINK]"
                tail -120 ffbuild/config.log || true
                echo "===== 错误行 ====="
                grep -nE 'error:|unable to|undefined reference|cannot find|No such file|is unable' ffbuild/config.log 2>/dev/null | tail -60 || true
                echo "::endgroup::"
              fi
              exit $rc
            }
            trap dump_cfg_log ERR EXIT

            "${{ github.workspace }}/configure" \
              --target-os=android --arch=aarch64 --enable-cross-compile \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --nm="$NM" --ranlib="$RANLIB" --strip="$STRIP" \
              --enable-pic --disable-autodetect --disable-programs --disable-doc --disable-debug \
              --enable-jni --enable-mediacodec \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-libx264 --enable-libx265 --enable-libdav1d --enable-libvpx \
              --enable-libaom --enable-libsvtav1 --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-openssl --enable-libfdk-aac --enable-libmp3lame --enable-libopus \
              --enable-libvorbis --enable-liblc3 --enable-libsoxr --enable-libwebp \
              --enable-libass --enable-libfreetype --enable-libharfbuzz --enable-libfribidi \
              $LTOPT \
              --prefix="$DIST" \
              --extra-cflags="-O2 -fPIC -I$PREFIX/include" \
              --extra-ldflags="-L$PREFIX/lib"

            make -j"$(nproc)"
            make install
            cd "${{ github.workspace }}"
            trap - ERR EXIT
            echo "::endgroup::"
          done

      - name: Verify FFmpeg shared RUNPATH / 16KB align
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/dist/shared"
          bad=0
          while IFS= read -r f; do
            al=$("$READELF" -lW "$f" 2>/dev/null | awk '/ LOAD /{print $NF}' | sort -u | tr '\n' ' ')
            rp=$("$READELF" -d "$f" 2>/dev/null | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p')
            echo "  $(basename "$f")  align=${al:-?}  rpath=${rp:-<none>}"
            case "$al" in *0x1000*) echo "::warning::$(basename "$f") 含 4KB LOAD"; bad=1 ;; esac
            [ "$rp" = '$ORIGIN' ] || { echo "::error::$(basename "$f") RUNPATH 不是 \$ORIGIN"; bad=1; }
          done < <(find "$P/lib" -maxdepth 1 -name '*.so*' -type f 2>/dev/null)
          exit $bad

      - name: Pack FFmpeg tarballs
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          BASE="ffmpeg-arm64-v8a-api${API_LEVEL}"
          tar -I 'xz -9e -T0' -cf "${BASE}-full.tar.xz"   dist
          tar -I 'xz -9e -T0' -cf "${BASE}-static.tar.xz" dist/static
          tar -I 'xz -9e -T0' -cf "${BASE}-shared.tar.xz" dist/shared
          sha256sum "${BASE}"-*.tar.xz > "${BASE}-SHA256SUMS.txt"

      - name: Upload FFmpeg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-tarball
          if-no-files-found: error
          path: |
            ${{ github.workspace }}/ffmpeg-arm64-v8a-api*.tar.xz
            ${{ github.workspace }}/ffmpeg-arm64-v8a-api*-SHA256SUMS.txt
          retention-days: 2

  release:
    needs: [package, ffmpeg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      TAG: ffmpeg-lib
    steps:
      - name: Download libs tarballs
        uses: actions/download-artifact@v4
        with:
          name: prefix-tarball
          path: artifacts/libs

      - name: Download ffmpeg tarballs
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-tarball
          path: artifacts/ffmpeg

      - name: Checksums & timestamps
        run: |
          set -euo pipefail
          cd artifacts
          {
            echo "BUILD_DATE_UTC=$(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)"
          } >> "$GITHUB_ENV"
          ( cd libs   && sha256sum *.tar.xz > SHA256SUMS.txt )
          ( cd ffmpeg && sha256sum *.tar.xz > SHA256SUMS.txt )

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          {
            echo "## Android arm64-v8a 外部库 + FFmpeg"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 构建时间 (UTC) | ${BUILD_DATE_UTC} |"
            echo "| NDK / API / ABI | r30 / ${API_LEVEL} / arm64-v8a |"
            echo "| 提交 | [\`${SHORT_SHA}\`](/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo
            echo "### FFmpeg 产物"
            for f in ffmpeg/*.tar.xz; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
            echo
            echo "### 外部库产物"
            for f in libs/*.tar.xz; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } > release-body.md

      - name: Delete existing tag/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/${TAG}" 2>/dev/null \
            && echo "已删除旧 tag" || echo "跳过"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ffmpeg-lib
          name: FFmpeg libs + external libs (arm64-v8a) — rolling
          body_path: artifacts/release-body.md
          make_latest: true
          overwrite_files: true
          files: |
            artifacts/libs/*.tar.xz
            artifacts/libs/SHA256SUMS.txt
            artifacts/ffmpeg/*.tar.xz
            artifacts/ffmpeg/SHA256SUMS.txt