name: Build FFmpeg 9.0.2 for Android (arm64-v8a)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  FFMPEG_VERSION: "9.0.2"
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  PREFIX: "${{ github.workspace }}/prefix"
  
  # 固定目标架构信息
  TARGET_ABI: "arm64-v8a"
  TARGET_ARCH: "aarch64"
  TARGET_CPU: "armv8-a"
  TARGET_TRIPLE: "aarch64-linux-android"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm pkg-config wget unzip cmake meson ninja-build git autoconf automake libtool

      - name: Download NDK
        run: |
          wget -q "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          NDK_DIR=$(find . -maxdepth 1 -type d -name "android-ndk-r30*" | head -1)
          echo "ANDROID_NDK_HOME=$(pwd)/$NDK_DIR" >> $GITHUB_ENV
          echo "TOOLCHAIN=$(pwd)/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV
          echo "SYSROOT=$(pwd)/$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/sysroot" >> $GITHUB_ENV

      - name: Set environment
        run: |
          echo "CC=$TOOLCHAIN/bin/${TARGET_TRIPLE}${API_LEVEL}-clang" >> $GITHUB_ENV
          echo "CXX=$TOOLCHAIN/bin/${TARGET_TRIPLE}${API_LEVEL}-clang++" >> $GITHUB_ENV
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> $GITHUB_ENV

      # ==================== 构建外部库 ====================
      - name: Build x264
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/x264.git && cd x264
          ./configure --prefix=$PREFIX --host=${TARGET_TRIPLE} --cross-prefix=$TOOLCHAIN/bin/llvm- --enable-static --enable-shared --enable-pic --disable-cli
          make -j$(nproc) && make install

      - name: Build x265
        run: |
          git clone --depth 1 https://bitbucket.org/multicoreware/x265_git.git && cd x265_git/build/linux
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DENABLE_SHARED=ON -DENABLE_CLI=OFF ../../source
          make -j$(nproc) && make install

      - name: Build dav1d
        run: |
          git clone --depth 1 https://code.videolan.org/videolan/dav1d.git && cd dav1d
          meson setup build --cross-file <(echo -e "[binaries]\nc='$CC'\ncpp='$CXX'\nar='$AR'\nstrip='$STRIP'\n[host_machine]\nsystem='android'\ncpu_family='${TARGET_ARCH}'\ncpu='${TARGET_CPU}'\nendian='little'") --prefix=$PREFIX --default-library=both
          ninja -C build && ninja -C build install

      - name: Build libvpx
        run: |
          git clone --depth 1 https://github.com/webmproject/libvpx.git && cd libvpx
          ./configure --prefix=$PREFIX --target=arm64-android-gcc --sdk-path=$ANDROID_NDK_HOME --enable-vp8 --enable-vp9 --enable-static --enable-shared --disable-examples --disable-tools --disable-unit-tests --as=nasm
          make -j$(nproc) && make install

      - name: Build libaom
        run: |
          git clone --depth 1 https://aomedia.googlesource.com/aom && mkdir -p aom/build && cd aom/build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DENABLE_SHARED=ON -DENABLE_STATIC=ON -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_TOOLS=OFF -DCONFIG_AV1_ENCODER=1 -DAOM_TARGET_CPU=arm64
          ninja && ninja install

      - name: Build SVT-AV1
        run: |
          git clone --depth 1 https://gitlab.com/AOMediaCodec/SVT-AV1.git && cd SVT-AV1 && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=ON
          ninja && ninja install

      - name: Build VVenC
        run: |
          git clone --depth 1 https://github.com/fraunhoferhhi/vvenc.git && cd vvenc && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          make -j$(nproc) && make install

      - name: Build XEVE (EVC Encoder)
        run: |
          git clone --depth 1 https://github.com/mpeg5/xeve.git && cd xeve && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DSET_PROF=MAIN -DBUILD_SHARED_LIBS=ON
          make -j$(nproc) && make install

      - name: Build XEVD (EVC Decoder)
        run: |
          git clone --depth 1 https://github.com/mpeg5/xevd.git && cd xevd && mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=${TARGET_ABI} -DANDROID_PLATFORM=android-${API_LEVEL} -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_SHARED_LIBS=ON
          make -j$(nproc) && make install

      - name: Build fdk-aac
        run: |
          git clone --depth 1 https://github.com/mstorsjo/fdk-aac.git && cd fdk-aac
          ./autogen.sh
          ./configure --prefix=$PREFIX --host=${TARGET_TRIPLE} --enable-static --enable-shared --disable-example
          make -j$(nproc) && make install

      - name: Build lame
        run: |
          wget -q https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz && tar xf lame-3.100.tar.gz && cd lame-3.100
          ./configure --prefix=$PREFIX --host=${TARGET_TRIPLE} --enable-static --enable-shared --disable-frontend
          make -j$(nproc) && make install

      - name: Build opus
        run: |
          git clone --depth 1 https://github.com/xiph/opus.git && cd opus
          ./autogen.sh
          ./configure --prefix=$PREFIX --host=${TARGET_TRIPLE} --enable-static --enable-shared
          make -j$(nproc) && make install

      - name: Build libvorbis
        run: |
          git clone --depth 1 https://github.com/xiph/vorbis.git && cd vorbis
          ./autogen.sh
          ./configure --prefix=$PREFIX --host=${TARGET_TRIPLE} --enable-static --enable-shared
          make -j$(nproc) && make install

      - name: Build liblc3
        run: |
          git clone --depth 1 https://android.googlesource.com/platform/external/liblc3 && cd liblc3
          make -j$(nproc) CC="$CC" LIBC=bionic && make install PREFIX=$PREFIX

      - name: Build openssl
        run: |
          git clone --depth 1 https://github.com/openssl/openssl.git && cd openssl
          ./Configure android-arm64 -D__ANDROID_API__=${API_LEVEL} --prefix=$PREFIX --openssldir=$PREFIX/ssl no-shared no-tests
          make -j$(nproc) && make install_sw

      # ==================== 编译 FFmpeg ====================
      - name: Download FFmpeg
        run: |
          wget -q "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz"
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure FFmpeg
        working-directory: ffmpeg
        run: |
          ./configure \
            --prefix=$PREFIX \
            --enable-cross-compile \
            --target-os=android \
            --arch=${TARGET_ARCH} \
            --cpu=${TARGET_CPU} \
            --cc="$CC" --cxx="$CXX" \
            --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
            --sysroot="$SYSROOT" \
            --enable-shared --enable-static --enable-pic \
            --enable-gpl --enable-version3 --enable-nonfree \
            --enable-jni --enable-mediacodec --enable-network --enable-openssl \
            --enable-libx264 --enable-libx265 --enable-libxvid \
            --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
            --enable-libvvenc --enable-libxeve --enable-libxevd \
            --enable-libwebp --enable-libxavs2 \
            --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
            --enable-liblc3 --enable-libshine \
            --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
            --disable-doc --disable-debug \
            --extra-cflags="-I$PREFIX/include -fPIC" \
            --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib" \
            --extra-libs="-lm -lz -ldl"

      - name: Build and install FFmpeg
        working-directory: ffmpeg
        run: make -j$(nproc) && make install

      # ==================== 整理产物 ====================
      - name: Collect artifacts
        run: |
          mkdir -p ${{ github.workspace }}/artifacts/shared/lib
          mkdir -p ${{ github.workspace }}/artifacts/shared/bin
          mkdir -p ${{ github.workspace }}/artifacts/static/lib
          mkdir -p ${{ github.workspace }}/artifacts/include

          cp -r $PREFIX/include/* ${{ github.workspace }}/artifacts/include/
          
          cp $PREFIX/lib/*.so ${{ github.workspace }}/artifacts/shared/lib/ 2>/dev/null || true
          cp $PREFIX/bin/ffmpeg $PREFIX/bin/ffprobe ${{ github.workspace }}/artifacts/shared/bin/ 2>/dev/null || true
          $STRIP ${{ github.workspace }}/artifacts/shared/bin/* 2>/dev/null || true
          
          cp $PREFIX/lib/*.a ${{ github.workspace }}/artifacts/static/lib/ 2>/dev/null || true

          BUILD_INFO="${{ github.workspace }}/artifacts/BUILD_INFO.txt"
          echo "=== FFmpeg Android Build Info ===" > $BUILD_INFO
          echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $BUILD_INFO
          echo "FFmpeg Version: ${{ env.FFMPEG_VERSION }}" >> $BUILD_INFO
          echo "NDK Version: ${{ env.NDK_VERSION }}" >> $BUILD_INFO
          echo "API Level: ${{ env.API_LEVEL }}" >> $BUILD_INFO
          echo "ABI: ${TARGET_ABI}" >> $BUILD_INFO
          echo "" >> $BUILD_INFO
          echo "=== FFmpeg Buildconf ===" >> $BUILD_INFO
          $PREFIX/bin/ffmpeg -buildconf >> $BUILD_INFO 2>/dev/null || true

          cp $BUILD_INFO ${{ github.workspace }}/artifacts/shared/
          cp $BUILD_INFO ${{ github.workspace }}/artifacts/static/

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64-v8a
          path: ${{ github.workspace }}/artifacts/

  # ==================== 发布 Release ====================
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Set Build Date
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Package assets
        run: |
          # 打包动态库
          cd artifacts && zip -r /tmp/ffmpeg-android-arm64-v8a-shared.zip shared/
          # 打包静态库
          zip -r /tmp/ffmpeg-android-arm64-v8a-static.zip static/
          ls -la /tmp/*.zip

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## FFmpeg Android Build (arm64-v8a, Full GPL + Non-free)
            - **Build Date**: ${{ env.BUILD_DATE }}
            - **NDK Version**: ${{ env.NDK_VERSION }} (API ${{ env.API_LEVEL }})
            - **FFmpeg Version**: ${{ env.FFMPEG_VERSION }}
            - **Architecture**: arm64-v8a (aarch64)
            
            ### Included Packages
            - **Shared (.so)**: Includes `lib/*.so`, `include/`, and `bin/` (ffmpeg/ffprobe).
            - **Static (.a)**: Includes `lib/*.a` and `include/`.
            
            ### Enabled External Libraries (Highlights)
            - **Video**: x264, x265, xvid, dav1d, vpx, aom, svtav1, vvenc, xeve, xevd, webp, xavs2
            - **Audio**: fdk-aac, mp3lame, opus, vorbis, lc3, shine
            - **Subtitles & Network**: libass, freetype, fribidi, fontconfig, openssl
            
            *Detailed build configurations can be found in the `BUILD_INFO.txt` inside each zip package.*
          files: |
            /tmp/ffmpeg-android-arm64-v8a-*.zip
          generate_release_notes: true
