name: Build FFmpeg (split shared / static)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg Version'
        required: true
        default: '9.0.2'
      prefix_url:
        description: '外部库下载链接 (留空则使用默认 full.tar.xz)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 0'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  ANDROID_TRIPLE: "aarch64-linux-android"
  FFMPEG_VERSION_DEFAULT: "9.0.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =====================================================================
# SHARED：动态链接，库检索路径 ./lib
# =====================================================================
jobs:
  build-shared:
    name: build-ffmpeg (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip file binutils xz-utils

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: Linux-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=30 "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Verify NDK toolchain
        run: |
          set -euo pipefail
          TC="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          echo "✅ NDK 可用"

      - name: Download and extract prefix
        run: |
          set -euo pipefail
          W="${{ github.workspace }}"

          # 默认用 release 上的 full 包（两级布局）
          FINAL_URL="${{ inputs.prefix_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="https://github.com/CELEFT/FFmpeg/releases/download/ffmpeg-lib/ffmpeg-libs-arm64-v8a-api${API_LEVEL}-full.tar.xz"
          fi
          echo "📥 下载外部库: $FINAL_URL"
          wget -q --tries=3 --timeout=60 "$FINAL_URL" -O prefix_pkg
          file prefix_pkg

          rm -rf extract_dir && mkdir -p extract_dir
          if file prefix_pkg | grep -qi "Zip archive"; then
            unzip -q prefix_pkg -d extract_dir
          elif file prefix_pkg | grep -qi "XZ compressed"; then
            tar -xf prefix_pkg -C extract_dir
          elif file prefix_pkg | grep -qi "gzip compressed"; then
            tar -xzf prefix_pkg -C extract_dir
          else
            echo "::error::未知的压缩格式"
            exit 1
          fi

          echo "----- 解压结果 -----"
          find extract_dir -maxdepth 3 -type d | sort | head -30

          # ---- 归一化到 $W/prefix ----
          if [ -d "extract_dir/prefix" ]; then
            mv extract_dir/prefix "$W/prefix"
          elif [ -d "extract_dir/lib" ] && [ -d "extract_dir/include" ]; then
            mv extract_dir "$W/prefix"
          else
            echo "::error::解压后找不到 prefix 目录"
            exit 1
          fi

          # ---- 判定布局 ----
          if [ -d "$W/prefix/static" ] && [ -d "$W/prefix/shared" ]; then
            LAYOUT="two"
            PST="$W/prefix/static"
            PSH="$W/prefix/shared"
            echo "✅ 检测到两级布局: prefix/{static,shared}"
          else
            LAYOUT="flat"
            PST="$W/prefix"
            PSH="$W/prefix"
            echo "::warning::检测到扁平布局，static/shared 共用同一 prefix"
          fi

          {
            echo "PREFIX_ROOT=$W/prefix"
            echo "PREFIX_STATIC=$PST"
            echo "PREFIX_SHARED=$PSH"
            echo "PREFIX_LAYOUT=$LAYOUT"
          } >> "$GITHUB_ENV"

          echo "--- static ---"
          find "$PST" -maxdepth 2 \( -name '*.a' -o -name '*.pc' \) | head -10 || true
          echo "--- shared ---"
          find "$PSH" -maxdepth 2 \( -name '*.so' -o -name '*.pc' \) | head -10 || true

      - name: Build FFmpeg (shared)
        run: |
          #!/bin/bash
          set -euo pipefail

          BUILD_TYPE="shared"
          RPATH_DIR="./lib"

          WORKSPACE="$(pwd)"
          NDK_DIR="$WORKSPACE/ndk"
          PREFIX="${PREFIX_SHARED:?PREFIX_SHARED 未设置}"
          OUTPUT="$WORKSPACE/output"
          FFMPEG_VERSION="${{ inputs.ffmpeg_version || env.FFMPEG_VERSION_DEFAULT }}"
          API_LEVEL="${{ env.API_LEVEL }}"
          ANDROID_TRIPLE="${{ env.ANDROID_TRIPLE }}"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          SYS_LIB="$SYSROOT/usr/lib/${ANDROID_TRIPLE}"

          export CC="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          # 动态链接：链接期需要 rpath-link 解析依赖链
          LD_SHARED="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath-link,$SYS_LIB -Wl,-rpath,$RPATH_DIR"

          echo "🔧 修正 pkg-config 与头文件路径 (PREFIX=$PREFIX)..."
          PC="$PREFIX/lib/pkgconfig"
          mkdir -p "$PC"

          # 收集 include 子目录，补到 Cflags
          SUBDIRS=""
          if [ -d "$PREFIX/include" ]; then
            while IFS= read -r d; do
              SUBDIRS="$SUBDIRS -I$PREFIX/include/${d#./}"
            done < <(cd "$PREFIX/include" && find . -mindepth 1 -maxdepth 1 -type d ! -name 'include')
          fi

          for f in "$PC"/*.pc; do
            [ -e "$f" ] || continue
            # main.yml 里写的是 ${pcfiledir}/../..，这里统一换成绝对路径
            sed -i "s|\${pcfiledir}/\.\./\.\.|$PREFIX|g" "$f"
            sed -i "s|\${pcfiledir}/\.\.|$PREFIX|g" "$f"
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
            if [ -n "$SUBDIRS" ] && grep -q '^Cflags:' "$f"; then
              sed -i "s|^Cflags:.*|& $SUBDIRS|" "$f"
            fi
          done

          # OpenSSL 只装 libssl.pc / libcrypto.pc，FFmpeg 找 openssl.pc
          if [ ! -e "$PC/openssl.pc" ] && [ -e "$PC/libssl.pc" ] && [ -e "$PC/libcrypto.pc" ]; then
            echo "🔧 生成 openssl.pc 兼容层"
            {
              echo "prefix=$PREFIX"
              echo 'exec_prefix=${prefix}'
              echo 'libdir=${exec_prefix}/lib'
              echo 'includedir=${prefix}/include'
              echo
              echo "Name: openssl"
              echo "Description: OpenSSL shim for FFmpeg"
              echo "Version: 3.0.0"
              echo 'Libs: -L${libdir} -lssl -lcrypto'
              echo "Libs.private: -ldl -pthread"
              echo 'Cflags: -I${includedir}'
            } > "$PC/openssl.pc"
          fi

          # 头文件平铺（freetype/ft2build.h 之类）
          if [ -d "$PREFIX/include" ]; then
            find "$PREFIX/include" -mindepth 2 -name "*.h" -print0 |
              while IFS= read -r -d '' h; do
                tgt="$PREFIX/include/$(basename "$h")"
                [ -e "$tgt" ] || cp -n "$h" "$tgt"
              done
          fi

          if [ ! -d "ffmpeg" ]; then
            echo "⬇️ 下载 FFmpeg ${FFMPEG_VERSION}..."
            if ! wget -q --tries=3 --timeout=30 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
              wget -q --tries=3 --timeout=30 "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz" -O ffmpeg-mirror.tar.gz
              tar xzf ffmpeg-mirror.tar.gz && mv "FFmpeg-n${FFMPEG_VERSION}" ffmpeg
            else
              tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz" && mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg
            fi
          fi

          cd ffmpeg
          [ -f Makefile ] && { make distclean >/dev/null 2>&1 || true; }

          echo "🚀 开始构建 (shared)  rpath=$RPATH_DIR"
          if ! ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config \
              --enable-shared --disable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="$LD_SHARED" \
              --extra-libs="-lm -lz" ; then
            echo "::group::configure failed"
            tail -n 160 ffbuild/config.log || true
            echo "::endgroup::"
            exit 1
          fi

          make -j"$(nproc)"
          make install

          # ---- 组装 shared 产物 ----
          if [ -d "$OUTPUT/bin" ]; then
            cp -a "$OUTPUT/bin/." "$OUTPUT/"
            rm -rf "$OUTPUT/bin"
          fi
          mkdir -p "$OUTPUT/lib"

          echo "📦 收集第三方动态库..."
          cp -a "$PREFIX/lib"/*.so* "$OUTPUT/lib/" 2>/dev/null || true

          # C++ 运行时：按需补齐（实测第三方库多为静态链 libc++ 且已隐藏符号）
          need_cxx=0
          for f in "$OUTPUT"/lib/*.so* "$OUTPUT"/libav*.so*; do
            [ -f "$f" ] || continue
            if readelf -d "$f" 2>/dev/null | grep -q 'NEEDED.*libc++_shared'; then
              need_cxx=1
              echo "  需要 libc++_shared: $(basename "$f")"
            fi
          done
          if [ "$need_cxx" -eq 1 ]; then
            cp -a "$SYS_LIB/libc++_shared.so" "$OUTPUT/lib/" 2>/dev/null || true
            echo "::warning::有库依赖 libc++_shared.so，已打包进 lib/"
          else
            echo "✅ 无 libc++_shared 依赖，跳过打包"
          fi

          # wrapper：bionic 对 RUNPATH 支持不稳定，用脚本兜底
          for bin in ffmpeg ffprobe; do
            {
              printf '%s\n' '#!/system/bin/sh'
              printf '%s\n' 'DIR=$(cd "$(dirname "$0")" 2>/dev/null && pwd)'
              printf '%s\n' '[ -n "$DIR" ] || DIR=.'
              printf '%s\n' "export LD_LIBRARY_PATH=\"\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\""
              printf '%s\n' "exec \"\$DIR/${bin}\" \"\$@\""
            } > "$OUTPUT/${bin}.sh"
            chmod +x "$OUTPUT/${bin}.sh"
          done

          {
            echo "======================================"
            echo "FFmpeg Android Build Info (SHARED)"
            echo "======================================"
            echo "Build Date    : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Build Type    : shared"
            echo "FFmpeg Version: $FFMPEG_VERSION"
            echo "NDK Version   : ${{ env.NDK_VERSION }} (API $API_LEVEL)"
            echo "Target ABI    : arm64-v8a"
            echo "Prefix Layout : ${PREFIX_LAYOUT:-unknown}"
            echo "Prefix Used   : $PREFIX"
            if [ "$need_cxx" -eq 1 ]; then
              echo "C++ Runtime   : libc++_shared.so (bundled in lib/)"
            else
              echo "C++ Runtime   : (none required, libc++ statically linked & hidden)"
            fi
            echo "RPath         : $RPATH_DIR"
            echo "======================================"
            echo "============ Dynamic Links ============"
            readelf -d "$OUTPUT/ffmpeg" | grep -E 'NEEDED|RUNPATH|RPATH' || true
          } > "$OUTPUT/BUILD_INFO.txt"

          echo "✅ shared 构建完成"
          ls -la "$OUTPUT"
          ls -la "$OUTPUT/lib" | head -50

      - name: Verify shared linkage
        run: |
          set -uo pipefail
          fail=0
          SYS_ALLOW="libc.so libm.so libdl.so libz.so liblog.so libandroid.so \
          libmediandk.so libcamera2ndk.so libEGL.so libGLESv2.so libjnigraphics.so \
          libnativewindow.so libsync.so libvulkan.so"
          is_sys() { for a in $SYS_ALLOW; do [ "$1" = "$a" ] && return 0; done; return 1; }
          needed_of() { readelf -d "$1" 2>/dev/null | awk '/NEEDED/{gsub(/[][\[\] ]/,"",$NF); print $NF}'; }

          echo "===== 1. ffmpeg 必须存在且 RUNPATH 含 ./lib ====="
          if [ ! -f output/ffmpeg ]; then
            echo "::error::output/ffmpeg 不存在"
            exit 1
          fi
          dyn="$(readelf -d output/ffmpeg 2>/dev/null | grep -E 'RUNPATH|RPATH' || true)"
          echo "$dyn"
          case "$dyn" in
            *"./lib"*) echo "✅ RUNPATH 含 ./lib" ;;
            *) echo "::error::ELF 中未找到 ./lib 检索路径"; fail=1 ;;
          esac

          echo "===== 2. libc++ 运行时一致性 ====="
          if [ -e output/lib/libc++_shared.so ]; then
            echo "✅ 打包了 libc++_shared.so（有库需要它）"
          else
            n=0
            for f in output/ffmpeg output/lib/*.so*; do
              [ -f "$f" ] || continue
              needed_of "$f" | grep -qx 'libc++_shared.so' && { echo "::error::$f 需要 libc++_shared.so 但未打包"; n=$((n+1)); }
            done
            if [ "$n" -eq 0 ]; then
              echo "✅ 无库需要 libc++_shared.so（libc++ 已静态链入）"
            else
              fail=1
            fi
          fi

          echo "===== 3. 所有非系统 NEEDED 必须能在 output/lib 内解析 ====="
          for f in output/ffmpeg output/ffprobe output/lib/*.so*; do
            [ -f "$f" ] || continue
            for n in $(needed_of "$f"); do
              is_sys "$n" && continue
              if [ ! -e "output/lib/$n" ]; then
                echo "::error::$(basename "$f") 缺少依赖 $n"
                fail=1
              fi
            done
          done
          [ $fail -eq 0 ] && echo "✅ shared 依赖自洽"
          exit $fail

      - name: Report 16KB page alignment (shared)
        run: |
          set -uo pipefail
          echo "===== LOAD 对齐（应为 0x4000）====="
          bad=0
          for f in output/ffmpeg output/ffprobe output/lib/*.so*; do
            [ -f "$f" ] || continue
            al="$(readelf -lW "$f" 2>/dev/null | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')"
            case "$al" in
              *0x1000*) echo "::warning::$(basename "$f") 含 4KB 段: $al"; bad=1 ;;
            esac
            echo "$(printf '%-46s' "$f") -> ${al:-unknown}"
          done
          [ "$bad" -eq 0 ] && echo "✅ 全部 16KB 合规"

      - name: Package (shared)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-shared-arm64-v8a.tar.xz output
          ls -lh ffmpeg-shared-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-shared
          path: ${{ github.workspace }}/ffmpeg-shared-arm64-v8a.tar.xz
          retention-days: 7

  # =====================================================================
  # STATIC：全静态，用 libc++_static，无检索路径
  # =====================================================================
  build-static:
    name: build-ffmpeg (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip file binutils xz-utils

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: Linux-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=30 "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Verify NDK toolchain
        run: |
          set -euo pipefail
          TC="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          echo "✅ NDK 可用"

      - name: Download and extract prefix
        run: |
          set -euo pipefail
          W="${{ github.workspace }}"

          FINAL_URL="${{ inputs.prefix_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="https://github.com/CELEFT/FFmpeg/releases/download/ffmpeg-lib/ffmpeg-libs-arm64-v8a-api${API_LEVEL}-full.tar.xz"
          fi
          echo "📥 下载外部库: $FINAL_URL"
          wget -q --tries=3 --timeout=60 "$FINAL_URL" -O prefix_pkg
          file prefix_pkg

          rm -rf extract_dir && mkdir -p extract_dir
          if file prefix_pkg | grep -qi "Zip archive"; then
            unzip -q prefix_pkg -d extract_dir
          elif file prefix_pkg | grep -qi "XZ compressed"; then
            tar -xf prefix_pkg -C extract_dir
          elif file prefix_pkg | grep -qi "gzip compressed"; then
            tar -xzf prefix_pkg -C extract_dir
          else
            echo "::error::未知的压缩格式"
            exit 1
          fi

          echo "----- 解压结果 -----"
          find extract_dir -maxdepth 3 -type d | sort | head -30

          if [ -d "extract_dir/prefix" ]; then
            mv extract_dir/prefix "$W/prefix"
          elif [ -d "extract_dir/lib" ] && [ -d "extract_dir/include" ]; then
            mv extract_dir "$W/prefix"
          else
            echo "::error::解压后找不到 prefix 目录"
            exit 1
          fi

          if [ -d "$W/prefix/static" ] && [ -d "$W/prefix/shared" ]; then
            LAYOUT="two"
            PST="$W/prefix/static"
            PSH="$W/prefix/shared"
            echo "✅ 检测到两级布局: prefix/{static,shared}"
          else
            LAYOUT="flat"
            PST="$W/prefix"
            PSH="$W/prefix"
            echo "::warning::检测到扁平布局，static/shared 共用同一 prefix"
          fi

          {
            echo "PREFIX_ROOT=$W/prefix"
            echo "PREFIX_STATIC=$PST"
            echo "PREFIX_SHARED=$PSH"
            echo "PREFIX_LAYOUT=$LAYOUT"
          } >> "$GITHUB_ENV"

          echo "--- static libs ---"
          ls -1 "$PST"/lib/*.a 2>/dev/null | head -40 || echo "(none)"

      - name: Preflight - static archives availability
        run: |
          set -uo pipefail
          PREFIX="${PREFIX_STATIC:?PREFIX_STATIC 未设置}"
          echo "===== 静态库清单 ====="
          ls -1 "$PREFIX"/lib/*.a 2>/dev/null || echo "(none)"
          echo
          echo "===== 只有 .so 没有 .a 的库（无法静态链接）====="
          miss=0
          for so in "$PREFIX"/lib/*.so; do
            [ -e "$so" ] || continue
            base="$(basename "$so")"; base="${base%%.so*}"
            if [ ! -e "$PREFIX/lib/${base}.a" ]; then
              echo "::warning::${base}: 只有 .so，没有 .a"
              miss=1
            fi
          done
          [ "$miss" -eq 0 ] && echo "✅ 全部 .so 都有对应 .a"
          exit 0

      - name: Build FFmpeg (static)
        run: |
          #!/bin/bash
          set -euo pipefail

          BUILD_TYPE="static"

          WORKSPACE="$(pwd)"
          NDK_DIR="$WORKSPACE/ndk"
          PREFIX="${PREFIX_STATIC:?PREFIX_STATIC 未设置}"
          OUTPUT="$WORKSPACE/output"
          FFMPEG_VERSION="${{ inputs.ffmpeg_version || env.FFMPEG_VERSION_DEFAULT }}"
          API_LEVEL="${{ env.API_LEVEL }}"
          ANDROID_TRIPLE="${{ env.ANDROID_TRIPLE }}"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          SYS_LIB="$SYSROOT/usr/lib/${ANDROID_TRIPLE}"

          export CC="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          # 静态：只保留 -L 与 rpath-link，刻意不加 -rpath
          LD_STATIC="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath-link,$SYS_LIB"

          echo "🔧 修正 pkg-config 与头文件路径 (PREFIX=$PREFIX)..."
          PC="$PREFIX/lib/pkgconfig"
          mkdir -p "$PC"

          SUBDIRS=""
          if [ -d "$PREFIX/include" ]; then
            while IFS= read -r d; do
              SUBDIRS="$SUBDIRS -I$PREFIX/include/${d#./}"
            done < <(cd "$PREFIX/include" && find . -mindepth 1 -maxdepth 1 -type d ! -name 'include')
          fi

          for f in "$PC"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|\${pcfiledir}/\.\./\.\.|$PREFIX|g" "$f"
            sed -i "s|\${pcfiledir}/\.\.|$PREFIX|g" "$f"
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
            if [ -n "$SUBDIRS" ] && grep -q '^Cflags:' "$f"; then
              sed -i "s|^Cflags:.*|& $SUBDIRS|" "$f"
            fi
          done

          if [ ! -e "$PC/openssl.pc" ] && [ -e "$PC/libssl.pc" ] && [ -e "$PC/libcrypto.pc" ]; then
            echo "🔧 生成 openssl.pc 兼容层"
            {
              echo "prefix=$PREFIX"
              echo 'exec_prefix=${prefix}'
              echo 'libdir=${exec_prefix}/lib'
              echo 'includedir=${prefix}/include'
              echo
              echo "Name: openssl"
              echo "Description: OpenSSL shim for FFmpeg"
              echo "Version: 3.0.0"
              echo 'Libs: -L${libdir} -lssl -lcrypto'
              echo "Libs.private: -ldl -pthread"
              echo 'Cflags: -I${includedir}'
            } > "$PC/openssl.pc"
          fi

          if [ -d "$PREFIX/include" ]; then
            find "$PREFIX/include" -mindepth 2 -name "*.h" -print0 |
              while IFS= read -r -d '' h; do
                tgt="$PREFIX/include/$(basename "$h")"
                [ -e "$tgt" ] || cp -n "$h" "$tgt"
              done
          fi

          echo "🔧 静态模式：隐藏有对应 .a 的 .so，逼迫链接器取静态库..."
          for f in "$PREFIX/lib"/*.so*; do
            [ -e "$f" ] || continue
            base="$(basename "$f")"; base="${base%%.so*}"
            if [ -e "$PREFIX/lib/${base}.a" ]; then
              mv "$f" "${f}.bak"
            fi
          done

          if [ ! -d "ffmpeg" ]; then
            echo "⬇️ 下载 FFmpeg ${FFMPEG_VERSION}..."
            if ! wget -q --tries=3 --timeout=30 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
              wget -q --tries=3 --timeout=30 "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz" -O ffmpeg-mirror.tar.gz
              tar xzf ffmpeg-mirror.tar.gz && mv "FFmpeg-n${FFMPEG_VERSION}" ffmpeg
            else
              tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz" && mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg
            fi
          fi

          cd ffmpeg
          [ -f Makefile ] && { make distclean >/dev/null 2>&1 || true; }

          echo "🚀 开始构建 (static)"
          if ! ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config --pkg-config-flags="--static" \
              --disable-shared --enable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="$LD_STATIC" \
              --extra-libs="-lc++_static -lm -lz -ldl" ; then
            echo "::group::configure failed"
            tail -n 160 ffbuild/config.log || true
            echo "::endgroup::"
            exit 1
          fi

          make -j"$(nproc)" ffmpeg ffprobe

          mkdir -p "$OUTPUT"
          cp ffmpeg ffprobe "$OUTPUT/"
          $STRIP "$OUTPUT/ffmpeg" "$OUTPUT/ffprobe"

          {
            echo "======================================"
            echo "FFmpeg Android Build Info (STATIC)"
            echo "======================================"
            echo "Build Date    : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Build Type    : static"
            echo "FFmpeg Version: $FFMPEG_VERSION"
            echo "NDK Version   : ${{ env.NDK_VERSION }} (API $API_LEVEL)"
            echo "Target ABI    : arm64-v8a"
            echo "Prefix Layout : ${PREFIX_LAYOUT:-unknown}"
            echo "Prefix Used   : $PREFIX"
            echo "C++ Runtime   : libc++_static (linked in)"
            echo "RPath         : (none, by design)"
            echo "======================================"
            echo "============ Static Check ============="
            file "$OUTPUT/ffmpeg" || true
            echo "--- NEEDED ---"
            readelf -d "$OUTPUT/ffmpeg" 2>/dev/null | grep NEEDED || echo "No dynamic dependencies"
          } > "$OUTPUT/BUILD_INFO.txt"

          echo "✅ static 构建完成"
          ls -la "$OUTPUT"

      - name: Verify static linkage
        run: |
          set -uo pipefail
          fail=0
          SYS_ALLOW="libc.so libm.so libdl.so libz.so liblog.so libandroid.so \
          libmediandk.so libcamera2ndk.so libEGL.so libGLESv2.so libjnigraphics.so \
          libnativewindow.so libsync.so libvulkan.so"
          is_sys() { for a in $SYS_ALLOW; do [ "$1" = "$a" ] && return 0; done; return 1; }
          needed_of() { readelf -d "$1" 2>/dev/null | awk '/NEEDED/{gsub(/[][\[\] ]/,"",$NF); print $NF}'; }

          echo "===== 1. 不应有 output/lib ====="
          if [ -d output/lib ]; then
            echo "::error::静态产物不应包含 lib/ 目录"
            fail=1
          else
            echo "✅ 无 lib/ 目录"
          fi

          echo "===== 2. NEEDED 必须在系统白名单内 ====="
          for f in output/ffmpeg output/ffprobe; do
            [ -f "$f" ] || { echo "::error::$f 不存在"; fail=1; continue; }
            for n in $(needed_of "$f"); do
              if is_sys "$n"; then
                echo "  ok  $(basename "$f") -> $n"
              else
                echo "::error::$(basename "$f") 依赖了非系统库: $n"
                fail=1
              fi
            done
          done

          echo "===== 3. 不应残留 RUNPATH/RPATH ====="
          if readelf -d output/ffmpeg 2>/dev/null | grep -qE 'RUNPATH|RPATH'; then
            echo "::warning::静态二进制带有 RUNPATH（不影响运行）"
            readelf -d output/ffmpeg | grep -E 'RUNPATH|RPATH'
          else
            echo "✅ 无 RUNPATH/RPATH"
          fi

          [ $fail -eq 0 ] && echo "✅ static 验收通过：仅依赖 Android 系统库"
          exit $fail

      - name: Report 16KB page alignment (static)
        run: |
          set -uo pipefail
          for f in output/ffmpeg output/ffprobe; do
            [ -f "$f" ] || continue
            al="$(readelf -lW "$f" 2>/dev/null | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')"
            echo "$(printf '%-30s' "$(basename "$f")") -> ${al:-unknown}"
          done

      - name: Package (static)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-static-arm64-v8a.tar.xz output
          ls -lh ffmpeg-static-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ${{ github.workspace }}/ffmpeg-static-arm64-v8a.tar.xz
          retention-days: 7

  # =====================================================================
  # RELEASE
  # =====================================================================
  release:
    needs: [build-shared, build-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Prepare env & checksums
        run: |
          set -euo pipefail
          {
            echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "BUILD_DATE_UTC3=$(TZ='Etc/GMT-3' date +'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"
          cd artifacts
          ls -lh
          sha256sum *.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'weekly-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'FFmpeg Android (arm64-v8a) — weekly' }}
          body: |
            ## FFmpeg for Android (arm64-v8a)

            - **Build Date (UTC)**: ${{ env.BUILD_DATE }}
            - **Build Date (UTC+3)**: ${{ env.BUILD_DATE_UTC3 }}
            - **NDK**: r30 / API ${{ env.API_LEVEL }}
            - **FFmpeg**: ${{ env.FFMPEG_VERSION_DEFAULT }}
            - **外部库来源**: `ffmpeg-libs-arm64-v8a-api${{ env.API_LEVEL }}-full.tar.xz`

            ### 1. `ffmpeg-shared-arm64-v8a.tar.xz`（动态）

            - 库检索：ELF `RUNPATH = ./lib`，`cd output && ./ffmpeg -version` 可直接运行
            - 从其它目录调用请用 wrapper：`./ffmpeg.sh` / `./ffprobe.sh`
            - C++ 运行时：第三方库的 libc++ 已静态链入并隐藏符号，**通常无需 `libc++_shared.so`**；若确有库需要，构建时会自动打包并告警

            ```
            output/
            ├── ffmpeg          <-- RUNPATH=./lib
            ├── ffprobe
            ├── ffmpeg.sh       <-- 自动设置 LD_LIBRARY_PATH=$DIR/lib
            ├── ffprobe.sh
            ├── lib/            <-- libav*.so + 第三方 .so
            └── BUILD_INFO.txt
            ```

            ### 2. `ffmpeg-static-arm64-v8a.tar.xz`（静态）

            - C++ 运行时：`libc++_static`（已链入）
            - 无 `lib/`、无 RUNPATH，仅依赖 Android 系统库

            ```
            output/
            ├── ffmpeg
            ├── ffprobe
            └── BUILD_INFO.txt
            ```

            ### 质量校验

            - 16 KB 页对齐：`LOAD` 段 `p_align = 0x4000`
            - shared：所有非系统 `NEEDED` 均可由 `output/lib` 解析
            - static：`NEEDED` 仅含 Android 系统库
          files: |
            artifacts/*.tar.xz
            artifacts/SHA256SUMS.txt
          overwrite_files: true
          generate_release_notes: true
