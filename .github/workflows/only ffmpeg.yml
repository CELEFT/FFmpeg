name: Build FFmpeg (Matrix)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg Version'
        required: true
        default: '9.0.2'
      prefix_url:
        description: '外部库下载链接 (留空则使用默认)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 0'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  ANDROID_TRIPLE: "aarch64-linux-android"
  DEFAULT_PREFIX_URL: "https://github.com/CELEFT/FFmpeg/releases/download/v0.0.1/prefix-android-arm64-v8a.tar.xz"

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [shared, static]
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config nasm yasm cmake meson ninja-build git wget unzip file binutils

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: ${{ runner.os }}-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK Permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          wget -q --tries=3 --timeout=30 "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download and Extract Prefix
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.prefix_url }}" ]; then
            FINAL_URL="${{ inputs.prefix_url }}"
          else
            FINAL_URL="${{ env.DEFAULT_PREFIX_URL }}"
          fi
          
          echo "📥 正在下载外部库: $FINAL_URL"
          wget -q --tries=3 --timeout=30 "$FINAL_URL" -O prefix_pkg
          
          mkdir -p extract_dir
          if file prefix_pkg | grep -qi "Zip archive"; then
            unzip -q prefix_pkg -d extract_dir
          elif file prefix_pkg | grep -qi "XZ compressed"; then
            tar -xf prefix_pkg -C extract_dir
          elif file prefix_pkg | grep -qi "gzip compressed"; then
            tar -xzf prefix_pkg -C extract_dir
          else
            echo "::error::未知的压缩格式"
            exit 1
          fi
          
          if [ -d "extract_dir/prefix" ]; then
            mv extract_dir/prefix "${{ github.workspace }}/prefix"
          elif [ -d "extract_dir/lib" ] && [ -d "extract_dir/include" ]; then
            mv extract_dir "${{ github.workspace }}/prefix"
          else
            echo "::error::解压后的包内找不到 prefix 目录"
            exit 1
          fi

      - name: Build FFmpeg (${{ matrix.build_type }})
        run: |
          #!/bin/bash
          set -euo pipefail

          WORKSPACE="$(pwd)"
          NDK_DIR="$WORKSPACE/ndk"
          PREFIX="$WORKSPACE/prefix"
          OUTPUT="$WORKSPACE/output"
          FFMPEG_VERSION="${{ inputs.ffmpeg_version || '9.0.2' }}"
          BUILD_TYPE="${{ matrix.build_type }}"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          API_LEVEL="${{ env.API_LEVEL }}"
          ANDROID_TRIPLE="${{ env.ANDROID_TRIPLE }}"

          export CC="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"

          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          echo "🔧 正在修复 pkg-config 路径与平铺头文件..."
          for f in "$PREFIX/lib/pkgconfig"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
          done
          find "$PREFIX/include" -mindepth 2 -name "*.h" -exec cp -f {} "$PREFIX/include/" \;

          if [ ! -d "ffmpeg" ]; then
              echo "⬇️ 下载 FFmpeg 源码..."
              if ! wget -q --tries=3 --timeout=30 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
                  wget -q --tries=3 --timeout=30 "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz" -O ffmpeg-mirror.tar.gz
                  tar xzf ffmpeg-mirror.tar.gz && mv "FFmpeg-n${FFMPEG_VERSION}" ffmpeg
              else
                  tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz" && mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg
              fi
          fi

          cd ffmpeg
          make distclean || true

          echo "🚀 开始构建 ($BUILD_TYPE)..."

          # === 彻底分离配置，避免任何变量传递引发的血案 ===
          if [ "$BUILD_TYPE" == "shared" ]; then
            ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config --pkg-config-flags="" \
              --enable-shared --disable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath,\$ORIGIN/lib" \
              --extra-libs="-lc++_static -lm -lz" \
            || { echo "::group::config.log failures"; tail -n 100 ffbuild/config.log; echo "::endgroup::"; exit 1; }
            
            make -j$(nproc) && make install
          else
            ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config --pkg-config-flags="--static" \
              --disable-shared --enable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi --enable-libfontconfig \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -static" \
              --extra-libs="-lc++_static -lm -lz" \
            || { echo "::group::config.log failures"; tail -n 100 ffbuild/config.log; echo "::endgroup::"; exit 1; }
            
            make -j$(nproc) ffmpeg ffprobe
          fi

          mkdir -p "$OUTPUT"
          
          if [ "$BUILD_TYPE" == "shared" ]; then
            if [ -d "$OUTPUT/bin" ]; then
              cp -a "$OUTPUT/bin/." "$OUTPUT/"
              rm -rf "$OUTPUT/bin"
            fi
            cp -a "$PREFIX/lib"/*.so* "$OUTPUT/lib/" 2>/dev/null || true
          else
            if [ -d "$OUTPUT/bin" ]; then
              cp -a "$OUTPUT/bin/." "$OUTPUT/"
              rm -rf "$OUTPUT/bin"
            fi
            cp ffmpeg ffprobe "$OUTPUT/"
            $STRIP "$OUTPUT/ffmpeg" "$OUTPUT/ffprobe"
          fi

          cat > "$OUTPUT/BUILD_INFO.txt" <<EOF
          ======================================
          FFmpeg Android Build Info
          ======================================
          Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Build Type: $BUILD_TYPE
          FFmpeg Version: $FFMPEG_VERSION
          NDK Version: ${{ env.NDK_VERSION }} (API $API_LEVEL)
          Target ABI: arm64-v8a
          ======================================
          EOF
          
          if [ "$BUILD_TYPE" == "shared" ]; then
            echo "============ Dynamic Links ============" >> "$OUTPUT/BUILD_INFO.txt"
            readelf -d "$OUTPUT/ffmpeg" | grep -E 'NEEDED|RUNPATH|RPATH' >> "$OUTPUT/BUILD_INFO.txt" || true
          else
            echo "============ Static Check =============" >> "$OUTPUT/BUILD_INFO.txt"
            file "$OUTPUT/ffmpeg" >> "$OUTPUT/BUILD_INFO.txt"
            readelf -d "$OUTPUT/ffmpeg" | grep NEEDED >> "$OUTPUT/BUILD_INFO.txt" || echo "No dynamic dependencies (Perfect)" >> "$OUTPUT/BUILD_INFO.txt"
          fi

          cd ..

      - name: LDD / ELF Linkage Verification
        run: |
          echo "======================================"
          echo "Testing ${{ matrix.build_type }} linkage..."
          echo "======================================"
          if [ "${{ matrix.build_type }}" == "static" ]; then
            # 检查是否引入了非系统级别的动态依赖 (排除 bionic 基础库)
            if readelf -d output/ffmpeg 2>/dev/null | grep NEEDED | grep -v -E 'libc\.so|libm\.so|libdl\.so|libz\.so'; then
              echo "::error::Static build has unexpected non-system dynamic dependencies!"
              exit 1
            fi
            echo "✅ Verification passed: It is a completely static executable."
          else
            echo "RUNPATH / RPATH settings:"
            readelf -d output/ffmpeg | grep -E 'RUNPATH|RPATH'
            echo "Dependencies:"
            readelf -d output/ffmpeg | grep NEEDED
            echo "✅ Verification passed: Shared build has RPATH set correctly."
          fi

      - name: Package (${{ matrix.build_type }})
        run: |
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-${{ matrix.build_type }}-arm64-v8a.tar.xz output
          
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.build_type }}
          path: ${{ github.workspace }}/ffmpeg-${{ matrix.build_type }}-arm64-v8a.tar.xz
          retention-days: 7

  release:
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Prepare env
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'weekly-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Weekly Latest Build' }}
          body: |
            ## FFmpeg for Android (arm64-v8a) - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Weekly Latest' }}
            - **Build Date**: ${{ env.BUILD_DATE }}
            - **NDK**: r30 (API 36)
            - **FFmpeg**: 9.0.2

            ### 📦 包结构说明 (动静分离)

            解压后，两个包的结构均为：可执行文件和 `lib` 处于**同一级目录**。

            **1. `ffmpeg-shared-arm64-v8a.tar.xz` (完全动态版)**
            ```
            output/
            ├── ffmpeg
            ├── ffprobe
            ├── lib/              <-- 包含了所有依赖的 .so
            └── BUILD_INFO.txt
            ```
            *已写入 `$ORIGIN/lib` 链接路径，解压后在根目录执行 `./ffmpeg` 即可自动加载旁边的 `lib`。*

            **2. `ffmpeg-static-arm64-v8a.tar.xz` (完全静态版)**
            ```
            output/
            ├── ffmpeg            <-- 纯静态，无依赖
            ├── ffprobe
            └── BUILD_INFO.txt
            ```
          files: artifacts/*.tar.xz
          overwrite_files: true
          generate_release_notes: true
