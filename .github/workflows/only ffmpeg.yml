name: Build FFmpeg (split shared / static)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: 'FFmpeg Version'
        required: true
        default: '9.0.2'
      prefix_url:
        description: '外部库下载链接 (留空则使用默认 full.tar.xz)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 0'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  ANDROID_TRIPLE: "aarch64-linux-android"
  FFMPEG_VERSION_DEFAULT: "9.0.2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # SHARED：动态链接，RUNPATH = $ORIGIN/lib（ffmpeg）/ $ORIGIN（各 .so）
  # =====================================================================
  build-shared:
    name: build-ffmpeg (shared)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip file binutils xz-utils patchelf

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: Linux-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=30 "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Verify NDK toolchain
        run: |
          set -euo pipefail
          TC="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          echo "✅ NDK 可用"

      - name: Download and extract prefix
        run: |
          set -euo pipefail
          W="${{ github.workspace }}"

          FINAL_URL="${{ inputs.prefix_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="https://github.com/CELEFT/FFmpeg/releases/download/ffmpeg-lib/ffmpeg-libs-arm64-v8a-api${API_LEVEL}-full.tar.xz"
          fi
          echo "📥 下载外部库: $FINAL_URL"
          wget -q --tries=3 --timeout=60 "$FINAL_URL" -O prefix_pkg
          file prefix_pkg

          rm -rf extract_dir && mkdir -p extract_dir
          if file prefix_pkg | grep -qi "Zip archive"; then
            unzip -q prefix_pkg -d extract_dir
          elif file prefix_pkg | grep -qi "XZ compressed"; then
            tar -xf prefix_pkg -C extract_dir
          elif file prefix_pkg | grep -qi "gzip compressed"; then
            tar -xzf prefix_pkg -C extract_dir
          else
            echo "::error::未知的压缩格式"
            exit 1
          fi

          find extract_dir -maxdepth 3 -type d | sort | head -30

          if [ -d "extract_dir/prefix" ]; then
            mv extract_dir/prefix "$W/prefix"
          elif [ -d "extract_dir/lib" ] && [ -d "extract_dir/include" ]; then
            mv extract_dir "$W/prefix"
          else
            echo "::error::解压后找不到 prefix 目录"
            exit 1
          fi

          if [ -d "$W/prefix/static" ] && [ -d "$W/prefix/shared" ]; then
            LAYOUT="two"; PST="$W/prefix/static"; PSH="$W/prefix/shared"
            echo "✅ 检测到两级布局: prefix/{static,shared}"
          else
            LAYOUT="flat"; PST="$W/prefix"; PSH="$W/prefix"
            echo "::warning::检测到扁平布局"
          fi

          {
            echo "PREFIX_ROOT=$W/prefix"
            echo "PREFIX_STATIC=$PST"
            echo "PREFIX_SHARED=$PSH"
            echo "PREFIX_LAYOUT=$LAYOUT"
          } >> "$GITHUB_ENV"

      # 补齐缺失的 pkg-config 模块
      # 注意：libass 安装的是 libass.pc，模块名是 libass（不是 ass）
      # 注意：bionic 没有独立的 libpthread.so（pthread 符号在 libc.so 里），
      #       所以 shim 里绝不能写 -lpthread（静态模式 --static 会把它展开到链接行）
      - name: Preflight pkg-config & shim missing modules
        shell: bash
        run: |
          set -uo pipefail
          for PREFIX in "${PREFIX_SHARED}" "${PREFIX_STATIC}"; do
            [ -d "$PREFIX" ] || continue
            PC="$PREFIX/lib/pkgconfig"
            mkdir -p "$PC"

            echo "===== [$PREFIX] pkg-config 清点 ====="
            for m in x264 x265 dav1d vpx aom SvtAv1Enc libvvenc xeve xevd \
                     libwebp fdk-aac lame opus vorbis lc3 \
                     libass freetype2 fribidi harfbuzz openssl; do
              if PKG_CONFIG_LIBDIR="$PC" pkg-config --exists "$m" 2>/dev/null; then
                printf '  %-12s ok  %s\n' "$m" "$(PKG_CONFIG_LIBDIR="$PC" pkg-config --modversion "$m" 2>/dev/null)"
              else
                printf '  %-12s MISSING\n' "$m"
              fi
            done

            # x264 从不安装 .pc
            if [ ! -e "$PC/x264.pc" ] && { [ -e "$PREFIX/lib/libx264.a" ] || [ -e "$PREFIX/lib/libx264.so" ]; }; then
              echo "🔧 生成 x264.pc"
              {
                echo "prefix=$PREFIX"
                echo 'exec_prefix=${prefix}'
                echo 'libdir=${exec_prefix}/lib'
                echo 'includedir=${prefix}/include'
                echo
                echo 'Name: x264'
                echo 'Description: H.264/MPEG-4 AVC codec'
                echo 'Version: 164'
                echo 'Libs: -L${libdir} -lx264'
                echo 'Libs.private: -lm -ldl'
                echo 'Cflags: -I${includedir}'
              } > "$PC/x264.pc"
            fi

            # OpenSSL 只装 libssl.pc / libcrypto.pc
            if [ ! -e "$PC/openssl.pc" ] && [ -e "$PC/libssl.pc" ]; then
              echo "🔧 生成 openssl.pc"
              {
                echo "prefix=$PREFIX"
                echo 'exec_prefix=${prefix}'
                echo 'libdir=${exec_prefix}/lib'
                echo 'includedir=${prefix}/include'
                echo
                echo 'Name: openssl'
                echo 'Description: OpenSSL shim for FFmpeg'
                echo 'Version: 3.0.0'
                echo 'Libs: -L${libdir} -lssl -lcrypto'
                echo 'Libs.private: -ldl'
                echo 'Cflags: -I${includedir}'
              } > "$PC/openssl.pc"
            fi

            # webp 静态需要 sharpyuv
            if [ -e "$PC/libwebp.pc" ] && [ -e "$PREFIX/lib/libsharpyuv.a" ]; then
              grep -q 'sharpyuv' "$PC/libwebp.pc" || {
                echo "🔧 libwebp.pc 补 -lsharpyuv"
                if grep -q '^Libs.private:' "$PC/libwebp.pc"; then
                  sed -i 's|^Libs.private:.*|& -lsharpyuv|' "$PC/libwebp.pc"
                else
                  echo 'Libs.private: -lsharpyuv' >> "$PC/libwebp.pc"
                fi
              }
            fi

            echo "===== [$PREFIX] 断言 ====="
            bad=0
            for m in x264 x265 dav1d vpx aom SvtAv1Enc libvvenc xeve xevd \
                     libwebp openssl libass freetype2 fribidi harfbuzz \
                     fdk-aac lame opus vorbis lc3; do
              PKG_CONFIG_LIBDIR="$PC" pkg-config --exists "$m" 2>/dev/null || {
                echo "::error::缺少 pkg-config 模块: $m ($PREFIX)"; bad=1; }
            done
            [ "$bad" -eq 0 ] && echo "✅ 全部模块就绪 ($PREFIX)"

            # 预检提示：静态模式下这些 .pc 会在后续步骤被自动清洗
            if grep -rIl -- '-lpthread' "$PC" >/dev/null 2>&1; then
              echo "::warning::[$PREFIX] 以下 .pc 含 -lpthread（bionic 无此库，静态构建前会被清洗）:"
              grep -rIl -- '-lpthread' "$PC" || true
            fi
          done
          exit 0

      - name: Build FFmpeg (shared)
        run: |
          #!/bin/bash
          set -euo pipefail

          WORKSPACE="$(pwd)"
          NDK_DIR="$WORKSPACE/ndk"
          PREFIX="${PREFIX_SHARED:?PREFIX_SHARED 未设置}"
          OUTPUT="$WORKSPACE/output"
          FFMPEG_VERSION="${{ inputs.ffmpeg_version || env.FFMPEG_VERSION_DEFAULT }}"
          API_LEVEL="${{ env.API_LEVEL }}"
          ANDROID_TRIPLE="${{ env.ANDROID_TRIPLE }}"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          SYS_LIB="$SYSROOT/usr/lib/${ANDROID_TRIPLE}"

          export CC="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          # $ORIGIN/lib + --enable-new-dtags（→ DT_RUNPATH）
          # 链接期先写一遍；最终由 patchelf 强制收口（configure 会 eval 展开 $ORIGIN）
          LD_SHARED="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath-link,$SYS_LIB"
          LD_SHARED="$LD_SHARED -Wl,--enable-new-dtags,-rpath,\$ORIGIN/lib"

          echo "🔧 修正 pkg-config 与头文件路径 (PREFIX=$PREFIX)..."
          PC="$PREFIX/lib/pkgconfig"; mkdir -p "$PC"

          SUBDIRS=""
          if [ -d "$PREFIX/include" ]; then
            while IFS= read -r d; do
              SUBDIRS="$SUBDIRS -I$PREFIX/include/${d#./}"
            done < <(cd "$PREFIX/include" && find . -mindepth 1 -maxdepth 1 -type d ! -name 'include')
          fi

          for f in "$PC"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|\${pcfiledir}/\.\./\.\.|$PREFIX|g" "$f"
            sed -i "s|\${pcfiledir}/\.\.|$PREFIX|g" "$f"
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
            if [ -n "$SUBDIRS" ] && grep -q '^Cflags:' "$f"; then
              sed -i "s|^Cflags:.*|& $SUBDIRS|" "$f"
            fi
          done

          if [ -d "$PREFIX/include" ]; then
            find "$PREFIX/include" -mindepth 2 -name "*.h" -print0 |
              while IFS= read -r -d '' h; do
                tgt="$PREFIX/include/$(basename "$h")"
                [ -e "$tgt" ] || cp -n "$h" "$tgt"
              done
          fi

          if [ ! -d "ffmpeg" ]; then
            echo "⬇️ 下载 FFmpeg ${FFMPEG_VERSION}..."
            if ! wget -q --tries=3 --timeout=30 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
              wget -q --tries=3 --timeout=30 "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz" -O ffmpeg-mirror.tar.gz
              tar xzf ffmpeg-mirror.tar.gz && mv "FFmpeg-n${FFMPEG_VERSION}" ffmpeg
            else
              tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz" && mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg
            fi
          fi

          cd ffmpeg
          [ -f Makefile ] && { make distclean >/dev/null 2>&1 || true; }

          echo "🚀 开始构建 (shared)"
          if ! ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config \
              --enable-shared --disable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="$LD_SHARED" \
              --extra-libs="-lm -lz" ; then
            echo "::group::configure failed"
            tail -n 160 ffbuild/config.log || true
            echo "::endgroup::"
            exit 1
          fi

          make -j"$(nproc)"
          make install

          if [ -d "$OUTPUT/bin" ]; then
            cp -a "$OUTPUT/bin/." "$OUTPUT/"
            rm -rf "$OUTPUT/bin"
          fi
          mkdir -p "$OUTPUT/lib"

          echo "📦 收集第三方动态库..."
          cp -a "$PREFIX/lib"/*.so* "$OUTPUT/lib/" 2>/dev/null || true

          need_cxx=0
          for f in "$OUTPUT"/lib/*.so* "$OUTPUT"/libav*.so*; do
            [ -f "$f" ] || continue
            if readelf -d "$f" 2>/dev/null | grep -q 'NEEDED.*libc++_shared'; then
              need_cxx=1
              echo "  需要 libc++_shared: $(basename "$f")"
            fi
          done
          if [ "$need_cxx" -eq 1 ]; then
            cp -a "$SYS_LIB/libc++_shared.so" "$OUTPUT/lib/" 2>/dev/null || true
            echo "::warning::有库依赖 libc++_shared.so，已打包"
          else
            echo "✅ 无 libc++_shared 依赖"
          fi

          for bin in ffmpeg ffprobe; do
            {
              printf '%s\n' '#!/system/bin/sh'
              printf '%s\n' 'DIR=$(cd "$(dirname "$0")" 2>/dev/null && pwd)'
              printf '%s\n' '[ -n "$DIR" ] || DIR=.'
              printf '%s\n' "export LD_LIBRARY_PATH=\"\$DIR/lib\${LD_LIBRARY_PATH:+:\$LD_LIBRARY_PATH}\""
              printf '%s\n' "exec \"\$DIR/${bin}\" \"\$@\""
            } > "$OUTPUT/${bin}.sh"
            chmod +x "$OUTPUT/${bin}.sh"
          done

          {
            echo "======================================"
            echo "FFmpeg Android Build Info (SHARED)"
            echo "======================================"
            echo "Build Date    : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "FFmpeg Version: $FFMPEG_VERSION"
            echo "NDK Version   : ${{ env.NDK_VERSION }} (API $API_LEVEL)"
            echo "Prefix Used   : $PREFIX"
            echo "RUNPATH       : \$ORIGIN/lib (ffmpeg) / \$ORIGIN (.so)"
            echo "======================================"
          } > "$OUTPUT/BUILD_INFO.txt"

          echo "✅ shared 构建完成"

      # 全量 RUNPATH 收口：不依赖 configure 是否把 $ORIGIN 展开坏
      - name: Rewrite RUNPATH (patchelf)
        run: |
          set -euo pipefail

          echo "===== 1. 第三方 / libav .so → \$ORIGIN ====="
          n=0
          while IFS= read -r f; do
            patchelf --set-rpath '$ORIGIN' "$f"
            printf '  %-42s %s\n' "$(basename "$f")" "$(patchelf --print-rpath "$f")"
            n=$((n+1))
          done < <(find output/lib -maxdepth 1 -name '*.so*' -type f)
          echo "  共处理 $n 个 .so"

          echo "===== 2. ffmpeg / ffprobe → \$ORIGIN/lib ====="
          for b in ffmpeg ffprobe; do
            [ -f "output/$b" ] || continue
            patchelf --set-rpath '$ORIGIN/lib' "output/$b"
            printf '  %-42s %s\n' "$b" "$(patchelf --print-rpath "output/$b")"
          done

          echo "===== 3. 复核：必须含 \$ORIGIN ====="
          bad=0
          while IFS= read -r f; do
            rp="$(patchelf --print-rpath "$f" 2>/dev/null || true)"
            case "$rp" in
              *'$ORIGIN'*) : ;;
              *) echo "::error::$(basename "$f") RUNPATH 不合规: '${rp}'"; bad=1 ;;
            esac
          done < <(find output -maxdepth 2 \( -name '*.so*' -o -name ffmpeg -o -name ffprobe \) -type f)
          [ "$bad" -eq 0 ] && echo "✅ 全部 RUNPATH 均为 \$ORIGIN 系，与工作目录无关"
          exit $bad

      - name: Verify shared linkage
        run: |
          set -uo pipefail
          fail=0
          SYS_ALLOW="libc.so libm.so libdl.so libz.so liblog.so libandroid.so \
          libmediandk.so libcamera2ndk.so libEGL.so libGLESv2.so libjnigraphics.so \
          libnativewindow.so libsync.so libvulkan.so"
          is_sys() { for a in $SYS_ALLOW; do [ "$1" = "$a" ] && return 0; done; return 1; }
          needed_of() { readelf -d "$1" 2>/dev/null | awk '/NEEDED/{gsub(/[][\[\] ]/,"",$NF); print $NF}'; }

          echo "===== 1. ffmpeg RUNPATH 必须是 \$ORIGIN/lib ====="
          rp="$(patchelf --print-rpath output/ffmpeg 2>/dev/null || true)"
          echo "ffmpeg RUNPATH = $rp"
          case "$rp" in
            *'$ORIGIN'*) echo "✅ 使用 \$ORIGIN，可从任意目录运行" ;;
            *)           echo "::error::RUNPATH 异常: $rp"; fail=1 ;;
          esac

          echo "===== 2. 关键 .so 的 RUNPATH 必须是 \$ORIGIN ====="
          for l in libass.so libharfbuzz.so libfreetype.so; do
            [ -f "output/lib/$l" ] || continue
            r="$(patchelf --print-rpath "output/lib/$l" 2>/dev/null || true)"
            printf '  %-22s %s\n' "$l" "$r"
            case "$r" in
              *'$ORIGIN'*) : ;;
              *) echo "::error::$l RUNPATH 不是 \$ORIGIN（换了目录会找不到依赖）"; fail=1 ;;
            esac
          done

          echo "===== 3. libc++ 运行时一致性 ====="
          if [ -e output/lib/libc++_shared.so ]; then
            echo "✅ 已打包 libc++_shared.so"
          else
            n=0
            for f in output/ffmpeg output/lib/*.so*; do
              [ -f "$f" ] || continue
              needed_of "$f" | grep -qx 'libc++_shared.so' && { echo "::error::$f 需要 libc++_shared.so 但未打包"; n=$((n+1)); }
            done
            [ "$n" -eq 0 ] && echo "✅ 无库需要 libc++_shared.so"
            [ "$n" -ne 0 ] && fail=1
          fi

          echo "===== 4. 非系统 NEEDED 必须可由 output/lib 解析 ====="
          for f in output/ffmpeg output/ffprobe output/lib/*.so*; do
            [ -f "$f" ] || continue
            for n in $(needed_of "$f"); do
              is_sys "$n" && continue
              [ -e "output/lib/$n" ] || { echo "::error::$(basename "$f") 缺依赖 $n"; fail=1; }
            done
          done
          [ $fail -eq 0 ] && echo "✅ shared 依赖自洽"
          exit $fail

      # 判据：每个 LOAD 段的 p_align 数值必须 >= 0x4000（16384）
      # 不能用字符串包含 0x1000，因为 0x10000（64KB）也含该子串
      - name: Report 16KB page alignment (shared)
        run: |
          set -uo pipefail
          bad=0
          for f in output/ffmpeg output/ffprobe output/lib/*.so*; do
            [ -f "$f" ] || continue
            aligns="$(readelf -lW "$f" 2>/dev/null | awk '$1=="LOAD"{print $NF}' | sort -u)"
            [ -n "$aligns" ] || { echo "::warning::$(basename "$f") 无 LOAD 段"; continue; }
            ok=1
            for a in $aligns; do
              v=$((a))
              [ "$v" -ge 16384 ] || { ok=0; echo "::error::$(basename "$f") 存在 $a (< 0x4000) 的 LOAD 段"; bad=1; }
            done
            if [ "$ok" -eq 1 ]; then
              printf '%-46s -> %s ✅\n' "$(basename "$f")" "$(echo $aligns | tr '\n' ' ')"
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 全部 LOAD 段 p_align ≥ 0x4000，16KB 合规"
          exit $bad

      - name: Package (shared)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-shared-arm64-v8a.tar.xz output
          ls -lh ffmpeg-shared-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-shared
          path: ${{ github.workspace }}/ffmpeg-shared-arm64-v8a.tar.xz
          retention-days: 7

  # =====================================================================
  # STATIC：全静态，libc++_static + libc++abi，无 RUNPATH
  # =====================================================================
  build-static:
    name: build-ffmpeg (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config \
            nasm yasm cmake meson ninja-build git wget unzip file binutils xz-utils patchelf

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk
          key: Linux-ndk-${{ env.NDK_VERSION }}

      - name: Restore NDK permissions (cache hit)
        if: steps.cache-ndk.outputs.cache-hit == 'true'
        run: chmod -R +x "${{ github.workspace }}/ndk"

      - name: Download NDK (cache miss)
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --tries=3 --timeout=30 "${{ env.NDK_URL }}" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Verify NDK toolchain
        run: |
          set -euo pipefail
          TC="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TC/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          # 静态链接需要 libc++_static.a + libc++abi.a 两个归档
          SYS_LIB="$TC/sysroot/usr/lib/${ANDROID_TRIPLE}"
          for a in libc++_static.a libc++abi.a; do
            [ -f "$SYS_LIB/$a" ] && echo "✅ $a" || echo "::warning::缺少 $SYS_LIB/$a"
          done

      - name: Download and extract prefix
        run: |
          set -euo pipefail
          W="${{ github.workspace }}"

          FINAL_URL="${{ inputs.prefix_url }}"
          if [ -z "$FINAL_URL" ]; then
            FINAL_URL="https://github.com/CELEFT/FFmpeg/releases/download/ffmpeg-lib/ffmpeg-libs-arm64-v8a-api${API_LEVEL}-full.tar.xz"
          fi
          echo "📥 下载外部库: $FINAL_URL"
          wget -q --tries=3 --timeout=60 "$FINAL_URL" -O prefix_pkg
          file prefix_pkg

          rm -rf extract_dir && mkdir -p extract_dir
          if file prefix_pkg | grep -qi "Zip archive"; then
            unzip -q prefix_pkg -d extract_dir
          elif file prefix_pkg | grep -qi "XZ compressed"; then
            tar -xf prefix_pkg -C extract_dir
          elif file prefix_pkg | grep -qi "gzip compressed"; then
            tar -xzf prefix_pkg -C extract_dir
          else
            echo "::error::未知的压缩格式"
            exit 1
          fi

          find extract_dir -maxdepth 3 -type d | sort | head -30

          if [ -d "extract_dir/prefix" ]; then
            mv extract_dir/prefix "$W/prefix"
          elif [ -d "extract_dir/lib" ] && [ -d "extract_dir/include" ]; then
            mv extract_dir "$W/prefix"
          else
            echo "::error::解压后找不到 prefix 目录"
            exit 1
          fi

          if [ -d "$W/prefix/static" ] && [ -d "$W/prefix/shared" ]; then
            LAYOUT="two"; PST="$W/prefix/static"; PSH="$W/prefix/shared"
            echo "✅ 检测到两级布局"
          else
            LAYOUT="flat"; PST="$W/prefix"; PSH="$W/prefix"
            echo "::warning::检测到扁平布局"
          fi

          {
            echo "PREFIX_ROOT=$W/prefix"
            echo "PREFIX_STATIC=$PST"
            echo "PREFIX_SHARED=$PSH"
            echo "PREFIX_LAYOUT=$LAYOUT"
          } >> "$GITHUB_ENV"

          echo "--- static libs ---"
          ls -1 "$PST"/lib/*.a 2>/dev/null | head -40 || echo "(none)"

      - name: Preflight pkg-config & shim missing modules
        shell: bash
        run: |
          set -uo pipefail
          for PREFIX in "${PREFIX_STATIC}" "${PREFIX_SHARED}"; do
            [ -d "$PREFIX" ] || continue
            PC="$PREFIX/lib/pkgconfig"
            mkdir -p "$PC"

            echo "===== [$PREFIX] pkg-config 清点 ====="
            for m in x264 x265 dav1d vpx aom SvtAv1Enc libvvenc xeve xevd \
                     libwebp fdk-aac lame opus vorbis lc3 \
                     libass freetype2 fribidi harfbuzz openssl; do
              if PKG_CONFIG_LIBDIR="$PC" pkg-config --exists "$m" 2>/dev/null; then
                printf '  %-12s ok\n' "$m"
              else
                printf '  %-12s MISSING\n' "$m"
              fi
            done

            if [ ! -e "$PC/x264.pc" ] && { [ -e "$PREFIX/lib/libx264.a" ] || [ -e "$PREFIX/lib/libx264.so" ]; }; then
              echo "🔧 生成 x264.pc"
              {
                echo "prefix=$PREFIX"
                echo 'exec_prefix=${prefix}'
                echo 'libdir=${exec_prefix}/lib'
                echo 'includedir=${prefix}/include'
                echo
                echo 'Name: x264'
                echo 'Description: H.264/MPEG-4 AVC codec'
                echo 'Version: 164'
                echo 'Libs: -L${libdir} -lx264'
                echo 'Libs.private: -lm -ldl'
                echo 'Cflags: -I${includedir}'
              } > "$PC/x264.pc"
            fi

            if [ ! -e "$PC/openssl.pc" ] && [ -e "$PC/libssl.pc" ]; then
              echo "🔧 生成 openssl.pc"
              {
                echo "prefix=$PREFIX"
                echo 'exec_prefix=${prefix}'
                echo 'libdir=${exec_prefix}/lib'
                echo 'includedir=${prefix}/include'
                echo
                echo 'Name: openssl'
                echo 'Description: OpenSSL shim for FFmpeg'
                echo 'Version: 3.0.0'
                echo 'Libs: -L${libdir} -lssl -lcrypto'
                echo 'Libs.private: -ldl'
                echo 'Cflags: -I${includedir}'
              } > "$PC/openssl.pc"
            fi

            if [ -e "$PC/libwebp.pc" ] && [ -e "$PREFIX/lib/libsharpyuv.a" ]; then
              grep -q 'sharpyuv' "$PC/libwebp.pc" || {
                echo "🔧 libwebp.pc 补 -lsharpyuv"
                if grep -q '^Libs.private:' "$PC/libwebp.pc"; then
                  sed -i 's|^Libs.private:.*|& -lsharpyuv|' "$PC/libwebp.pc"
                else
                  echo 'Libs.private: -lsharpyuv' >> "$PC/libwebp.pc"
                fi
              }
            fi

            echo "===== [$PREFIX] 断言 ====="
            bad=0
            for m in x264 x265 dav1d vpx aom SvtAv1Enc libvvenc xeve xevd \
                     libwebp openssl libass freetype2 fribidi harfbuzz \
                     fdk-aac lame opus vorbis lc3; do
              PKG_CONFIG_LIBDIR="$PC" pkg-config --exists "$m" 2>/dev/null || {
                echo "::error::缺少 pkg-config 模块: $m ($PREFIX)"; bad=1; }
            done
            [ "$bad" -eq 0 ] && echo "✅ 全部模块就绪 ($PREFIX)"
          done
          exit 0

      - name: Preflight - static archives availability
        run: |
          set -uo pipefail
          PREFIX="${PREFIX_STATIC:?}"
          echo "===== 静态库清单 ====="
          ls -1 "$PREFIX"/lib/*.a 2>/dev/null || echo "(none)"
          echo
          echo "===== 只有 .so 没有 .a 的库 ====="
          miss=0
          for so in "$PREFIX"/lib/*.so; do
            [ -e "$so" ] || continue
            b="$(basename "$so")"; b="${b%%.so*}"
            [ -e "$PREFIX/lib/${b}.a" ] || { echo "::warning::${b}: 只有 .so"; miss=1; }
          done
          [ "$miss" -eq 0 ] && echo "✅ 全部 .so 都有对应 .a"
          exit 0

      - name: Build FFmpeg (static)
        run: |
          #!/bin/bash
          set -euo pipefail

          WORKSPACE="$(pwd)"
          NDK_DIR="$WORKSPACE/ndk"
          PREFIX="${PREFIX_STATIC:?}"
          OUTPUT="$WORKSPACE/output"
          FFMPEG_VERSION="${{ inputs.ffmpeg_version || env.FFMPEG_VERSION_DEFAULT }}"
          API_LEVEL="${{ env.API_LEVEL }}"
          ANDROID_TRIPLE="${{ env.ANDROID_TRIPLE }}"

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          SYS_LIB="$SYSROOT/usr/lib/${ANDROID_TRIPLE}"

          export CC="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          export STRIP="$TOOLCHAIN/bin/llvm-strip"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_ALLOW_CROSS=1

          # 静态：只保留 -L 与 rpath-link，刻意不加 -rpath
          LD_STATIC="-L$PREFIX/lib -Wl,-rpath-link,$PREFIX/lib -Wl,-rpath-link,$SYS_LIB"

          # NDK 的 C++ 运行时拆成两个归档，缺一不可：
          #   libc++_static.a → std::__ndk1::*、operator new/delete、std::terminate
          #   libc++abi.a     → __cxa_throw / __cxa_begin_catch / typeinfo for __class_type_info
          # 且两者互相引用（异常对象 typeinfo 需要 std::terminate，反之需要 __cxa_*）
          # → 必须用 --start-group/--end-group 让链接器回扫一轮
          CXX_STATIC="-Wl,--start-group -lc++_static -lc++abi -Wl,--end-group"

          for a in libc++_static.a libc++abi.a; do
            [ -f "$SYS_LIB/$a" ] || echo "::warning::缺少 $SYS_LIB/$a"
          done

          echo "🔧 修正 pkg-config 与头文件路径 (PREFIX=$PREFIX)..."
          PC="$PREFIX/lib/pkgconfig"; mkdir -p "$PC"

          SUBDIRS=""
          if [ -d "$PREFIX/include" ]; then
            while IFS= read -r d; do
              SUBDIRS="$SUBDIRS -I$PREFIX/include/${d#./}"
            done < <(cd "$PREFIX/include" && find . -mindepth 1 -maxdepth 1 -type d ! -name 'include')
          fi

          for f in "$PC"/*.pc; do
            [ -e "$f" ] || continue
            sed -i "s|\${pcfiledir}/\.\./\.\.|$PREFIX|g" "$f"
            sed -i "s|\${pcfiledir}/\.\.|$PREFIX|g" "$f"
            sed -i "s|^prefix=.*|prefix=$PREFIX|" "$f"
            if [ -n "$SUBDIRS" ] && grep -q '^Cflags:' "$f"; then
              sed -i "s|^Cflags:.*|& $SUBDIRS|" "$f"
            fi
          done

          # ------------------------------------------------------------------
          # 【关键修复 1】剥离 bionic 里不存在的系统库
          #
          # bionic 没有独立的 libpthread.so / librt.so / libresolv.so / libutil.so
          # （pthread_*、clock_*、mq_* 等符号都在 libc.so 内）。
          # 而 --pkg-config-flags="--static" 会把 .pc 的 Libs.private 原样展开，
          # 于是 -lpthread 进了链接行：
          #   ld.lld: error: unable to find library -lpthread
          #   ERROR: x264 not found using pkg-config
          # 前缀里的 x264/x265/vpx/aom/SvtAv1Enc/dav1d/openssl .pc 都带 -lpthread，
          # 必须逐个清洗，只改 x264 会在下一个库继续失败。
          # 注意：-ldl / -lm / -lz 不用删，NDK sysroot 里有对应 stub。
          # ------------------------------------------------------------------
          echo "🔧 静态：剥离 bionic 不存在的系统库 (-lpthread/-lrt/-lresolv/-lutil)"
          for pc in "$PC"/*.pc; do
            [ -e "$pc" ] || continue
            before="$(md5sum "$pc" | awk '{print $1}')"
            for lib in pthread rt resolv util; do
              sed -i -E "s/(^|[[:space:]])-l${lib}([[:space:]]|\$)//g" "$pc"
            done
            after="$(md5sum "$pc" | awk '{print $1}')"
            [ "$before" = "$after" ] || echo "   ↳ $(basename "$pc"): 已剥离 -lpthread/-lrt/-lresolv/-lutil"
          done

          # ------------------------------------------------------------------
          # 【关键修复 2】C++ 运行时归一
          # 静态前缀里既没有 libc++_shared.so 也没有 GNU libstdc++，
          # 若某 .pc 写了 -lc++_shared / -lstdc++，静态链接会直接 not found。
          # ------------------------------------------------------------------
          echo "🔧 静态：C++ 运行时归一 (-lc++_shared/-lstdc++ → -lc++_static -lc++abi)"
          for pc in "$PC"/*.pc; do
            [ -e "$pc" ] || continue
            if grep -q -e '-lc++_shared' -e '-lstdc++' "$pc"; then
              echo "   ↳ $(basename "$pc"): 已归一 C++ 运行时"
              sed -i -E 's/-lc\+\+_shared/-lc++_static -lc++abi/g; s/-lstdc\+\+/-lc++_static -lc++abi/g' "$pc"
            fi
          done

          # ------------------------------------------------------------------
          # 【关键修复 3】剔除悬空的 Requires.private
          # 例如 freetype2.pc 的 Requires.private 里有 libpng/brotli/bzip2/harfbuzz，
          # 本前缀并未安装这些 .pc；--static 探测时 pkg-config 会整条判失败，
          # 于是 configure 报 "freetype2/libass not found"。
          # 只保留本前缀里真实存在的模块。
          # ------------------------------------------------------------------
          echo "🔧 静态：剔除悬空的 Requires.private 模块"
          for pc in "$PC"/*.pc; do
            [ -e "$pc" ] || continue
            mod="$(basename "$pc" .pc)"
            line="$(grep -m1 '^Requires\.private:' "$pc" || true)"
            [ -n "$line" ] || continue
            rest="${line#Requires.private:}"
            # 比较符前后空格压掉、逗号折成空格，便于按 token 处理
            rest="$(printf '%s' "$rest" | sed -E 's/[[:space:]]*([<>=]+)[[:space:]]*/\1/g' | tr ',' ' ')"
            keep=""
            for tok in $rest; do
              [ -n "$tok" ] || continue
              name="${tok%%[<>=]*}"
              if PKG_CONFIG_LIBDIR="$PC" pkg-config --exists "$name" 2>/dev/null; then
                keep="${keep:+$keep, }$tok"
              else
                echo "   ↳ ${mod}: 移除不存在的私有依赖 ${name}"
              fi
            done
            if [ -n "$keep" ]; then
              sed -i "s|^Requires\.private:.*|Requires.private: $keep|" "$pc"
            else
              sed -i '/^Requires\.private:/d' "$pc"
            fi
          done

          # 断言：任何 .pc 都不允许再引用 bionic 不存在的库
          if grep -rIq -- '-lpthread' "$PC" 2>/dev/null; then
            echo "::error::.pc 仍引用 -lpthread（bionic 不存在该库，链接必然失败）:"
            grep -rIn -- '-lpthread' "$PC" || true
            exit 1
          fi
          echo "✅ .pc 已适配 bionic"

          # mkpc 生成的 .pc 的 Libs.private 只有 -lc++_static，静态链接还需要 libc++abi
          echo "🔧 .pc 私有依赖补 -lc++abi"
          while IFS= read -r pc; do
            grep -q -- '-lc++abi' "$pc" && continue
            if grep -q -- '-lc++_static' "$pc"; then
              sed -i 's|-lc++_static|-lc++_static -lc++abi|g' "$pc"
              echo "   patched $(basename "$pc")"
            fi
          done < <(find "$PC" -maxdepth 1 -name '*.pc')

          if [ -d "$PREFIX/include" ]; then
            find "$PREFIX/include" -mindepth 2 -name "*.h" -print0 |
              while IFS= read -r -d '' h; do
                tgt="$PREFIX/include/$(basename "$h")"
                [ -e "$tgt" ] || cp -n "$h" "$tgt"
              done
          fi

          echo "🔧 静态模式：隐藏有对应 .a 的 .so..."
          for f in "$PREFIX/lib"/*.so*; do
            [ -e "$f" ] || continue
            b="$(basename "$f")"; b="${b%%.so*}"
            [ -e "$PREFIX/lib/${b}.a" ] && mv "$f" "${f}.bak"
          done

          if [ ! -d "ffmpeg" ]; then
            echo "⬇️ 下载 FFmpeg ${FFMPEG_VERSION}..."
            if ! wget -q --tries=3 --timeout=30 "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"; then
              wget -q --tries=3 --timeout=30 "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n${FFMPEG_VERSION}.tar.gz" -O ffmpeg-mirror.tar.gz
              tar xzf ffmpeg-mirror.tar.gz && mv "FFmpeg-n${FFMPEG_VERSION}" ffmpeg
            else
              tar xf "ffmpeg-${FFMPEG_VERSION}.tar.xz" && mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg
            fi
          fi

          cd ffmpeg
          [ -f Makefile ] && { make distclean >/dev/null 2>&1 || true; }

          echo "🚀 开始构建 (static)"
          if ! ./configure \
              --prefix="$OUTPUT" \
              --enable-cross-compile --target-os=android \
              --arch=aarch64 --cpu=armv8-a \
              --cc="$CC" --cxx="$CXX" --ar="$AR" --ranlib="$RANLIB" --strip="$STRIP" \
              --sysroot="$SYSROOT" \
              --pkg-config=pkg-config --pkg-config-flags="--static" \
              --disable-shared --enable-static --enable-pic \
              --enable-gpl --enable-version3 --enable-nonfree \
              --enable-jni --enable-mediacodec --enable-network --enable-openssl \
              --enable-decoder=h264_mediacodec --enable-decoder=hevc_mediacodec \
              --enable-decoder=mpeg2_mediacodec --enable-decoder=mpeg4_mediacodec \
              --enable-decoder=vp8_mediacodec --enable-decoder=vp9_mediacodec \
              --enable-decoder=av1_mediacodec \
              --enable-encoder=h264_mediacodec --enable-encoder=hevc_mediacodec \
              --enable-encoder=mpeg4_mediacodec --enable-encoder=vp8_mediacodec \
              --enable-encoder=vp9_mediacodec --enable-encoder=av1_mediacodec \
              --enable-libx264 --enable-libx265 \
              --enable-libdav1d --enable-libvpx --enable-libaom --enable-libsvtav1 \
              --enable-libvvenc --enable-libxeve --enable-libxevd \
              --enable-libwebp \
              --enable-libfdk-aac --enable-libmp3lame --enable-libopus --enable-libvorbis \
              --enable-liblc3 \
              --enable-libass --enable-libfreetype --enable-libfribidi \
              --disable-doc --disable-debug \
              --extra-cflags="-I$PREFIX/include -fPIC" \
              --extra-ldflags="$LD_STATIC" \
              --extra-libs="$CXX_STATIC -lm -lz -ldl" ; then
            echo "::group::configure failed"
            tail -n 160 ffbuild/config.log || true
            echo "::endgroup::"
            exit 1
          fi

          make -j"$(nproc)" ffmpeg ffprobe

          mkdir -p "$OUTPUT"
          cp ffmpeg ffprobe "$OUTPUT/"
          $STRIP "$OUTPUT/ffmpeg" "$OUTPUT/ffprobe"

          {
            echo "======================================"
            echo "FFmpeg Android Build Info (STATIC)"
            echo "======================================"
            echo "Build Date    : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "FFmpeg Version: $FFMPEG_VERSION"
            echo "NDK Version   : ${{ env.NDK_VERSION }} (API $API_LEVEL)"
            echo "Prefix Used   : $PREFIX"
            echo "C++ Runtime   : libc++_static + libc++abi (linked in)"
            echo "RPath         : (none, by design)"
            echo "======================================"
            file "$OUTPUT/ffmpeg" || true
            readelf -d "$OUTPUT/ffmpeg" 2>/dev/null | grep NEEDED || echo "No dynamic dependencies"
          } > "$OUTPUT/BUILD_INFO.txt"

          echo "✅ static 构建完成"

      - name: Verify static linkage
        run: |
          set -uo pipefail
          fail=0
          SYS_ALLOW="libc.so libm.so libdl.so libz.so liblog.so libandroid.so \
          libmediandk.so libcamera2ndk.so libEGL.so libGLESv2.so libjnigraphics.so \
          libnativewindow.so libsync.so libvulkan.so"
          is_sys() { for a in $SYS_ALLOW; do [ "$1" = "$a" ] && return 0; done; return 1; }
          needed_of() { readelf -d "$1" 2>/dev/null | awk '/NEEDED/{gsub(/[][\[\] ]/,"",$NF); print $NF}'; }

          echo "===== 1. 不应有 output/lib ====="
          if [ -d output/lib ]; then
            echo "::error::静态产物不应包含 lib/ 目录"; fail=1
          else
            echo "✅ 无 lib/ 目录"
          fi

          echo "===== 2. NEEDED 必须在系统白名单内 ====="
          for f in output/ffmpeg output/ffprobe; do
            [ -f "$f" ] || { echo "::error::$f 不存在"; fail=1; continue; }
            for n in $(needed_of "$f"); do
              if is_sys "$n"; then echo "  ok  $(basename "$f") -> $n"
              else echo "::error::$(basename "$f") 依赖非系统库: $n"; fail=1; fi
            done
          done

          echo "===== 3. 不应残留 RUNPATH/RPATH ====="
          if readelf -d output/ffmpeg 2>/dev/null | grep -qE 'RUNPATH|RPATH'; then
            echo "::warning::静态二进制带有 RUNPATH（不影响运行）"
          else
            echo "✅ 无 RUNPATH/RPATH"
          fi

          echo "===== 4. 不应残留未解析的 C++ 符号 ====="
          if nm -u output/ffmpeg 2>/dev/null | grep -qE '_Z|__cxa_|__gxx_'; then
            echo "::error::存在未解析的 C++ 符号，libc++abi 可能仍缺失"
            nm -u output/ffmpeg 2>/dev/null | grep -E '_Z|__cxa_|__gxx_' | head -20
            fail=1
          else
            echo "✅ 无未定义 C++ 符号"
          fi

          [ $fail -eq 0 ] && echo "✅ static 验收通过：仅依赖 Android 系统库"
          exit $fail

      # 判据：每个 LOAD 段的 p_align 数值必须 >= 0x4000（16384）
      - name: Report 16KB page alignment (static)
        run: |
          set -uo pipefail
          bad=0
          for f in output/ffmpeg output/ffprobe; do
            [ -f "$f" ] || continue
            aligns="$(readelf -lW "$f" 2>/dev/null | awk '$1=="LOAD"{print $NF}' | sort -u)"
            [ -n "$aligns" ] || { echo "::warning::$(basename "$f") 无 LOAD 段"; continue; }
            ok=1
            for a in $aligns; do
              v=$((a))
              [ "$v" -ge 16384 ] || { ok=0; echo "::error::$(basename "$f") 存在 $a (< 0x4000) 的 LOAD 段"; bad=1; }
            done
            if [ "$ok" -eq 1 ]; then
              printf '%-30s -> %s ✅\n' "$(basename "$f")" "$(echo $aligns | tr '\n' ' ')"
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 全部 LOAD 段 p_align ≥ 0x4000，16KB 合规"
          exit $bad

      - name: Package (static)
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          tar -I 'xz -9e -T0' -cf ffmpeg-static-arm64-v8a.tar.xz output
          ls -lh ffmpeg-static-arm64-v8a.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-static
          path: ${{ github.workspace }}/ffmpeg-static-arm64-v8a.tar.xz
          retention-days: 7

  release:
    needs: [build-shared, build-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ffmpeg-*
          merge-multiple: true

      - name: Prepare env & checksums
        run: |
          set -euo pipefail
          {
            echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "BUILD_DATE_UTC3=$(TZ='Etc/GMT-3' date +'%Y-%m-%d %H:%M:%S')"
          } >> "$GITHUB_ENV"
          cd artifacts
          ls -lh
          sha256sum *.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'weekly-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'FFmpeg Android (arm64-v8a) — weekly' }}
          body: |
            ## FFmpeg for Android (arm64-v8a)

            - **Build Date (UTC)**: ${{ env.BUILD_DATE }}
            - **Build Date (UTC+3)**: ${{ env.BUILD_DATE_UTC3 }}
            - **NDK**: r30 / API ${{ env.API_LEVEL }}
            - **FFmpeg**: ${{ env.FFMPEG_VERSION_DEFAULT }}

            ### 1. `ffmpeg-shared-arm64-v8a.tar.xz`（动态）

            - **RUNPATH**：`ffmpeg` / `ffprobe` 为 `$ORIGIN/lib`，每个 `.so` 为 `$ORIGIN`
              → 与工作目录完全无关，`cd /anywhere && /path/to/output/ffmpeg -version` 均可运行
            - C++ 运行时：第三方库的 libc++ 已静态链入并隐藏符号，无需 `libc++_shared.so`

            ```
            output/
