name: Test libvpx (arm64-v8a)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/libvpx.yml'

env:
  NDK_VERSION: "r30"
  API_LEVEL: "36"
  NDK_URL: "https://googledownloads.cn/android/repository/android-ndk-r30-linux.zip"
  TARGET_ABI: "arm64-v8a"
  ANDROID_TRIPLE: "aarch64-linux-android"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libvpx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [static, shared]
    env:
      LINK: ${{ matrix.link }}
      PREFIX: ${{ github.workspace }}/prefix/${{ matrix.link }}
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl python3 diffutils

      - name: Download and Unpack NDK
        run: |
          set -euo pipefail
          wget -q "$NDK_URL" -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r30* "${{ github.workspace }}/ndk"
          rm -f ndk.zip
          chmod -R +x "${{ github.workspace }}/ndk"

      - name: Set toolchain env
        run: |
          set -euo pipefail
          TOOLCHAIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64"
          {
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "NDK=${{ github.workspace }}/ndk"
            echo "SYSROOT=$TOOLCHAIN/sysroot"
            echo "CC=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang"
            echo "CXX=$TOOLCHAIN/bin/${ANDROID_TRIPLE}${API_LEVEL}-clang++"
            echo "AR=$TOOLCHAIN/bin/llvm-ar"
            echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib"
            echo "STRIP=$TOOLCHAIN/bin/llvm-strip"
            echo "READELF=$TOOLCHAIN/bin/llvm-readelf"
          } >> "$GITHUB_ENV"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          set -euxo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/smoke.c
          "$CC" /tmp/smoke.c -o /tmp/smoke.out
          file /tmp/smoke.out
          echo "✅ 编译器可创建可执行文件"

      - name: Build libvpx [${{ matrix.link }}]
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          D="$GITHUB_WORKSPACE/libvpx"

          # ── 失败诊断：路径全部绝对化，不再依赖 cwd ──
          on_exit() {
            local rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then
              echo "::group::❌ 失败诊断 — libvpx [$LINK]"
              local log
              log=$(find "$D" -maxdepth 1 -name config.log 2>/dev/null | head -1 || true)
              if [ -n "${log:-}" ]; then
                echo "===== $log ：错误相关行 ====="
                grep -nE 'error:|Unknown option|not supported|only supported on' "$log" | tail -30 || true
                echo "===== $log ：末 40 行 ====="
                tail -40 "$log" || true
              else
                echo "（$D 下无 config.log — 说明死在 configure 之前）"
              fi
              local f
              for f in "$D"/config.mk "$D"/libs-*.mk "$D"/vpx_config.h; do
                [ -f "$f" ] || continue
                echo "===== $f ====="
                grep -nE 'LDFLAGS|CONFIG_SHARED|CONFIG_STATIC|CONFIG_PIC' "$f" | head -30 || true
              done
              echo "::endgroup::"
            fi
            exit $rc
          }
          trap on_exit EXIT

          [ -d libvpx ] || git clone --depth 1 https://github.com/webmproject/libvpx.git libvpx
          cd libvpx
          make distclean >/dev/null 2>&1 || true
          rm -f config.mk config.log vpx_config.h vpx_config.c libs-*.mk

          # ═══ 补丁 A：白名单加入 android ═══
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path("configure"); s = p.read_text()
          want = "linux|android|os2|solaris|darwin*|iphonesimulator*)"
          if want in s:
              print("configure: 已含 android，跳过")
          else:
              pat = r'^(?P<ind>[ \t]*)linux\|os2\|solaris\|darwin\*\|iphonesimulator\*\)[ \t]*$'
              m = re.search(pat, s, re.M)
              if not m:
                  raise SystemExit("::error::configure: 找不到白名单锚点，上游已改动")
              new = m.group("ind") + want
              p.write_text(s[:m.start()] + new + s[m.end():])
              print("configure: " + new.strip())
          PY

          # ═══ 补丁 B：注释 -static ═══
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build/make/configure.sh")
          lines = p.read_text().splitlines(keepends=True)
          n = 0
          for i, l in enumerate(lines):
              if l.strip() == "check_add_ldflags -static":
                  lines[i] = l[:len(l) - len(l.lstrip())] + "# check_add_ldflags -static\n"
                  n += 1
          if n:
              p.write_text("".join(lines))
              print("configure.sh: 已注释 %d 处 -static" % n)
          elif any(l.strip() == "# check_add_ldflags -static" for l in lines):
              print("configure.sh: 已注释，跳过")
          else:
              raise SystemExit("::error::configure.sh: 找不到 check_add_ldflags -static，上游已改动")
          PY

          echo "--- 补丁后关键行 ---"
          grep -n 'iphonesimulator\*)' configure | sed 's/^/  /' || true
          grep -n 'check_add_ldflags -static' build/make/configure.sh | sed 's/^/  /' || true

          # ═══ 工具链 ═══
          export CC CXX AR RANLIB STRIP
          export AS="$CC"

          # ═══ 链接标志（转义链：Shell → Make → ld）═══
          export LDFLAGS="-Wl,-z,max-page-size=16384 -Wl,--enable-new-dtags -Wl,-rpath,'\$\$ORIGIN'"

          if [ "$LINK" = "shared" ]; then
            LTOPT="--enable-shared --disable-static"
          else
            LTOPT="--enable-static --disable-shared"
          fi

          ./configure \
            --prefix="$PREFIX" \
            --force-target=arm64-android-gcc \
            --enable-vp8 \
            --enable-vp9 \
            $LTOPT \
            --enable-pic \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --extra-cflags="-O2 -fPIC -mno-outline-atomics --sysroot=${SYSROOT}"

          # ═══ 门禁 1：config 变量在 libs-*.mk 里，不是 config.mk ═══
          MK=$(ls libs-*-gcc.mk 2>/dev/null | head -1 || true)
          if [ -z "${MK:-}" ]; then
            echo "::error::未生成 libs-*-gcc.mk"; ls -la | head -40; exit 1
          fi
          echo "目标 mk 文件: $MK"

          echo "--- 关键项（$MK）---"
          { grep -nE '^(CONFIG_(SHARED|STATIC|PIC|VP8|VP9|MULTITHREAD)|HAVE_(NEON|NEON_DOTPROD|NEON_I8MM|SVE|SVE2))=' "$MK" || true; } | sed 's/^/  /'
          echo "--- LDFLAGS（$MK）---"
          { grep -nE '^LDFLAGS' "$MK" || true; } | sed 's/^/  /'

          # 值查找：先 $MK，再 config.mk，最后 vpx_config.h
          cfg() {
            local n="$1" v f
            for f in "$MK" config.mk; do
              [ -f "$f" ] || continue
              v=$(sed -n "s/^${n}=//p" "$f" | head -1)
              [ -n "${v:-}" ] && { printf '%s' "$v"; return 0; }
            done
            if [ -f vpx_config.h ]; then
              v=$(sed -n "s/^#define[[:space:]]\{1,\}${n}[[:space:]]\{1,\}\([0-9]\).*/\1/p" vpx_config.h | head -1)
              [ -n "${v:-}" ] && { [ "$v" = "1" ] && printf yes || printf no; return 0; }
            fi
            return 1
          }

          require() {
            local n="$1" want="$2" got
            if ! got=$(cfg "$n"); then
              echo "::error::找不到 $n（$MK / config.mk / vpx_config.h）"; return 1
            fi
            [ "$got" = "$want" ] || { echo "::error::$n=$got，期望 $want"; return 1; }
            echo "  ✅ $n=$got"
          }

          require CONFIG_PIC yes
          if [ "$LINK" = "shared" ]; then
            require CONFIG_SHARED yes
            grep -q 'ORIGIN' "$MK" || { echo "::error::$MK 无 ORIGIN，\$ORIGIN 转义失效（会退化成 RIGIN）"; exit 1; }
            echo "  ✅ LDFLAGS 含 ORIGIN"
          else
            require CONFIG_STATIC yes
          fi
          if grep -qE '(^|[[:space:]])-static([[:space:]]|$)' "$MK"; then
            echo "::error::$MK 仍含 -static，补丁 B 未生效"; exit 1
          fi
          echo "✅ 门禁 1 通过"

          # ═══ 构建 + 安装 ═══
          make -j"$(nproc)"
          make install

          # ═══ 门禁 2：产物 ═══
          if [ -f "$PREFIX/lib/pkgconfig/vpx.pc" ]; then echo "✅ vpx.pc 已安装"
          else echo "::warning::未找到 vpx.pc"; fi

          if [ "$LINK" = "shared" ]; then
            so="$PREFIX/lib/libvpx.so"
            [ -e "$so" ] || { echo "::error::未生成 $so"; ls -l "$PREFIX/lib" 2>/dev/null; exit 1; }

            echo "--- RUNPATH ---"
            { "$READELF" -d "$so" | grep -E 'RUNPATH|RPATH' || true; } | sed 's/^/  /'
            "$READELF" -d "$so" | grep -q '\[\$ORIGIN\]' || { echo "::error::RUNPATH 不是 \$ORIGIN"; exit 1; }

            echo "--- DT_NEEDED ---"
            { "$READELF" -d "$so" | grep NEEDED || true; } | sed 's/^/  /'

            echo "--- 架构 / 对齐 ---"
            { "$READELF" -h "$so" | awk -F: '/Machine|Class/{print "  "$2}'; } || true
            align=$("$READELF" -lW "$so" | awk '/ LOAD /{print $NF}' | sort -u | tr '\n' ' ' || true)
            echo "  LOAD p_align = ${align:-<none>}"
            case "${align:-}" in
              *0x1000*) echo "::error::含 4KB LOAD 段，max-page-size 未生效"; exit 1 ;;
              *0x4000*) echo "  ✅ 16KB 对齐" ;;
              *)        echo "::warning::p_align 异常：${align:-<none>}" ;;
            esac

            if "$READELF" -d "$so" | grep -q 'NEEDED.*libc++_shared.so'; then
              echo "::notice::依赖 libc++_shared.so（webm_io/libyuv 启用所致）→ 随包分发"
              cp -f "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" "$PREFIX/lib/"
              "$READELF" -h "$PREFIX/lib/libc++_shared.so" | grep -q 'AArch64' || {
                echo "::error::libc++_shared.so 不是 AArch64"; exit 1; }
              echo "✅ 已随包分发 aarch64 libc++_shared.so"
            else
              echo "✅ 不依赖 libc++_shared.so"
            fi
          else
            [ -e "$PREFIX/lib/libvpx.a" ] || { echo "::error::未生成 libvpx.a"; ls -l "$PREFIX/lib" 2>/dev/null; exit 1; }
            echo "✅ libvpx.a $(du -h "$PREFIX/lib/libvpx.a" | cut -f1)"
          fi
          echo "✅ 门禁 2 通过 — libvpx [$LINK]"

      - name: Upload prefix [${{ matrix.link }}]
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpx-${{ matrix.link }}
          path: ${{ github.workspace }}/prefix/${{ matrix.link }}
          if-no-files-found: warn
          retention-days: 3
   verify:
    needs: build-libvpx
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download prefixes
        uses: actions/download-artifact@v4
        with:
          pattern: vpx-*
          path: ${{ github.workspace }}/prefix

      - name: Verify artifacts
        shell: bash
        run: |
          set -uo pipefail
          P="${{ github.workspace }}/prefix"
          # pattern 下载时，每个 artifact 落在同名子目录：prefix/vpx-<link>/
          DS="$P/vpx-static"
          DH="$P/vpx-shared"

          echo "===== 顶层布局 ====="
          find "$P" -maxdepth 2 | sort || true

          echo "===== static ====="
          if [ -d "$DS" ]; then
            find "$DS" -maxdepth 2 \( -name '*.a' -o -name '*.pc' \) 2>/dev/null | sort || true
            if [ -f "$DS/lib/libvpx.a" ]; then
              echo "  ✅ libvpx.a $(du -h "$DS/lib/libvpx.a" | cut -f1)"
            else
              echo "::error::static 变体缺 libvpx.a"
            fi
          else
            echo "::error::缺少 $DS（static job 未上传产物）"
          fi

          echo "===== shared ====="
          if [ -d "$DH" ]; then
            find "$DH/lib" -maxdepth 1 -name 'libvpx.so*' 2>/dev/null | sort | while IFS= read -r f; do
              if [ -L "$f" ]; then
                printf '  %-24s -> %s\n' "$(basename "$f")" "$(readlink "$f")"
              else
                printf '  %-24s (regular, %s)\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
              fi
            done || true

            real="$DH/lib/libvpx.so.12.1.0"
            [ -e "$real" ] || real="$(find "$DH/lib" -maxdepth 1 -name 'libvpx.so.*.*.*' -type f 2>/dev/null | head -1 || true)"

            if [ -n "${real:-}" ] && [ -e "$real" ]; then
              echo "--- 实体文件：$(basename "$real") ---"
              echo -n "  SONAME   = "; readelf -d "$real" 2>/dev/null | sed -n 's/.*SONAME.*\[\(.*\)\].*/\1/p' || true
              echo -n "  RUNPATH  = "; readelf -d "$real" 2>/dev/null | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p' || true
              echo -n "  Machine  = "; readelf -h "$real" 2>/dev/null | awk -F: '/Machine/{gsub(/^ +/,"",$2); print $2}' || true
              echo -n "  p_align  = "; readelf -lW "$real" 2>/dev/null | awk '/ LOAD /{print $NF}' | sort -u | tr '\n' ' ' || true
              echo

              echo "--- DT_NEEDED ---"
              readelf -d "$real" 2>/dev/null | sed -n 's/.*NEEDED.*\[\(.*\)\].*/  \1/p' || true

              echo "--- 断言 ---"
              rp=$(readelf -d "$real" 2>/dev/null | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p' || true)
              [ "${rp:-}" = '$ORIGIN' ] || { echo "::error::RUNPATH=$rp，应为 \$ORIGIN"; exit 1; }
              readelf -lW "$real" 2>/dev/null | awk '/ LOAD /{print $NF}' | sort -u | grep -qx '0x4000' \
                || echo "::warning::LOAD p_align 不是纯 0x4000"
              echo "✅ RUNPATH / 对齐 复核通过"
            else
              echo "::error::shared 变体找不到实体 .so"
            fi
          else
            echo "::error::缺少 $DH（shared job 未上传产物）"
          fi

          echo "===== 汇总 ====="
          echo "static: $(find "$DS/lib" -maxdepth 1 -name '*.a' 2>/dev/null | wc -l) 个 .a, $(find "$DS/lib/pkgconfig" -name '*.pc' 2>/dev/null | wc -l) 个 .pc"
          echo "shared: $(find "$DH/lib" -maxdepth 1 -name 'libvpx.so*' 2>/dev/null | wc -l) 个 .so*, $(find "$DH/lib/pkgconfig" -name '*.pc' 2>/dev/null | wc -l) 个 .pc" 
